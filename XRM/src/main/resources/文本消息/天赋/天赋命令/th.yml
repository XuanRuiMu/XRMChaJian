    未找到: "[错误]<white>ไม่พบความสามารถ: <white>{0}"

  信息:
    用法: "[错误]<white>วิธีใช้: [警告]/talent info <talentID>"
    详情标题: "[计分板标题]═══ รายละเอียดความสามารถ ═══"
    名称: "<white>ชื่อ: {0}"
    ID: "[冷却]ID: {0}"
    类型: "[冷却]ประเภท: {0}"
    描述: "<white>คำอธิบาย: {0}"
    位置: "[冷却]ตำแหน่ง: ({0}, {1})"
    所需点数: "[冷却]แต้มที่ต้องการ: {0}"
    前置天赋: "[冷却]ข้อกำหนดเบื้องต้น (ข้อใดข้อหนึ่ง): {0}"
    选择组: "[冷却]กลุ่มเลือก: {0}"
    替代: "[冷却]  ทางเลือก: {0}"
    状态: "<{0}>{1}</{0}>"
    状态已学习: "green"
    状态未学习: "red"
    未找到: "[错误]<white>ไม่พบความสามารถ: <white>{0}"

