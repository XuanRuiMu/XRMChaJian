天赋命令:

  仅玩家: "[错误]<white>เฉพาะผู้เล่นเท่านั้นที่สามารถใช้คำสั่งนี้ได้"
  未知子命令: "[错误]<white>คำสั่งย่อยที่ไม่รู้จัก: <white>{0}"

  重置:
    未找到专精: "[错误]<white>ไม่พบความเชี่ยวชาญ: <white>{0}"
    成功: "[成功]รีเซ็ตความสามารถแล้ว!"
    失败: "[错误]<white>รีเซ็ตความสามารถล้มเหลว กรุณาลองอีกครั้ง"

  列表:
    树标题: "[计分板标题]═══ {0} ═══"
    已投入: "[警告]แต้มที่ใช้: {0} / {1}"
    天赋项: "[成功]  ✔ {0} [冷却]- {1}"
    无天赋: "[警告]<white>คุณยังไม่ได้เรียนรู้ความสามารถใดๆ"

  学习:
    用法: "[错误]<white>วิธีใช้: [警告]/talent learn <talentID>"
