    标题: "[计分板标题]═══ ความช่วยเหลือคำสั่งความสามารถ ═══"
    菜单: "[警告]/talent <white>- เปิดเมนูความสามารถ"
    重置: "[警告]/talent reset [spec] <white>- รีเซ็ตความสามารถ"
    列表: "[警告]/talent list <white>- แสดงความสามารถที่เรียนรู้"
    学习: "[警告]/talent learn <talentID> <white>- เรียนรู้ความสามารถ"
