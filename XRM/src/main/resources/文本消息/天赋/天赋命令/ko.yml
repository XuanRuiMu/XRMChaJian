天赋命令:

  仅玩家: "[错误]<white>플레이어만 이 명령어를 사용할 수 있습니다."
  未知子命令: "[错误]<white>알 수 없는 하위 명령어: <white>{0}"

  重置:
    未找到专精: "[错误]<white>전문화를 찾을 수 없습니다: <white>{0}"
    成功: "[成功]재능이 초기화되었습니다!"
    失败: "[错误]<white>재능 초기화 실패, 나중에 다시 시도해 주세요."

  列表:
    树标题: "[计分板标题]═══ {0} ═══"
    已投入: "[警告]투자 포인트: {0} / {1}"
    天赋项: "[成功]  ✔ {0} [冷却]- {1}"
    无天赋: "[警告]<white>아직 재능을 습득하지 않았습니다."

  学习:
    用法: "[错误]<white>사용법: [警告]/talent learn <재능ID>"
    成功: "[成功]재능 습득: {0}"
    未找到: "[错误]<white>재능을 찾을 수 없습니다: <white>{0}"

  信息:
    用法: "[错误]<white>사용법: [警告]/talent info <재능ID>"
    详情标题: "[计分板标题]═══ 재능 상세정보 ═══"
    名称: "<white>이름: {0}"
    ID: "[冷却]ID: {0}"
    类型: "[冷却]유형: {0}"
    描述: "<white>설명: {0}"
    位置: "[冷却]위치: ({0}, {1})"
    所需点数: "[冷却]필요 포인트: {0}"
    前置天赋: "[冷却]전제 조건 (하나 이상): {0}"
    选择组: "[冷却]선택 그룹: {0}"
    替代: "[冷却]  대안: {0}"
    状态: "<{0}>{1}</{0}>"
    状态已学习: "green"
    状态未学习: "red"
    未找到: "[错误]<white>재능을 찾을 수 없습니다: <white>{0}"

  帮助:
    标题: "[计分板标题]═══ 재능 명령어 도움말 ═══"
    菜单: "[警告]/talent <white>- 재능 메뉴 열기"
    重置: "[警告]/talent reset [spec] <white>- 재능 초기화"
    列表: "[警告]/talent list <white>- 습득한 재능 목록"
    学习: "[警告]/talent learn <재능ID> <white>- 재능 습득"
    信息: "[警告]/talent info <재능ID> <white>- 재능 상세정보 보기"
