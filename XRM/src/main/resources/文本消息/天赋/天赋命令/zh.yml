# ============================================
# 暮澜纪元插件 - 天赋命令 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

天赋命令:

  仅玩家: "<red><white>只有玩家才能使用此指令。"
  未知子命令: "<red><white>未知的子命令: <white>{0}"

  菜单:
    打开成功: "<green>已打开天赋菜单"

  重置:
    未找到专精: "<red><white>未找到专精: <white>{0}"
    成功: "<green>天赋已重置！"
    失败: "<red><white>天赋重置失败，请稍后重试。"

  列表:
    树标题: "<gold><bold>═══ {0} ═══</bold></gold>"
    已投入: "<yellow>已投入: {0} / {1} 点"
    天赋项: "<green>  ✔ {0} <dark_gray>- {1}"
    无天赋: "<yellow><white>你还没有学习任何天赋。"

  学习:
    用法: "<red><white>用法: <yellow>/天赋 learn <天赋ID>"
    成功: "<green>已学习天赋: {0}"
    失败: "<red><white>学习天赋失败: <white>{0}"
    未找到: "<red><white>未找到天赋: <white>{0}"

  信息:
    格式: "<white>{0}: <gray>{1}"
    用法: "<red><white>用法: <yellow>/天赋 info <天赋ID>"
    详情标题: "<gold><bold>═══ 天赋详情 ═══</bold></gold>"
    名称: "<white>名称: {0}"
    ID: "<dark_gray>ID: {0}"
    类型: "<dark_gray>类型: {0}"
    描述: "<white>描述: {0}"
    位置: "<dark_gray>位置: ({0}, {1})"
    所需点数: "<dark_gray>所需总点数: {0}"
    前置天赋: "<dark_gray>前置天赋（满足任一）: {0}"
    选择组: "<dark_gray>选择组: {0}"
    替代: "<dark_gray>  替代: {0}"
    状态: "<{0}>{1}</{0}>"
    状态已学习: "green"
    状态未学习: "red"
    未找到: "<red><white>未找到天赋: <white>{0}"

  帮助:
    标题: "<gold><bold>═══ 天赋命令帮助 ═══</bold></gold>"
    菜单: "<yellow>/天赋 <white>- 打开天赋菜单"
    重置: "<yellow>/天赋 reset [专精] <white>- 重置天赋"
    列表: "<yellow>/天赋 list <white>- 列出已学天赋"
    学习: "<yellow>/天赋 learn <天赋ID> <white>- 学习天赋"
    信息: "<yellow>/天赋 info <天赋ID> <white>- 查看天赋详情"
