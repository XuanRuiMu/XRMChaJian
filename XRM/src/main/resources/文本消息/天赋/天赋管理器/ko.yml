天赋管理器:

  学习:
    未找到专精: "[错误]<white>전문화 재능 트리를 찾을 수 없습니다: <white>{0}"
    未找到天赋: "[错误]<white>재능을 찾을 수 없습니다: <white>{0}"
    已经学习: "[错误]<white>이미 이 재능을 습득했습니다."
    点数用完: "[错误]<white>재능 포인트가 소진되었습니다."
    点数不足: "[错误]<white>이 트리에서 잠금 해제하려면 더 많은 재능 포인트가 필요합니다 (필요 [点数:{0}], 보유 [点数:{1}])"
    前置未满足: "[错误]<white>전제 재능이 충족되지 않았습니다."
    选择组冲突: "[错误]<white>습득한 재능「{0}」과 충돌, 선택 그룹당 하나만 선택 가능."
    保存失败: "[错误]<white>데이터베이스 저장 실패."

  取消:
    未学习: "[错误]<white>재능을 습득하지 않았습니다."
    依赖冲突: "[错误]<white>재능「{0}」이 이것에 의존합니다, 먼저 취소해 주세요."
    删除失败: "[错误]<white>데이터베이스 삭제 실패."
