# ============================================
# 暮澜纪元插件 - 天赋管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

天赋管理器:

  学习:
    未找到专精: "[错误]<white>未找到专精天赋树: <white>{0}"
    未找到天赋: "[错误]<white>未找到天赋: <white>{0}"
    已经学习: "[错误]<white>已经学习了该天赋。"
    点数用完: "[错误]<white>天赋点数已用完。"
    点数不足: "[错误]<white>需要在此树中投入更多天赋点数才能解锁（需要[点数:{0}]点，当前[点数:{1}]点）"
    前置未满足: "[错误]<white>前置天赋未满足。"
    选择组冲突: "[错误]<white>与已学天赋「{0}」冲突，同一选择组只能选择一个。"
    保存失败: "[错误]<white>数据库保存失败。"

  取消:
    未学习: "[错误]<white>未学习该天赋。"
    依赖冲突: "[错误]<white>天赋「{0}」依赖此天赋，请先取消该天赋。"
    删除失败: "[错误]<white>数据库删除失败。"
