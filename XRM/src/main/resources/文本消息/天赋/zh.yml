# ============================================
# 暮澜纪元插件 - 天赋节点名称与描述 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

# 天赋管理器新增消息键
天赋管理器:
  通用:
    未找到会话: "[错误]<white>未找到玩家会话，请重新登录。"
