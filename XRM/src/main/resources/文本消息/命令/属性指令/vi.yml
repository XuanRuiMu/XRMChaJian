属性指令:

  用法:
    标题: "[警告]Cách dùng:"
    查看自己: "  [冷却]/stats <white>- Xem thuộc tính của bạn"
    查看自己简写: "  [冷却]/sx <white>- Xem thuộc tính của bạn (viết tắt)"
    查看他人: "  [冷却]/stats <player> <white>- Xem thuộc tính của người chơi khác"
    查看他人简写: "  [冷却]/sx <player> <white>- Xem thuộc tính của người chơi khác (viết tắt)"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "Chưa chọn lớp"
    等级后缀: ""
    的属性: " - Thuộc tính"
    主属性标题: "[Thuộc tính chính]"
    生存属性标题: "[Thuộc tính sinh tồn]"
    战斗属性标题: "[Thuộc tính chiến đấu]"
    基础公共冷却时间前缀: "(GCD cơ bản: "
    基础公共冷却时间后缀: ")"

  属性名:
    力量: "Sức mạnh"
    敏捷: "Nhanh nhẹn"
    智力: "Trí tuệ"
    生命值: "Máu"
    生命恢复: "Hồi máu"
    躲闪几率: "[躲闪]Tỉ lệ"
    公共冷却时间: "[公共冷却时间]"
