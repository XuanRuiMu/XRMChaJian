属性指令:

  用法:
    标题: "[警告]Kullanım:"
    查看自己: "  [冷却]/stats <white>- Özelliklerini görüntüle"
    查看自己简写: "  [冷却]/sx <white>- Özelliklerini görüntüle (kısayol)"
    查看他人: "  [冷却]/stats <player> <white>- Başka bir oyuncunun özelliklerini görüntüle"
    查看他人简写: "  [冷却]/sx <player> <white>- Başka bir oyuncunun özelliklerini görüntüle (kısayol)"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "Sınıfsız"
    等级后缀: ""
    的属性: " Özellikleri"
    主属性标题: "[Temel Özellikler]"
    生存属性标题: "[Hayatta Kalma Özellikleri]"
    战斗属性标题: "[Savaş Özellikleri]"
    基础公共冷却时间前缀: "(Temel GCD: "
    基础公共冷却时间后缀: ")"

  属性名:
    力量: "Güç"
    敏捷: "Çeviklik"
    智力: "Zeka"
    生命值: "Sağlık"
    生命恢复: "Sağlık Yenilenmesi"
    躲闪几率: "[躲闪]Şans"
    公共冷却时间: "[公共冷却时间]"
    急速: "Acelecilik"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "Uzmanlık"
    全能: "Çok Yönlülük"
    吸血: "[吸血]"
    移速: "Hız"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"
    躲闪: "<light_purple>{0}: {1}% {2}</light_purple>"
  单位:
    秒: "sn"
    每秒: "/sn"
    百分比: "%"

  构成:
    基础: "Temel"
    装备: "Ekipman"
    天赋: "Yetenek"
    临时: "Geçici"
    分隔符: ", "
    左括号: "("
    右括号: ")"
    数值分隔符: ": "
