属性指令:

  用法:
    标题: "[警告]使い方:"
    查看自己: "  [冷却]/stats <white>- 自分の属性を表示"
    查看自己简写: "  [冷却]/sx <white>- 自分の属性を表示（略称）"
    查看他人: "  [冷却]/stats <player> <white>- 他のプレイヤーの属性を表示"
    查看他人简写: "  [冷却]/sx <player> <white>- 他のプレイヤーの属性を表示（略称）"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "クラスなし"
    等级后缀: ""
    的属性: "の属性"
    主属性标题: "[主要属性]"
    生存属性标题: "[生存属性]"
    战斗属性标题: "[戦闘属性]"
    基础公共冷却时间前缀: "(基礎GCD: "
    基础公共冷却时间后缀: ")"

  属性名:
    力量: "筋力"
    敏捷: "敏捷"
    智力: "知力"
    生命值: "体力"
    生命恢复: "体力再生"
    躲闪几率: "[躲闪]確率"
    公共冷却时间: "[公共冷却时间]"
    急速: "ヘイスト"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "熟練"
    全能: "多用性"
    吸血: "[吸血]"
    移速: "移動速度"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"
    躲闪: "<light_purple>{0}: {1}% {2}</light_purple>"
  单位:
    秒: "秒"
    每秒: "/秒"
    百分比: "%"

  构成:
    基础: "基礎"
    装备: "装備"
    天赋: "才能"
    临时: "一時"
    分隔符: "、"
    左括号: "（"
    右括号: "）"
    数值分隔符: "："
