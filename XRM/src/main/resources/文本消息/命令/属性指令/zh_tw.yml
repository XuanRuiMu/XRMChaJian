属性指令:

  用法:
    标题: "[警告]用法:"
    查看自己: "  [冷却]/属性 <white>- 查看自己的屬性"
    查看自己简写: "  [冷却]/sx <white>- 查看自己的屬性（簡寫）"
    查看他人: "  [冷却]/属性 <玩家名> <white>- 查看指定玩家屬性"
    查看他人简写: "  [冷却]/sx <玩家名> <white>- 查看指定玩家屬性（簡寫）"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "未選擇"
    等级后缀: "級"
    的属性: "的屬性"
    主属性标题: "【主屬性】"
    生存属性标题: "【生存屬性】"
    战斗属性标题: "【戰鬥屬性】"
    基础公共冷却时间前缀: "（基礎公共冷卻時間："
    基础公共冷却时间后缀: "）"

  属性名:
    力量: "力量"
    敏捷: "敏捷"
    智力: "智力"
    生命值: "生命值"
    生命恢复: "生命恢復"
    躲闪几率: "[躲闪]機率"
    公共冷却时间: "[公共冷却时间:公共冷卻時間]"
    急速: "急速"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "精通"
    全能: "全能"
    吸血: "[吸血]"
    移速: "移速"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"
    躲闪: "<light_purple>{0}: {1}% {2}</light_purple>"
  单位:
    秒: "秒"
    每秒: "/秒"
    百分比: "%"

  构成:
    基础: "基礎"
    装备: "裝備"
    天赋: "天賦"
    临时: "臨時"
    分隔符: "，"
    左括号: "（"
    右括号: "）"
    数值分隔符: "："
