属性指令:

  用法:
    标题: "[警告]사용법:"
    查看自己: "  [冷却]/stats <white>- 내 속성 보기"
    查看自己简写: "  [冷却]/sx <white>- 내 속성 보기 (단축)"
    查看他人: "  [冷却]/stats <player> <white>- 다른 플레이어 속성 보기"
    查看他人简写: "  [冷却]/sx <player> <white>- 다른 플레이어 속성 보기 (단축)"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "클래스 없음"
    等级后缀: ""
    的属性: "의 속성"
    主属性标题: "[주 속성]"
    生存属性标题: "[생존 속성]"
    战斗属性标题: "[전투 속성]"
    基础公共冷却时间前缀: "(기본 GCD: "
    基础公共冷却时间后缀: ")"

  属性名:
    力量: "힘"
    敏捷: "민첩"
    智力: "지능"
    生命值: "체력"
    生命恢复: "체력 재생"
    躲闪几率: "[躲闪]확률"
    公共冷却时间: "[公共冷却时间]"
    急速: "가속"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "숙련"
    全能: "유연성"
    吸血: "[吸血]"
    移速: "이동 속도"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"
    躲闪: "<light_purple>{0}: {1}% {2}</light_purple>"
  单位:
    秒: "초"
    每秒: "/초"
    百分比: "%"

  构成:
    基础: "기본"
    装备: "장비"
    天赋: "특성"
    临时: "임시"
    分隔符: ", "
    左括号: "("
    右括号: ")"
    数值分隔符: ": "
