# ============================================
# 暮澜纪元插件 - 属性指令 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

属性指令:

  用法:
    标题: "<yellow>用法:"
    查看自己: "  <dark_gray>/属性 <white>- 查看自己的属性"
    查看自己简写: "  <dark_gray>/sx <white>- 查看自己的属性（简写）"
    查看他人: "  <dark_gray>/属性 <玩家名> <white>- 查看指定玩家属性"
    查看他人简写: "  <dark_gray>/sx <玩家名> <white>- 查看指定玩家属性（简写）"

  界面:
    分隔线: "<gold><bold>====================================================="
    标题行: "<gold><bold>{0}<aqua>{1}<black>\"<white>{2}<black>\"<yellow>{3}"
    主属性标题: "<blue>{0}"
    生存属性标题: "<green>{0}"
    战斗属性标题: "<red>{0}"
    公共冷却行: "<dark_gray>{0}<gray>{1}"

  属性界面:
    无职业: "未选择"
    等级后缀: "级"
    的属性: "的属性"
    主属性标题: "【主属性】"
    生存属性标题: "【生存属性】"
    战斗属性标题: "【战斗属性】"
    基础公共冷却时间前缀: "（基础公共冷却时间："
    基础公共冷却时间后缀: "）"

  属性名:
    力量: "[力量]"
    敏捷: "[敏捷]"
    智力: "[智力]"
    生命值: "[生命值]"
    生命恢复: "[生命恢复]"
    躲闪几率: "<light_purple>躲闪几率</light_purple>"
    公共冷却时间: "[公共冷却时间]"
    急速: "[急速]"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "[精通]"
    全能: "[全能]"
    吸血: "[吸血]"
    移速: "[移速]"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"

    躲闪: "{0}<white>: <white>{1}<white>% <aqua>{2}"
  单位:
    秒: "秒"
    每秒: "/秒"
    百分比: "%"

  构成:
    基础: "基础"
    装备: "装备"
    天赋: "天赋"
    临时: "临时"
    分隔符: "，"
    左括号: "（"
    右括号: "）"
    数值分隔符: "："
  公共冷却构成:
    急速: "急速"
    其他: "其他"
