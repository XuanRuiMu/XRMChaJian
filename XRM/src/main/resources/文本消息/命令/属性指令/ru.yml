属性指令:

  用法:
    标题: "[警告]Использование:"
    查看自己: "  [冷却]/stats <white>- Просмотреть свои атрибуты"
    查看自己简写: "  [冷却]/sx <white>- Просмотреть свои атрибуты (сокращение)"
    查看他人: "  [冷却]/stats <player> <white>- Просмотреть атрибуты другого игрока"
    查看他人简写: "  [冷却]/sx <player> <white>- Просмотреть атрибуты другого игрока (сокращение)"

  界面:
    分隔线: "[暴击]====================================================="
    标题行: "[暴击]{0}[冰霜]{1}[黑色]\"[玩家名]{2}[黑色]\"[神圣]{3}"
    主属性标题: "[魔法]{0}"
    生存属性标题: "[增益]{0}"
    战斗属性标题: "[输出]{0}"
    公共冷却行: "[公共冷却]{0}[物理]{1}"

  属性界面:
    无职业: "Без класса"
    等级后缀: ""
    的属性: " - Атрибуты"
    主属性标题: "[Основные атрибуты]"
    生存属性标题: "[Атрибуты выживания]"
    战斗属性标题: "[Боевые атрибуты]"
    基础公共冷却时间前缀: "(Базовый GCD: "
    基础公共冷却时间后缀: ")"

  属性名:
    力量: "Сила"
    敏捷: "Ловкость"
    智力: "Интеллект"
    生命值: "Здоровье"
    生命恢复: "Восстановление здоровья"
    躲闪几率: "[躲闪]Шанс"
    公共冷却时间: "[公共冷却时间]"
    急速: "Скорость"
    法术暴击几率: "[法术暴击几率]"
    法术暴击伤害: "[法术暴击伤害]"
    精通: "Искусность"
    全能: "Универсальность"
    吸血: "[吸血]"
    移速: "Скорость перемещения"
  属性行:
    普通: "{0}<white>: <white>{1} <aqua>{2}"
    带单位: "{0}<white>: <white>{1}{2} <aqua>{3}"
    百分比: "{0}<white>: <white>{1}<white>% <aqua>{2}"
    生命值: "{0}<white>: <white>{1}<white>/<white>{2} <aqua>{3}"
    公共冷却: "{0}<white>: <white>{1}{2} <aqua>{3}"
    躲闪: "<light_purple>{0}: {1}% {2}</light_purple>"
  单位:
    秒: "с"
    每秒: "/с"
    百分比: "%"

  构成:
    基础: "База"
    装备: "Снаряжение"
    天赋: "Талант"
    临时: "Врем."
    分隔符: ", "
    左括号: "("
    右括号: ")"
    数值分隔符: ": "
