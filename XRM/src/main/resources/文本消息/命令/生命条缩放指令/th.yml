生命条缩放指令:

  模式:
    总体个数: "ทั้งหมด"
    单体个数: "ต่อหัวใจ"

  当前设置: "<white>การตั้งค่า [生命条] ปัจจุบัน: {0}<white>, ค่า: [其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== คำสั่งปรับสเกลแถบพลังชีวิต ==="
    总体个数: "[冷却]/healthbarscale total <value> <white>- ตั้งค่าจำนวนหัวใจทั้งหมด (1-100)"
    单体个数: "[冷却]/healthbarscale perheart <value> <white>- ตั้งค่า HP ต่อหัวใจ (1-1000)"
    重置: "[冷却]/healthbarscale reset <white>- รีเซ็ตเป็นค่าเริ่มต้น ({0} หัวใจ)"
  错误: "[错误]<white>คำสั่งย่อยไม่รู้จัก ใช้ /healthbarscale เพื่อดูวิธีใช้"

  设置成功:
    总体个数: "<white>ตั้งค่าแสดง [生命条] เป็น [其他数值:{0}]<white> หัวใจ"
    单体个数: "<white>ตั้งค่าแต่ละหัวใจแทน [其他数值:{0}]<white> [生命条]"

  重置成功: "<white>รีเซ็ตการตั้งค่า [生命条] เป็นค่าเริ่มต้น ([其他数值:{0}]<white> หัวใจ)"

  通用:
    无效数字: "[ข้อผิดพลาด]ตัวเลขไม่ถูกต้อง: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>ค่าต้องอยู่ระหว่าง 1-100"
      单体: "[错误]<white>ค่าต้องอยู่ระหว่าง 1-1000"
