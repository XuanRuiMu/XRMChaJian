# ============================================
# 暮澜纪元插件 - 生命条缩放指令 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

生命条缩放指令:

  模式:
    总体个数: "总体个数"
    单体个数: "单体个数"

  当前设置: "<white>当前[生命条]设置：{0}<white>，数值：[其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== 生命条缩放命令用法 ==="
    总体个数: "[冷却]/生命条缩放 总体个数 <数值> <white>- 设置显示的红心总数量（1-100）"
    单体个数: "[冷却]/生命条缩放 单体个数 <数值> <white>- 设置每颗红心代表的生命值（1-1000）"
    重置: "[冷却]/生命条缩放 重置 <white>- 重置为默认设置（{0}颗红心）"
    错误: "[错误]<white>未知的子命令，请使用 /生命条缩放 查看用法"

  设置成功:
    总体个数: "<white>已设置[生命条]显示为[其他数值:{0}]<white>颗红心"
    单体个数: "<white>已设置每颗红心代表[其他数值:{0}]<white>点[生命条]"

  重置成功: "<white>已重置[生命条]设置为默认（[其他数值:{0}]<white>颗红心）"

  通用:
    无效数字: "[错误]无效的数字: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>数值必须在 1-100 之间"
      单体: "[错误]<white>数值必须在 1-1000 之间"
