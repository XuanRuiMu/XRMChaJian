生命条缩放指令:

  模式:
    总体个数: "Всего"
    单体个数: "За сердце"

  当前设置: "<white>Текущая настройка [生命条]: {0}<white>, значение: [其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== Команда масштабирования полоски здоровья ==="
    总体个数: "[冷却]/healthbarscale total <value> <white>- Установить общее количество сердец (1-100)"
    单体个数: "[冷却]/healthbarscale perheart <value> <white>- Установить HP за сердце (1-1000)"
    重置: "[冷却]/healthbarscale reset <white>- Сбросить по умолчанию ({0} сердец)"
  错误: "[错误]<white>Неизвестная подкоманда, используйте /healthbarscale для справки"

  设置成功:
    总体个数: "<white>Отображение [生命条] установлено на [其他数值:{0}]<white> сердец"
    单体个数: "<white>Каждое сердце представляет [其他数值:{0}]<white> [生命条]"

  重置成功: "<white>Настройки [生命条] сброшены по умолчанию ([其他数值:{0}]<white> сердец)"

  通用:
    无效数字: "[Ошибка]Неверное число: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>Значение должно быть от 1 до 100"
      单体: "[错误]<white>Значение должно быть от 1 до 1000"
