生命条缩放指令:

  模式:
    总体个数: "總體個數"
    单体个数: "單體個數"

  当前设置: "<white>當前[生命条]設定：{0}<white>，數值：[其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== 生命條縮放命令用法 ==="
    总体个数: "[冷却]/生命條縮放 總體個數 <數值> <white>- 設定顯示的紅心總數量（1-100）"
    单体个数: "[冷却]/生命條縮放 單體個數 <數值> <white>- 設定每顆紅心代表的生命值（1-1000）"
    重置: "[冷却]/生命條縮放 重置 <white>- 重置為預設設定（{0}顆紅心）"
  错误: "[错误]<white>未知的子命令，請使用 /生命條縮放 查看用法"

  设置成功:
    总体个数: "<white>已設定[生命条]顯示為[其他数值:{0}]<white>顆紅心"
    单体个数: "<white>已設定每顆紅心代表[其他数值:{0}]<white>點[生命条]"

  重置成功: "<white>已重置[生命条]設定為預設（[其他数值:{0}]<white>顆紅心）"

  通用:
    无效数字: "[錯誤]無效的數字: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>數值必須在 1-100 之間"
      单体: "[错误]<white>數值必須在 1-1000 之間"
