生命条缩放指令:

  模式:
    总体个数: "총 개수"
    单体个数: "하트당"

  当前设置: "<white>현재 [生命条] 설정: {0}<white>, 값: [其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== 체력바 스케일 명령어 사용법 ==="
    总体个数: "[冷却]/healthbarscale total <value> <white>- 표시할 하트 총 개수 설정 (1-100)"
    单体个数: "[冷却]/healthbarscale perheart <value> <white>- 하트당 HP 설정 (1-1000)"
    重置: "[冷却]/healthbarscale reset <white>- 기본값으로 초기화 ({0}하트)"
  错误: "[错误]<white>알 수 없는 하위 명령어, /healthbarscale 로 사용법 확인"

  设置成功:
    总体个数: "<white>[生命条] 표시를 [其他数值:{0}]<white> 하트로 설정"
    单体个数: "<white>각 하트가 [其他数值:{0}]<white> [生命条]를 나타내도록 설정"

  重置成功: "<white>[生命条] 설정을 기본값으로 초기화 ([其他数值:{0}]<white> 하트)"

  通用:
    无效数字: "[오류]잘못된 숫자: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>값은 1-100 사이여야 합니다"
      单体: "[错误]<white>값은 1-1000 사이여야 합니다"
