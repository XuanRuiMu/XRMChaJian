生命条缩放指令:

  模式:
    总体个数: "合計"
    单体个数: "ハート毎"

  当前设置: "<white>現在の[生命条]設定: {0}<white>、値: [其他数值:{1}]"

  用法:
    标题: "[计分板标题]=== ハートバー縮小コマンド使い方 ==="
    总体个数: "[冷却]/healthbarscale total <value> <white>- 表示するハートの合計数を設定 (1-100)"
    单体个数: "[冷却]/healthbarscale perheart <value> <white>- ハート毎のHPを設定 (1-1000)"
    重置: "[冷却]/healthbarscale reset <white>- デフォルトにリセット ({0}ハート)"
  错误: "[错误]<white>不明なサブコマンド、/healthbarscale で使い方を確認"

  设置成功:
    总体个数: "<white>[生命条]表示を[其他数值:{0}]<white> ハートに設定"
    单体个数: "<white>各ハートが[其他数值:{0}]<white> [生命条]を表すように設定"

  重置成功: "<white>[生命条]設定をデフォルトにリセット ([其他数值:{0}]<white> ハート)"

  通用:
    无效数字: "[エラー]無効な数値: {0}"
  错误:
    数值范围:
      总体: "[错误]<white>値は1-100の間である必要があります"
      单体: "[错误]<white>値は1-1000の間である必要があります"
