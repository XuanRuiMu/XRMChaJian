# ============================================
# 暮澜纪元插件 - 玩家指令 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

玩家指令:

  日志:
    用法: "<white>用法: /技能日志 <开|关> 或 /战斗日志 <开|关>"
    技能日志用法: "<white>用法: /技能日志 <开|关>"
    战斗日志用法: "<white>用法: /战斗日志 <开|关>"
    无效值: "[错误]<white>无效的值，请使用 开 或 关。"
    设置成功: "<white>{0}已{1}。"
    状态: "<white>{0}当前状态: {1}"
    开启: "[成功]开启"
    关闭: "[错误]关闭"
    技能日志名称: "[技能日志前缀]技能日志"
    战斗日志名称: "[战斗日志前缀]战斗日志"
