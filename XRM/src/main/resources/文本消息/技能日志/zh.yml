# ============================================
# 暮澜纪元插件 - 技能日志消息
# 占位符规范：
#   {0}, {1}... = 运行时参数（由关键词解析器替换）
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
#   [第X技能] = 动态技能名（根据玩家专精解析）
# 数值格式规范：
#   伤害数值/治疗数值 = 保留1位小数
#   秘能/资源层数 = 整数
#   秒数 = 保留1位小数
# ============================================

技能日志:
  # 释放日志（通用模板，[第{N}技能]由关键词解析器动态着色）
  # 蓄力类：[蓄力][秒数:X.X]秒后，释放[技能名]。
  # 延迟类：[延迟][秒数:X.X]秒后，释放[技能名]。
  # 引导类：[引导][秒数:X.X]秒，释放[技能名]。
  # 瞬发类：释放了[技能名]。

  # 蓄力释放（{0}=蓄力秒数, {1}=槽位中文数字）
  蓄力释放: "[蓄力][秒数:{0}]秒后，释放[第{1}技能]。"

  # 延迟释放（{0}=延迟秒数, {1}=槽位中文数字）
  延迟释放: "[延迟][秒数:{0}]秒后，释放[第{1}技能]。"

  # 引导释放（{0}=引导秒数, {1}=槽位中文数字）
  引导释放: "[引导][秒数:{0}]秒，释放[第{1}技能]。"

  # 瞬发释放（{0}=槽位中文数字）
  瞬发释放: "释放了[第{0}技能]。"

  # 护盾释放（{0}=槽位中文数字, {1}=护盾值）
  # 奥术护盾为效果 1_3_1，继承法术 1_3 所属第三技能槽位黄色（见关键词颜色格式大全.md 18.2 颜色继承表）
  护盾释放: "释放了[第{0}技能]，获得了可以吸收[伤害数值:{1}]点伤害的<yellow>奥术护盾</yellow>。"

  # 蓄力被打断（{0}=槽位中文数字）
  # [第{0}技能] → 关键词解析器替换为红色技能名，[蓄力] → aqua粗体"蓄力"
  蓄力被打断: "<dark_red>[第{0}技能][蓄力]被打断。</dark_red>"

  # 引导被打断（{0}=槽位中文数字）
  # [第{0}技能] → 关键词解析器替换为红色技能名，[引导] → aqua粗体"引导"
  引导被打断: "<dark_red>[第{0}技能][引导]被打断。</dark_red>"

  # 公共冷却中（{0}=剩余秒数）
  公共冷却中: "<dark_red>公共冷却中，剩余{0}秒。</dark_red>"

  # 独立冷却中（{0}=槽位中文数字, {1}=剩余秒数）
  独立冷却中: "<dark_red>[第{0}技能]独立冷却中，剩余{1}秒。</dark_red>"

  # 命中日志（仅资源获取，无重复伤害信息）
  # {0}=资源量
  命中仅资源: "获得了{0}点[秘能]。"
  命中仅资源带秘兆: "获得了{0}点[秘能]，获得了<light_purple><bold>秘兆</bold></light_purple>效果。"

  # 命中日志（通用模板，[第{2}技能]由关键词解析器动态着色）
  # {0}=目标名, {1}=伤害数值, {2}=槽位中文数字, {3}=资源量
  命中: "[第{2}技能]命中{0}，造成了[伤害数值:{1}]点伤害，获得[秘能]{3}。"
  暴击命中: "[第{2}技能]命中{0}，造成了[伤害数值:{1}]<gold><bold>（[暴击]！）</bold></gold>点伤害，获得[秘能]{3}。"

  # 命中日志（无资源获取）
  # {0}=目标名, {1}=伤害数值, {2}=槽位中文数字
  命中无资源: "[第{2}技能]命中{0}，造成了[伤害数值:{1}]点伤害。"
  暴击命中无资源: "[第{2}技能]命中{0}，造成了[伤害数值:{1}]<gold><bold>（[暴击]！）</bold></gold>点伤害。"

  # 命中日志（带额外效果）
  # {0}=目标名, {1}=伤害数值, {2}=效果描述
  命中带效果: "[第一技能]命中{0}，造成了[伤害数值:{1}]点伤害，{2}。"
  暴击命中带效果: "[第一技能]命中{0}，造成了[伤害数值:{1}]<gold><bold>（[暴击]！）</bold></gold>点伤害，{2}。"

  # 范围命中日志（AOE统一日志，汇总所有目标）
  # {0}=槽位中文数字, {1}=目标数量, {2}=总伤害, {3}=资源量
  范围命中: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害。"
  范围暴击命中: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]<gold><bold>（[暴击]！）</bold></gold>点伤害。"
  范围命中仅资源: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害，获得[秘能]{3}。"
  范围命中仅资源带秘兆: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害，获得[秘能]{3}，获得了<light_purple><bold>秘兆</bold></light_purple>效果。"
  范围命中仅资源带暴击: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]<gold><bold>（[暴击]！）</bold></gold>点伤害，获得[秘能]{3}。"
  范围命中仅资源带秘兆带暴击: "[第{0}技能]命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]<gold><bold>（[暴击]！）</bold></gold>点伤害，获得[秘能]{3}，获得了<light_purple><bold>秘兆</bold></light_purple>效果。"

  # 混沌束缚 AOE 范围命中（FP-01 问题7：恢复"的AOE伤害"以区分单体束缚与周围格AOE）
  # {0}=槽位中文数字, {1}=目标数量, {2}=总伤害
  混沌束缚AOE范围命中: "[第{0}技能]的AOE伤害命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害。"

  # 秘法陨落汇总日志（单条汇总：总伤害+秘能获得量；FP-1 改为不再展示目标数量）
  # {0}=总伤害(1位小数), {1}=秘能获得量(可能为0)
  秘法陨落范围命中: "[第四技能]造成了[伤害数值:{0}]点伤害，获得了{1}点[秘能]。"

  # 秘法陨落汇总日志（获得秘兆时的兄弟键，FP-01 问题4：秘兆紧随秘能获取追加到同一条）
  # {0}=总伤害(1位小数), {1}=秘能获得量(可能为0)
  秘法陨落范围命中带秘兆: "[第四技能]造成了[伤害数值:{0}]点伤害，获得了{1}点[秘能]，获得了<light_purple><bold>秘兆</bold></light_purple>效果。"

  # 秘法陨落汇总日志（无秘能获取时使用，FP-14修复：不显示"获得了0点秘能"）
  # {0}=总伤害(1位小数)
  秘法陨落范围命中无秘能: "[第四技能]造成了[伤害数值:{0}]点伤害。"

  # 秘法湮灭四段日志（FP-2：四段差异化日志，每段一个键）
  # 第一/二段无秘能获取；第三段50%概率获取1点秘能；第四段必定获取1点秘能
  # 与范围命中格式保持一致：{0}=槽位中文数字, {1}=目标数量, {2}=总伤害(1位小数), {3}=秘能获取量(带秘能段)
  秘法湮灭第一段命中: "[第{0}技能]第一段命中，命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害。"
  秘法湮灭第二段命中: "[第{0}技能]第二段命中，命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害。"
  秘法湮灭第三段命中: "[第{0}技能]第三段命中，命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害。"
  秘法湮灭第三段命中带秘能: "[第{0}技能]第三段命中，命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害，获得了{3}点[秘能]。"
  秘法湮灭第四段命中: "[第{0}技能]第四段命中，命中[目标数量:{1}]个目标，造成了[伤害数值:{2}]点伤害，获得了{3}点[秘能]。"

  # 释放失败日志（{0}=槽位中文数字）
  # 由技能释放服务在执行器返回失败时发送，键格式 技能日志.失败.<原因>
  失败:
    资源不足: "<dark_red>[第{0}技能]释放失败：[秘能]不足。</dark_red>"
    冷却中: "<dark_red>[第{0}技能]释放失败：冷却中。</dark_red>"
    目标无效: "<dark_red>[第{0}技能]释放失败：目标无效。</dark_red>"
    位置无效: "<dark_red>[第{0}技能]释放失败：位置无效。</dark_red>"
    重复蓄力: "<dark_red>[第{0}技能]释放失败：重复蓄力。</dark_red>"
    定义缺失: "<dark_red>[第{0}技能]释放失败：技能定义缺失。</dark_red>"
    上下文为空: "<dark_red>[第{0}技能]释放失败：上下文为空。</dark_red>"
    执行异常: "<dark_red>[第{0}技能]释放失败：执行异常。</dark_red>"
    其他: "<dark_red>[第{0}技能]释放失败。</dark_red>"
