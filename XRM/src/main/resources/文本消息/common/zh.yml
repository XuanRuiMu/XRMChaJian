# ============================================
# 暮澜纪元插件 - 通用消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

技能日志前缀: "<light_purple>[技能日志]</light_purple>"
战斗日志前缀: "<red>[战斗日志]</red>"
错误前缀: "<red>[错误]</red>"

通用:
  未知: "未知"
  错误:
    无权限: "[错误]你没有权限执行此操作"
    玩家不在线: "[错误]玩家不在线: {0}"
    仅玩家可用: "[错误]此命令仅玩家可用"
    未知错误: "[错误]发生未知错误: {0}"
    会话不存在: "[错误]会话不存在"
    参数不足: "[错误]参数不足"
    无效参数: "[错误]无效的参数: {0}"
    命令冷却: "[错误]命令冷却中，请稍后再试"
  提示:
    重载成功: "[成功]配置已重载"
    操作成功: "[成功]操作成功"
    操作失败: "[错误]操作失败"
    数据保存成功: "[成功]数据已保存"
    数据加载成功: "[成功]数据已加载"
  用法:
    通用前缀: "[警告]用法: {0}"
    参数提示: "[警告]参数: {0}"
