# ============================================
# 暮澜纪元插件 - 战斗日志消息
# 占位符规范：
#   {0}, {1}... = 运行时参数（由关键词解析器替换）
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
#   [第X技能] = 动态技能名（根据玩家专精解析）
# 数值格式规范：
#   伤害数值/治疗数值 = 保留1位小数
#   秘能/资源层数 = 整数
#   秒数 = 保留1位小数
# ============================================

战斗日志:
  # 吸血日志附加规范：吸血量附加在伤害来源的日志末尾，不单独发送
  # 格式：通过[吸血]恢复了[治疗数值:X]点[生命值]
  吸血: "通过[吸血]恢复了[治疗数值:{0}]点[生命值]。"

  # 普通攻击日志（玩家造成伤害）
  # {0}=物品名, {1}=目标名, {2}=伤害数值
  普通攻击: "你用{0}对{1}造成了[伤害数值:{2}]点伤害。"
  普通攻击暴击: "你用{0}对{1}造成了[伤害数值:{2}]<gold><bold>（[暴击]！）</bold></gold>点伤害。"

  # 受到伤害日志（玩家受到伤害）
  # {0}=伤害来源名, {1}=伤害数值
  受到伤害: "你受到了来自{0}的[伤害数值:{1}]点伤害。"
  受到伤害暴击: "你受到了来自{0}的[伤害数值:{1}]<gold><bold>（[暴击]！）</bold></gold>点伤害。"
  # 受到伤害且有奥术护盾抵挡时合并显示（一条日志同时显示实际伤害和护盾抵挡量）
  # {0}=伤害来源名, {1}=实际伤害数值, {2}=护盾抵挡数值
  受到伤害带护盾抵挡: "你受到了来自{0}的[伤害数值:{1}]点伤害。被<yellow>奥术护盾</yellow>抵挡了[伤害数值:{2}]点伤害。"

  # 伤害来源显示名。投射物有发射者时优先显示发射者名称。
  伤害来源:
    未知: "未知来源"
    ARROW: "箭"
    SPECTRAL_ARROW: "光灵箭"
    TRIDENT: "三叉戟"
    FIREBALL: "火球"
    SMALL_FIREBALL: "小火球"
    DRAGON_FIREBALL: "龙息火球"
    WITHER_SKULL: "凋灵头颅"
    TNT: "TNT"
    TNT_MINECART: "TNT矿车"
    CONTACT: "接触伤害"
    ENTITY_ATTACK: "实体攻击"
    ENTITY_SWEEP_ATTACK: "横扫攻击"
    PROJECTILE: "投射物"
    SUFFOCATION: "窒息"
    FALL: "摔落"
    FIRE: "火焰"
    FIRE_TICK: "燃烧"
    MELTING: "融化"
    LAVA: "岩浆"
    DROWNING: "溺水"
    BLOCK_EXPLOSION: "方块爆炸"
    ENTITY_EXPLOSION: "爆炸"
    VOID: "虚空"
    LIGHTNING: "闪电"
    SUICIDE: "自杀"
    STARVATION: "饥饿"
    POISON: "中毒"
    MAGIC: "魔法"
    WITHER: "凋零"
    FALLING_BLOCK: "下落方块"
    THORNS: "荆棘"
    DRAGON_BREATH: "龙息"
    CUSTOM: "特殊伤害"
    FLY_INTO_WALL: "撞墙"
    HOT_FLOOR: "灼热地面"
    CRAMMING: "挤压"
    DRYOUT: "脱水"
    FREEZE: "冻结"
    SONIC_BOOM: "音爆"
    WORLD_BORDER: "世界边界"
    KILL: "处决"

  # 脱战回血日志
  # {0}=治疗数值
  脱战回血: "脱战回血恢复了[治疗数值:{0}]点[生命值]。"

  # 技能伤害日志（技能造成伤害时附加的战斗日志）
  # {0}=槽位中文数字, {1}=目标名, {2}=伤害数值
  技能伤害: "[第{0}技能]对{1}造成了[伤害数值:{2}]点伤害。"
  技能伤害暴击: "[第{0}技能]对{1}造成了[伤害数值:{2}]<gold><bold>（[暴击]！）</bold></gold>点伤害。"

  # 空手攻击时的武器名称
  空手: "空手"

  # 战斗状态变化日志
  进入战斗: "你已进入战斗状态。"
  脱离战斗: "你已脱离战斗状态。"

  # CD提示日志已迁移至技能日志/zh.yml

  # 伤害修正日志（附加在受到伤害日志末尾）
  # {0}=修正来源名（如"奥术护盾"、"树皮术"）, {1}=修正数值
  # 吸收：伤害被护盾抵挡
  吸收: "被[{0}]抵挡了[伤害数值:{1}]点伤害。"
  # 减伤：伤害被减少（减伤类效果，如树皮术）
  减伤: "被{0}减少了[伤害数值:{1}]点伤害。"
  # 增伤：伤害被增加（增伤类效果，如痛苦诅咒）
  增伤: "被{0}增加了[伤害数值:{1}]点伤害。"

  # 躲闪日志
  # {0}=攻击者名
  躲闪: "你[躲闪]了来自[攻击者:{0}]的普通攻击。"
