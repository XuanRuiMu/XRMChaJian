乐器命令:
  乐谱:
    音符计数后缀: "note), "
    你的乐谱: "I tuoi spartiti: "
    列表为空: "[信息]Non hai spartiti"
    不存在: "[错误]Spartito non trovato: {0}"
    删除成功: "[成功]Spartito eliminato: {0}"
  合奏:
    用法: "Utilizzo: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Utilizzo: /instrument ensemble start <score>"
    准备检查已发送: "Controllo preparazione inviato ai membri del gruppo!"
    已确认准备: "Sei pronto!"
    已停止: "Ensemble fermato"
    无进行中合奏: "Nessun ensemble in corso"
    状态标题: "===== Stato dell'Ensemble ====="
    曲目: "Spartito: "
    BPM: "BPM: "
    状态: "Stato: "
    准备: "Pronto: "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Impossibile suonare da soli durante l'ensemble"
    合奏中无法切换: "[错误]Impossibile cambiare tono durante l'ensemble"
    缺少参数: "[错误]Parametri mancanti"
    音色不存在: "[错误]Tono non trovato: {0}"
    未知子命令: "[错误]Sottocomando sconosciuto: {0}"
    无权限: "[警告]Non hai il permesso"
    玩家不在线: "[错误]Giocatore non online: {0}"
    未知操作: "Azione sconosciuta: "
    默认乐器未配置: "[错误]Strumento predefinito non configurato, contatta l'amministratore"
  给予:
    用法: "Utilizzo: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Strumento dato a {0} ({1})"
  配置:
    重载成功: "[成功]Configurazione musica ricaricata"
  节拍器:
    用法: "Uso: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronomo attivato"
      已关闭: "[信息]Metronomo disattivato"
    countIn:
      用法: "Uso: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Battute di count-in impostate a {0}"
      非法值错误: "[错误]Le battute di count-in devono essere 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Timbro: "
  帮助:
    标题: "===== Guida del Sistema di Strumenti ====="
    演奏说明: "- Apri interfaccia di esecuzione"
    演奏命令: "/instrument play "
    切换说明: "- Cambia timbro e apri interfaccia"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Visualizza i tuoi spartiti"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Riproduci spartito"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Elimina spartito"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Il leader avvia l'ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Conferma pronto"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Rifiuta ensemble"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Il leader ferma l'ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Visualizza stato ensemble"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Dai oggetto strumento"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Ricarica configurazione"
    重载命令: "/instrument reload "
    节拍器说明: "- Metronomo on/off e impostazione count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Nessuna definizione di oggetto strumento trovata per questo timbro"
