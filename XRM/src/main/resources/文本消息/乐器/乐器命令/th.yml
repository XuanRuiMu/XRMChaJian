    切换说明: "- เปลี่ยนโทนเสียงและเปิดหน้าต่าง"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- ดูโน้ตเพลงของคุณ"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- เล่นโน้ตเพลง"
