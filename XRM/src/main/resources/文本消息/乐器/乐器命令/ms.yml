乐器命令:
  乐谱:
    音符计数后缀: "nota), "
    你的乐谱: "Skor anda: "
    列表为空: "[信息]Anda tiada skor"
    不存在: "[错误]Skor tidak dijumpai: {0}"
    删除成功: "[成功]Skor dipadam: {0}"
  合奏:
    用法: "Penggunaan: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Penggunaan: /instrument ensemble start <score>"
    准备检查已发送: "Semakan kesediaan dihantar kepada ahli kumpulan!"
    已确认准备: "Anda sudah bersedia!"
    已停止: "Ensemble dihentikan"
    无进行中合奏: "Tiada ensemble sedang berlangsung"
    状态标题: "===== Status Ensemble ====="
    曲目: "Skor: "
    BPM: "BPM: "
    状态: "Status: "
    准备: "Sedia: "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Tidak boleh bermain solo semasa ensemble"
    合奏中无法切换: "[错误]Tidak boleh menukar nada semasa ensemble"
    缺少参数: "[错误]Parameter hilang"
    音色不存在: "[错误]Nada tidak dijumpai: {0}"
    未知子命令: "[错误]Subperintah tidak diketahui: {0}"
    无权限: "[警告]Anda tidak mempunyai kebenaran"
    玩家不在线: "[错误]Pemain tidak dalam talian: {0}"
    未知操作: "Tindakan tidak diketahui: "
    默认乐器未配置: "[错误]Instrumen lalai tidak dikonfigurasi, sila hubungi admin"
  给予:
    用法: "Penggunaan: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Alat muzik diberikan kepada {0} ({1})"
  配置:
    重载成功: "[成功]Konfigurasi muzik dimuat semula"
  节拍器:
    用法: "Penggunaan: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronom diaktifkan"
      已关闭: "[信息]Metronom dimatikan"
    countIn:
      用法: "Penggunaan: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Bar count-in ditetapkan kepada {0}"
      非法值错误: "[错误]Bar count-in mesti 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Nada: "
  帮助:
    标题: "===== Bantuan Sistem Instrumen ====="
    演奏说明: "- Buka UI persembahan"
    演奏命令: "/instrument play "
    切换说明: "- Tukar nada dan buka UI"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Lihat skor anda"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Mainkan skor"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Padam skor"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Ketua memulakan ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Sahkan sedia"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Tolak ensemble"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Ketua menghentikan ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Lihat status ensemble"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Berikan item instrumen"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Muat semula konfigurasi"
    重载命令: "/instrument reload "
    节拍器说明: "- Metronom on/off dan tetapan count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Tiada definisi item instrumen ditemui untuk nada ini"
