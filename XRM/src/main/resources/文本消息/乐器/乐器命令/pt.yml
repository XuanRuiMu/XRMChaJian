乐器命令:
  乐谱:
    音符计数后缀: "notas), "
    你的乐谱: "Suas partituras: "
    列表为空: "[信息]Você não tem partituras"
    不存在: "[错误]Partitura não encontrada: {0}"
    删除成功: "[成功]Partitura excluída: {0}"
  合奏:
    用法: "Uso: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Uso: /instrument ensemble start <score>"
    准备检查已发送: "Verificação de preparação enviada aos membros do grupo!"
    已确认准备: "Você está pronto!"
    已停止: "Conjunto parado"
    无进行中合奏: "Nenhum conjunto em andamento"
    状态标题: "===== Status do Conjunto ====="
    曲目: "Partitura: "
    BPM: "BPM: "
    状态: "Status: "
    准备: "Pronto: "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Não é possível tocar solo durante o ensemble"
    合奏中无法切换: "[错误]Não é possível mudar o tom durante o ensemble"
    缺少参数: "[错误]Parâmetros ausentes"
    音色不存在: "[错误]Tom não encontrado: {0}"
    未知子命令: "[错误]Subcomando desconhecido: {0}"
    无权限: "[警告]Você não tem permissão"
    玩家不在线: "[错误]Jogador não está online: {0}"
    未知操作: "Ação desconhecida: "
    默认乐器未配置: "[错误]Instrumento padrão não configurado, contate o admin"
  给予:
    用法: "Uso: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrumento dado a {0} ({1})"
  配置:
    重载成功: "[成功]Configuração de música recarregada"
  节拍器:
    用法: "Uso: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metrônomo ativado"
      已关闭: "[信息]Metrônomo desativado"
    countIn:
      用法: "Uso: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Compassos de count-in definidos para {0}"
      非法值错误: "[错误]Compassos de count-in devem ser 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Tom: "
  帮助:
    标题: "===== Ajuda do Sistema de Instrumentos ====="
    演奏说明: "- Abrir interface de performance"
    演奏命令: "/instrument play "
    切换说明: "- Trocar tom e abrir interface"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Ver suas partituras"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Reproduzir partitura"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Excluir partitura"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Líder inicia conjunto"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Confirmar pronto"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Rejeitar conjunto"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Líder para conjunto"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Ver status do conjunto"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Dar item de instrumento"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Recarregar configuração"
    重载命令: "/instrument reload "
    节拍器说明: "- Metrônomo ligar/desligar e configuração de count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Nenhuma definição de item de instrumento encontrada para este tom"
