乐器命令:
  乐谱:
    音符计数后缀: "нот), "
    你的乐谱: "Ваши партитуры: "
    列表为空: "[信息]У вас нет нот"
    不存在: "[错误]Ноты не найдены: {0}"
    删除成功: "[成功]Ноты удалены: {0}"
  合奏:
    用法: "Использование: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Использование: /instrument ensemble start <score>"
    准备检查已发送: "Проверка готовности отправлена участникам группы!"
    已确认准备: "Вы готовы!"
    已停止: "Ансамбль остановлен"
    无进行中合奏: "Нет активного ансамбля"
    状态标题: "===== Статус ансамбля ====="
    曲目: "Партитура: "
    BPM: "BPM: "
    状态: "Статус: "
    准备: "Готов: "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Нельзя играть соло во время ансамбля"
    合奏中无法切换: "[错误]Нельзя сменить тон во время ансамбля"
    缺少参数: "[错误]Отсутствуют параметры"
    音色不存在: "[错误]Тон не найден: {0}"
    未知子命令: "[错误]Неизвестная подкоманда: {0}"
    无权限: "[警告]У вас нет разрешения"
    玩家不在线: "[错误]Игрок не в сети: {0}"
    未知操作: "Неизвестное действие: "
    默认乐器未配置: "[错误]Инструмент по умолчанию не настроен, обратитесь к администратору"
  给予:
    用法: "Использование: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Инструмент передан {0} ({1})"
  配置:
    重载成功: "[成功]Музыкальная конфигурация перезагружена"
  节拍器:
    用法: "Использование: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Метроном включён"
      已关闭: "[信息]Метроном выключен"
    countIn:
      用法: "Использование: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Такты отсчёта установлены на {0}"
      非法值错误: "[错误]Такты отсчёта должны быть 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Тембр: "
  帮助:
    标题: "===== Справка системы инструментов ====="
    演奏说明: "- Открыть интерфейс исполнения"
    演奏命令: "/instrument play "
    切换说明: "- Сменить тембр и открыть интерфейс"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Просмотреть ваши партитуры"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Воспроизвести партитуру"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Удалить партитуру"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Лидер запускает ансамбль"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Подтвердить готовность"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Отклонить ансамбль"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Лидер останавливает ансамбль"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Просмотреть статус ансамбля"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Выдать предмет инструмента"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Перезагрузить конфигурацию"
    重载命令: "/instrument reload "
    节拍器说明: "- Включение/выключение метронома и настройка отсчёта"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Определение предмета инструмента не найдено для этого тембра"
