乐器命令:
  乐谱:
    音符计数后缀: "notes), "
    你的乐谱: "Vos partitions : "
    列表为空: "[信息]Vous n'avez pas de partitions"
    不存在: "[错误]Partition non trouvée : {0}"
    删除成功: "[成功]Partition supprimée : {0}"
  合奏:
    用法: "Utilisation : /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Utilisation : /instrument ensemble start <score>"
    准备检查已发送: "Vérification de préparation envoyée aux membres du groupe !"
    已确认准备: "Vous êtes prêt !"
    已停止: "Ensemble arrêté"
    无进行中合奏: "Aucun ensemble en cours"
    状态标题: "===== Statut de l'ensemble ====="
    曲目: "Partition : "
    BPM: "BPM : "
    状态: "Statut : "
    准备: "Prêt : "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Impossible de jouer solo pendant l'ensemble"
    合奏中无法切换: "[错误]Impossible de changer de ton pendant l'ensemble"
    缺少参数: "[错误]Paramètres manquants"
    音色不存在: "[错误]Ton non trouvé : {0}"
    未知子命令: "[错误]Sous-commande inconnue : {0}"
    无权限: "[警告]Vous n'avez pas la permission"
    玩家不在线: "[错误]Joueur hors ligne : {0}"
    未知操作: "Action inconnue : "
    默认乐器未配置: "[错误]Instrument par défaut non configuré, veuillez contacter l'administrateur"
  给予:
    用法: "Utilisation : /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrument donné à {0} ({1})"
  配置:
    重载成功: "[成功]Configuration musicale rechargée"
  节拍器:
    用法: "Utilisation : /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Métronome activé"
      已关闭: "[信息]Métronome désactivé"
    countIn:
      用法: "Utilisation : /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Mesures de count-in réglées sur {0}"
      非法值错误: "[错误]Les mesures de count-in doivent être 0/1/2 : {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Timbre : "
  帮助:
    标题: "===== Aide du Système d'Instruments ====="
    演奏说明: "- Ouvrir l'interface de jeu"
    演奏命令: "/instrument play "
    切换说明: "- Changer de timbre et ouvrir l'interface"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Voir vos partitions"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Jouer la partition"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Supprimer la partition"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Le chef démarre l'ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Confirmer prêt"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Refuser l'ensemble"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Le chef arrête l'ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Voir le statut de l'ensemble"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Donner un objet instrument"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Recharger la configuration"
    重载命令: "/instrument reload "
    节拍器说明: "- Activer/désactiver le métronome et configurer le count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Aucune définition d'objet instrument trouvée pour ce timbre"
