    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Ensemble sırasında solo çalamazsınız"
    合奏中无法切换: "[错误]Ensemble sırasında ton değiştirilemez"
    缺少参数: "[错误]Eksik parametre"
    音色不存在: "[错误]Ton bulunamadı: {0}"
    未知子命令: "[错误]Bilinmeyen alt komut: {0}"
