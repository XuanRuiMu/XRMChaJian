乐器命令:
  乐谱:
    音符计数后缀: "nota), "
    你的乐谱: "Notalarınız: "
    列表为空: "[信息]Notanız yok"
    不存在: "[错误]Nota bulunamadı: {0}"
    删除成功: "[成功]Nota silindi: {0}"
  合奏:
    用法: "Kullanım: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Kullanım: /instrument ensemble start <score>"
    准备检查已发送: "Hazırlık kontrolü grup üyelerine gönderildi!"
    已确认准备: "Hazırsınız!"
    已停止: "Topluluk durduruldu"
    无进行中合奏: "Devam eden topluluk yok"
