    名称前缀: "🎵 "
    音色: "Ton: "
  帮助:
    标题: "===== Enstrüman Sistemi Yardımı ====="
    演奏说明: "- Çalma arayüzünü aç"
    演奏命令: "/instrument play "
    切换说明: "- Ton değiştir ve arayüzü aç"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Notalarını görüntüle"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Nota çal"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Nota sil"
