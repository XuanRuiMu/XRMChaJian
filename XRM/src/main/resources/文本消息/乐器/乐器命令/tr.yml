  给予:
    用法: "Kullanım: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Enstrüman {0} kişisine verildi ({1})"
  配置:
    重载成功: "[成功]Müzik yapılandırması yeniden yüklendi"
  节拍器:
    用法: "Kullanım: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronom etkin"
      已关闭: "[信息]Metronom devre dışı"
    countIn:
      用法: "Kullanım: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Count-in ölçüleri {0} olarak ayarlandı"
      非法值错误: "[错误]Count-in ölçüleri 0/1/2 olmalıdır: {0}"
