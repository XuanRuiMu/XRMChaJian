乐器命令:
  乐谱:
    音符计数后缀: "nuty), "
    你的乐谱: "Twoje partytury: "
    列表为空: "[信息]Nie masz nut"
    不存在: "[错误]Nuty nie znalezione: {0}"
    删除成功: "[成功]Nuty usunięte: {0}"
  合奏:
    用法: "Użycie: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Użycie: /instrument ensemble start <score>"
    准备检查已发送: "Sprawdzenie gotowości wysłane do członków grupy!"
    已确认准备: "Jesteś gotowy!"
    已停止: "Zespół zatrzymany"
    无进行中合奏: "Brak aktywnego zespołu"
    状态标题: "===== Status Zespołu ====="
    曲目: "Partytura: "
    BPM: "BPM: "
    状态: "Status: "
    准备: "Gotowy: "
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Nie można grać solo podczas zespołu"
    合奏中无法切换: "[错误]Nie można zmienić barwy podczas zespołu"
    缺少参数: "[错误]Brakujące parametry"
    音色不存在: "[错误]Barwa nie znaleziona: {0}"
    未知子命令: "[错误]Nieznana podkomenda: {0}"
    无权限: "[警告]Nie masz uprawnień"
    玩家不在线: "[错误]Gracz nie jest online: {0}"
    未知操作: "Nieznana akcja: "
    默认乐器未配置: "[错误]Domyślny instrument nie skonfigurowany, skontaktuj się z adminem"
  给予:
    用法: "Użycie: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrument przekazany graczowi {0} ({1})"
  配置:
    重载成功: "[成功]Konfiguracja muzyki przeładowana"
  节拍器:
    用法: "Użycie: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronom włączony"
      已关闭: "[信息]Metronom wyłączony"
    countIn:
      用法: "Użycie: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Takty count-in ustawione na {0}"
      非法值错误: "[错误]Takty count-in muszą być 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Brzmienie: "
  帮助:
    标题: "===== Pomoc Systemu Instrumentów ====="
    演奏说明: "- Otwórz interfejs gry"
    演奏命令: "/instrument play "
    切换说明: "- Zmień brzmienie i otwórz interfejs"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Wyświetl swoje partytury"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Odtwórz partyturę"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Usuń partyturę"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Lider rozpoczyna zespół"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Potwierdź gotowość"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Odrzuć zespół"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Lider zatrzymuje zespół"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Wyświetl status zespołu"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Daj przedmiot instrumentu"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Przeładuj konfigurację"
    重载命令: "/instrument reload "
    节拍器说明: "- Metronom włącz/wyłącz i ustawienie count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Nie znaleziono definicji przedmiotu instrumentu dla tego brzmienia"
