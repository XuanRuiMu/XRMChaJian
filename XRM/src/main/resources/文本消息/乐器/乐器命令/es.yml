    删除成功: "[成功]Partitura eliminada: {0}"
  合奏:
    用法: "Uso: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Uso: /instrument ensemble start <score>"
    准备检查已发送: "¡Comprobación de preparación enviada a los miembros del grupo!"
    已确认准备: "¡Estás listo!"
    已停止: "Ensemble detenido"
    无进行中合奏: "No hay ensemble en curso"
