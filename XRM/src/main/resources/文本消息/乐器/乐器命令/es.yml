    默认乐器未配置: "[错误]Instrumento predeterminado no configurado, contacta al admin"
  给予:
    用法: "Uso: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrumento entregado a {0} ({1})"
  配置:
    重载成功: "[成功]Configuración de música recargada"
  节拍器:
    用法: "Uso: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metrónomo activado"
      已关闭: "[信息]Metrónomo desactivado"
    countIn:
      用法: "Uso: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Compases de count-in ajustados a {0}"
      非法值错误: "[错误]Los compases de count-in deben ser 0/1/2: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Tono: "
  帮助:
    标题: "===== Ayuda del Sistema de Instrumentos ====="
    演奏说明: "- Abrir interfaz de interpretación"
    演奏命令: "/instrument play "
    切换说明: "- Cambiar tono y abrir interfaz"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Ver tus partituras"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Reproducir partitura"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Eliminar partitura"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- El líder inicia el ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Confirmar listo"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Rechazar ensemble"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- El líder detiene el ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Ver estado del ensemble"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Dar objeto de instrumento"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Recargar configuración"
    重载命令: "/instrument reload "
    节拍器说明: "- Activar/desactivar metrónomo y configuración de count-in"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "No se encontró definición de objeto de instrumento para este tono"
