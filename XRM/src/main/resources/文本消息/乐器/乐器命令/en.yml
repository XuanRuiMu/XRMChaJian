乐器命令:
  乐谱:
    音符计数后缀: "notes), "
    你的乐谱: "[元素世界]Your scores: {0}"
    曲目条目: "[警告]{0}[物理] ({1}{2}"
    列表为空: "[提示]You have no scores"
    不存在: "[错误]Score not found: {0}"
    删除成功: "[成功]Score deleted: {0}"
  合奏:
    用法: "Usage: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Usage: /instrument ensemble start <score]"
    准备检查已发送: "Ready check sent to party members!"
    已确认准备: "You are ready!"
    已停止: "Ensemble stopped"
    无进行中合奏: "No ensemble in progress"
    状态标题: "[计分板标题]===== Ensemble Status ====="
    曲目: "[警告]Score: [玩家名]{0}"
    BPM: "[警告]BPM: [玩家名]{0}"
    状态: "[警告]Status: [玩家名]{0}"
    准备: "[警告]Ready: [成功]{0}[物理]/[玩家名]{1}"
    无曲目: "No score"
    演奏中: "Playing"
    准备中: "Preparing"
    错误: "[错误]{0}"
    无法开始错误: "[错误]Cannot start ensemble (requires party/score/online members)"
    无待确认错误: "[错误]No ensemble to confirm"
    无待拒绝错误: "[错误]No ensemble to reject"
    无可停止错误: "[错误]No ensemble to stop"
  错误:
    合奏中无法演奏: "[错误]Cannot play solo during ensemble"
    合奏中无法切换: "[错误]Cannot switch tone during ensemble"
    缺少参数: "[错误]Missing parameters"
    音色不存在: "[错误]Tone not found: {0}"
    未知子命令: "[错误]Unknown subcommand: {0}"
    无权限: "[警告]You don't have permission"
    玩家不在线: "[错误]Player not online: {0}"
    未知操作: "Unknown action: "
    默认乐器未配置: "[错误]Default instrument not configured, please contact admin"
  给予:
    用法: "Usage: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrument given to {0} ({1})"
  配置:
    重载成功: "[成功]Music config reloaded"
  节拍器:
    用法: "Usage: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronome enabled"
      已关闭: "[信息]Metronome disabled"
    countIn:
      用法: "Usage: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Count-in bars set to {0}"
      非法值错误: "[错误]Count-in bars must be 0/1/2: {0}"
  # FP-16 new command translation keys
  力度:
    用法: "Usage: /instrument velocity <pp|p|mf|f|ff|real on/off|octave 0-4>"
    已设置: "[成功]Velocity tier set to: [信息]{0}"
    档位无效: "[错误]Invalid velocity tier: {0} (options pp/p/mf/f/ff)"
    真实开关无效: "[错误]Invalid real velocity switch: {0} (options on/off)"
  音域:
    用法: "Usage: /instrument octave <0-4>"
    已设置: "[成功]Octave set to: [信息]{0}"
    越界: "[错误]Octave out of range, must be 0-4: {0}"
  量化:
    用法: "Usage: /instrument quantize <1/8|1/16|1/32|1/8T|1/16T|1/32T|undo|preview>"
    档位无效: "[错误]Invalid quantize tier: {0}"
    预览已量化: "[提示]Current score is quantized"
    预览未量化: "[提示]Current score is not quantized"
  swing:
    用法: "Usage: /instrument swing <on|off|50-65>"
    值越界: "[错误]Swing percentage out of range, must be 50-65: {0}"
    已开启: "[成功]Swing enabled (default 55%)"
    已关闭: "[信息]Swing disabled"
    值无效: "[错误]Invalid swing value: {0}"
  延音:
    用法: "Usage: /instrument sustain <hold|toggle>"
    已设置: "[成功]Sustain mode set to: [信息]{0}"
    模式无效: "[错误]Invalid sustain mode: {0} (options hold/toggle)"
  和弦:
    用法: "Usage: /instrument chord <root 0-59> <type> [memory]  or  /instrument chord list|clear"
    根音无效: "[错误]Invalid chord root, must be 0-59: {0}"
    类型无效: "[错误]Invalid chord type: {0}"
    列表标题: "[计分板标题]===== Chord Type List ====="
    列表项: "[警告]{0}[物理] - intervals: [信息]{1}"
  录音:
    用法: "Usage: /instrument record <start|stop|save <name>|preview|undo-quantize>"
    已开始: "[成功]Recording started"
    已停止: "[信息]Recording stopped"
    未在进行: "[提示]Not recording now"
    保存用法: "Usage: /instrument record save <score name>"
    预览进行中: "[提示]Recording in progress"
    预览未进行: "[提示]No recording in progress"
  公共库:
    用法: "Usage: /instrument library <list|search|download|upload|rate|review>"
    上传用法: "Usage: /instrument library upload <local score name> <public name>"
    下载用法: "Usage: /instrument library download <score ID>"
    评分用法: "Usage: /instrument library rate <score ID> <1-5>"
    审核用法: "Usage: /instrument library review <score ID> <approve|reject>"
    搜索用法: "Usage: /instrument library search <keyword>"
    评分值无效: "[错误]Invalid rating, must be integer 1-5: {0}"
    审核状态无效: "[错误]Invalid review action: {0} (options approve/reject)"
    搜索结果为空: "[提示]No matching public scores found"
  分层:
    用法: "Usage: /instrument split <on|off|toggle|split 0-59|instrument left|right <name>>"
    分界点越界: "[错误]Split point out of range, must be 0-59: {0}"
    方向无效: "[错误]Invalid split direction: {0} (options left/right)"
  钢琴卷帘:
    用法: "Usage: /instrument pianoroll open <score name>"
  资源包:
    用法: "Usage: /instrument resourcepack <apply|generate>"
    应用失败: "[错误]Resource pack apply failed"
    生成成功: "[成功]Resource pack generated"
    生成失败: "[错误]Resource pack generation failed"
  弯音:
    用法: "Usage: /instrument pitchbend sensitivity <1-12>"
    范围已设置: "[成功]Pitch bend range set to: [信息]{0}[物理] semitones"
    范围越界: "[错误]Pitch bend range out of range, must be 1-12: {0}"
  物品:
    名称前缀: "🎵 "
    音色: "Tone: "
  帮助:
    标题: "[计分板标题]===== Instrument System Help ====="
    演奏行: "[警告]{0}[物理]{1}"
    合奏行: "[信息]{0}[物理]{1}"
    管理行: "[错误]{0}[物理]{1}"
    演奏说明: "- Open performance UI"
    演奏命令: "/instrument play "
    切换说明: "- Switch tone and open UI"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- View your scores"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Play score"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Delete score"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Leader starts ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Confirm ready"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Reject ensemble"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Leader stops ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- View ensemble status"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Give instrument item"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Reload config"
    重载命令: "/instrument reload "
    节拍器说明: "- Metronome on/off and count-in setting"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "No instrument item definition found for this tone"
