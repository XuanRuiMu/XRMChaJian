    删除成功: "[成功]Partitur gelöscht: {0}"
  合奏:
    用法: "Verwendung: /instrument ensemble <start|confirm|reject|stop|status> [score]"
    用法开始: "Verwendung: /instrument ensemble start <score>"
    准备检查已发送: "Bereitschaftsprüfung an Gruppenmitglieder gesendet!"
    已确认准备: "Du bist bereit!"
    已停止: "Ensemble gestoppt"
    无进行中合奏: "Kein Ensemble läuft"
