    名称前缀: "🎵 "
    音色: "Klang: "
  帮助:
    标题: "===== Instrumentensystem-Hilfe ====="
    演奏说明: "- Spieloberfläche öffnen"
    演奏命令: "/instrument play "
    切换说明: "- Klang wechseln und UI öffnen"
    切换命令: "/instrument switch <tone> "
    乐谱列表说明: "- Deine Partituren ansehen"
    乐谱列表命令: "/instrument score list "
    乐谱播放说明: "- Partitur abspielen"
    乐谱播放命令: "/instrument score play <name> "
    乐谱删除说明: "- Partitur löschen"
    乐谱删除命令: "/instrument score delete <name> "
    合奏开始说明: "- Anführer startet Ensemble"
    合奏开始命令: "/instrument ensemble start <score> "
    合奏确认说明: "- Bereit bestätigen"
    合奏确认命令: "/instrument ensemble confirm "
    合奏拒绝说明: "- Ensemble ablehnen"
    合奏拒绝命令: "/instrument ensemble reject "
    合奏停止说明: "- Anführer stoppt Ensemble"
    合奏停止命令: "/instrument ensemble stop "
    合奏状态说明: "- Ensemble-Status ansehen"
    合奏状态命令: "/instrument ensemble status "
    给予说明: "- Instrumentengegenstand geben"
    给予命令: "/instrument give <player> <tone> "
    重载说明: "- Konfiguration neu laden"
    重载命令: "/instrument reload "
    节拍器说明: "- Metronom an/aus und Count-in-Einstellung"
    节拍器命令: "/instrument metronome <on|off|count-in <0|1|2>> "
  错误消息:
    无乐器物品定义: "Keine Instrumentengegenstandsdefinition für diesen Klang gefunden"
