    玩家不在线: "[错误]Spieler nicht online: {0}"
    未知操作: "Unbekannte Aktion: "
    默认乐器未配置: "[错误]Standard-Instrument nicht konfiguriert, bitte Admin kontaktieren"
  给予:
    用法: "Verwendung: /instrument give <player> <instrument>"
  乐器:
    给予成功: "[成功]Instrument an {0} gegeben ({1})"
  配置:
    重载成功: "[成功]Musikkonfiguration neu geladen"
  节拍器:
    用法: "Verwendung: /instrument metronome <on|off|count-in>"
    开关:
      已开启: "[成功]Metronom aktiviert"
      已关闭: "[信息]Metronom deaktiviert"
    countIn:
      用法: "Verwendung: /instrument metronome count-in <0|1|2>"
      已设置: "[成功]Count-in Takte auf {0} gesetzt"
      非法值错误: "[错误]Count-in Takte müssen 0/1/2 sein: {0}"
