# ============================================
# 暮澜纪元插件 - 乐器服务 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

乐器服务:
  录制开始: "[提示]开始录制: [信息]{0}"
  录制停止: "[提示]录制停止，共 [警告]{0}[物理] 个音符"
  乐谱保存成功: "[成功]乐谱已保存: [信息]{0}"
  乐谱已存在: "[警告]乐谱已存在: [信息]{0}[物理]。再次点击保存按钮将覆盖；如需新名请使用命令"
  乐谱超限: "[错误]乐谱数量已达上限 [警告]{0}[物理]，请先删除旧乐谱"
  无录制内容: "[错误]当前无录制内容，无法保存"
  乐谱名无效: "[错误]乐谱名无效，请使用非空名称"
  乐谱不存在: "[错误]乐谱不存在: {0}"
  乐谱删除成功: "[成功]乐谱已删除: {0}"
  乐谱列表为空: "[提示]你还没有乐谱"
  乐谱开始播放: "[提示]开始播放乐谱: [信息]{0}"
  乐谱播放结束: "[提示]乐谱播放结束: [信息]{0}"
  合奏开始: "[成功]合奏开始！曲目: [信息]{0}"
  合奏结束: "[提示]合奏已结束"
  合奏拒绝: "[警告]有成员拒绝了合奏"
  合奏确认进度: "[提示]已确认 [成功]{0}[物理]/[玩家名]{1}"
  合奏倒计时: "[警告]合奏即将开始！曲目: [信息]{0}"
  合奏已停止: "[提示]合奏已停止"
  默认乐谱名: "未命名"
  合奏状态:
    准备进度: "已准备 {0}/{1}"
  切换乐器: "[提示]已切换为: [信息]{0}"
  给予成功: "[成功]已将乐器给予 [玩家名]{0}[物理]（[信息]{1}[物理]）"
  重载成功: "[成功]乐器配置已重载"
  # FP-E 三轨归一 + 逐音域绑定 + 5 档力度 + mod velocity-by-duration
  音域切换: "[提示]音域切换至: [信息]{0}"
  力度切换: "[提示]力度档切换至: [信息]{0}"
  真实力度已开启: "[提示]mod 真实力度已启用（按键时长反推 velocity）"
  真实力度已关闭: "[提示]mod 真实力度已关闭"
  音高越界: "[错误]音高 {0} 越界，无法演奏"
  # FP-G 录音量化非破坏性 + swing + 可视化反馈
  量化已应用: "[成功]量化已应用: [信息]{0}"
  量化已撤销: "[提示]量化已撤销，已恢复原始音符"
  无可量化乐谱: "[错误]无可量化乐谱，请先录制或播放后再量化"
  swing已设置: "[提示]Swing 已设置: [信息]{0}"
  录制中标题: "录制中"
  # FP-I 和弦预设 + 和弦记忆 + 公共乐谱库
  和弦已播放: "[提示]和弦已播放: [信息]{0}"
  和弦记忆已启动: "[提示]和弦记忆已启动: [信息]{0}[物理]（再次按下或切换以停止）"
  和弦记忆已停止: "[提示]和弦记忆已停止"
  公共乐谱上传成功: "[成功]乐谱已上传到公共库，乐谱ID: [信息]{0}[物理]（等待审核）"
  公共乐谱上传重名: "[错误]乐谱ID冲突，请重试上传"
  公共乐谱上传参数无效: "[错误]上传参数无效，请检查乐谱名是否非空"
  公共乐谱下载成功: "[成功]已从公共库下载乐谱到本地: [信息]{0}"
  公共乐谱不存在: "[错误]公共乐谱不存在: {0}"
  公共乐谱未通过审核: "[警告]公共乐谱未通过审核，无法下载或评分: {0}"
  公共乐谱评分成功: "[成功]已评分: [信息]{0}"
  公共乐谱已评分: "[警告]你已对此乐谱评过分: [信息]{0}"
  公共乐谱评分越界: "[错误]评分越界，必须在 1-5 范围内"
  公共乐谱审核成功: "[成功]公共乐谱 [信息]{0}[物理] 审核状态已更新为: [信息]{1}"
  公共乐谱状态无效: "[错误]乐谱状态无效或已审核，无法变更: {0}"
  公共乐谱列表为空: "[提示]公共乐谱库为空或暂无已通过的乐谱"
  公共乐谱列表项: "[信息]{0}[物理] | 上传者: [玩家名]{1}[物理] | 评分: [警告]{2}[物理] | 下载: {3}"
  # FP-H NBS/MIDI 导入导出 + NoteBlockAPI 集成
  NBS导入成功: "[成功]NBS 乐谱已导入: [信息]{0}"
  NBS导入失败: "[错误]NBS 导入失败: {0}"
  NBS导出成功: "[成功]乐谱已导出为 NBS: [信息]{0}"
  NBS导出失败: "[错误]NBS 导出失败: {0}"
  MIDI导入成功: "[成功]MIDI 乐谱已导入: [信息]{0}"
  MIDI导入失败: "[错误]MIDI 导入失败: {0}"
  MIDI导出成功: "[成功]乐谱已导出为 MIDI: [信息]{0}"
  MIDI导出失败: "[错误]MIDI 导出失败: {0}"
  文件不可读: "[错误]文件不存在或不可读: {0}"
  # FP-J 分层键盘 split + piano roll + 弯音轮调制轮 + 表情控制 + 资源包
  分层已开启: "[提示]分层键盘模式已开启（按音高分界点切换左右乐器）"
  分层已关闭: "[提示]分层键盘模式已关闭"
  分界点已设置: "[提示]分层分界点已设置为: [信息]{0}"
  分层乐器已设置: "[提示]分层乐器已更新"
  pianoRoll已打开: "[提示]Piano Roll 编辑器已打开: [信息]{0}"
  pianoRoll已关闭: "[提示]Piano Roll 编辑器已关闭"
  pianoRoll保存成功: "[成功]Piano Roll 编辑已保存为乐谱: [信息]{0}"
  pianoRoll已撤销: "[提示]Piano Roll 编辑已撤销，已恢复原始乐谱"
  pianoRoll编辑失败: "[错误]Piano Roll 编辑失败: {0}"
  资源包应用提示: "[提示]资源包应用请求已发送，请下载后重启客户端生效"
