# ============================================
# 暮澜纪元插件 - 菜单框架 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

菜单框架:
  菜单:
    不存在: "[错误]菜单 [警告]{0} [错误]不存在"
    无权限: "[错误]你没有权限打开此菜单"
  通用:
    关闭: "[错误]关闭菜单"
