# ============================================
# 暮澜纪元插件 - 总菜单 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

总菜单:
  标题: "<gold>功能菜单</gold>"
  任务系统:
    名称: "<yellow>任务系统</yellow>"
    描述: "<gray>点击打开任务菜单</gray>"
    描述2: "<aqua>查看和接取各种任务</aqua>"
  属性系统:
    名称: "<green>属性系统</green>"
    描述: "<gray>点击打开属性</gray>"
  技能日志设置:
    名称: "<blue>技能日志设置</blue>"
    描述: "<gray>点击切换技能日志输出</gray>"
  战斗日志设置:
    名称: "<dark_purple>战斗日志设置</dark_purple>"
    描述: "<gray>点击切换战斗日志输出</gray>"
  状态行: "<aqua>当前状态: {0}</aqua>"
  状态:
    开启: "<green>开启</green>"
    关闭: "<red>关闭</red>"
