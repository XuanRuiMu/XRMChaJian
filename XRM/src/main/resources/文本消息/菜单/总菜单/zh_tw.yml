# ============================================
# 暮瀾紀元插件 - 總選單 訊息
# ============================================

总菜单:
  标题: "<gold>功能選單</gold>"
  任务系统:
    名称: "<yellow>任務系統</yellow>"
    描述: "<gray>點擊打開任務選單</gray>"
    描述2: "<aqua>查看和接取各種任務</aqua>"
  属性系统:
    名称: "<green>屬性系統</green>"
    描述: "<gray>點擊打開屬性</gray>"
  技能日志设置:
    名称: "<blue>技能日誌設定</blue>"
    描述: "<gray>點擊切換技能日誌輸出</gray>"
  战斗日志设置:
    名称: "<dark_purple>戰鬥日誌設定</dark_purple>"
    描述: "<gray>點擊切換戰鬥日誌輸出</gray>"
  状态行: "<aqua>目前狀態: {0}</aqua>"
  状态:
    开启: "<green>開啟</green>"
    关闭: "<red>關閉</red>"
