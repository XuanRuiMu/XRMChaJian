# ============================================
# 暮澜纪元插件 - 占位符管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

占位符管理器:
  职业:
    未选择: "<yellow>未选择职业"
  职业类型:
    无: "<yellow>无"
  战斗状态:
    战斗中: "[进入战斗]"
    脱战: "[脱战]"
  通用:
    错误: "<red>解析错误"
