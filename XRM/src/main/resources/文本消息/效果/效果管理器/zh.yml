# ============================================
# 暮澜纪元插件 - 效果管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

效果管理器:
  效果获得:
    增益: "[增益]{0} 获得了 [信息]{1}"
    减益: "[减益]{0} 获得了 [警告]{1}"
  效果移除:
    过期: "{0} 的 [信息]{1} 已消失"
    覆盖: "{0} 的 [信息]{1} 被覆盖"
    手动: "{0} 的 [信息]{1} 被移除"
    护盾破碎: "{0} 的 [护盾]{1} [错误]破碎了"
    切换移除: "{0} 的 [信息]{1} 被切换移除"
    触发消耗: "{0} 的 [信息]{1} 被触发消耗"
  效果叠加:
    叠加: "[信息]{0} 叠加至 [点数]{1} 层"
  效果刷新:
    延长: "[信息]{0} 延长至 [秒数:{1}]秒"
  护盾:
    吸收: "[护盾]{0} 吸收了 [点数:{1}] 点伤害"
    破碎: "[护盾]{0} [错误]破碎"
