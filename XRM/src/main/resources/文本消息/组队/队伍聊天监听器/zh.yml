# ============================================
# 暮澜纪元插件 - 队伍聊天监听器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

队伍聊天监听器:
  队伍:
    不在队伍中无法聊天: "<red>你不在任何队伍中，无法使用队伍聊天"
  聊天:
    格式: "<green>[队伍] <white>{0}{2} [{1}]<white>: <white>{3}"
