    转让: "[警告:/party leader <player> ][物理]- Передать лидерство]"
    就位: "[警告:/party ready ][物理]- Подтвердить готовность]"
    就位检查: "[警告:/party readycheck ][物理]- Начать проверку готовности]"
    信息: "[警告:/party info ][物理]- Посмотреть информацию о группе]"
