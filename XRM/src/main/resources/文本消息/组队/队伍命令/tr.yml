    踢出: "[警告:/party kick <player> ][物理:- Üye at]"
    解散: "[警告:/party disband ][物理]- Grubu dağıt]"
    转让: "[警告:/party leader <player> ][物理:- Liderliği devret]"
    就位: "[警告:/party ready ][物理]- Hazır olduğunu onayla]"
    就位检查: "[警告:/party readycheck ][物理]- Hazırlık kontrolü başlat]"
    信息: "[警告:/party info ][物理:- Grup bilgisini görüntüle]"
