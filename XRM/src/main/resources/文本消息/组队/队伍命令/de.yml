队伍命令:
  队伍:
    请指定玩家名: "[错误]Bitte gib einen Spielernamen an"
    玩家不在线: "[错误]Dieser Spieler ist nicht online"
    不能邀请自己: "[错误]Du kannst dich nicht selbst einladen"
    不在队伍中: "[错误]Du bist in keiner Gruppe"
  信息:
    标题: "[计分板标题:===== Gruppeninfo =====]"
    角色分布: "[警告:Rollenverteilung: ][玩家名:{0}]"
    队伍人数: "[警告:Gruppengröße: ][玩家名:{0}/5]"
    队长标记: "[元素世界:★Leiter]"
    离线标记: "[物理:[Offline]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== Aktuelle Servergruppen =====]"
    开发中: "[警告:Funktion in Entwicklung, nicht verfügbar]"
  帮助:
    标题: "[计分板标题:===== Gruppenbefehl-Hilfe =====]"
    创建: "[警告:/party create ][物理:- Gruppe erstellen]"
    邀请: "[警告:/party invite <player> ][物理:- Spieler einladen]"
    接受: "[警告:/party accept ][物理:- Einladung annehmen]"
    拒绝: "[警告:/party decline ][物理]- Einladung ablehnen]"
    离开: "[警告:/party leave ][物理:- Gruppe verlassen]"
    踢出: "[警告:/party kick <player> ][物理:- Mitglied kicken]"
    解散: "[警告:/party disband ][物理:- Gruppe auflösen]"
    转让: "[警告:/party leader <player> ][物理:- Führung übertragen]"
    就位: "[警告:/party ready ][物理]- Bereit bestätigen]"
    就位检查: "[警告:/party readycheck ][物理:- Bereitschaftsprüfung starten]"
    信息: "[警告:/party info ][物理:- Gruppeninfo anzeigen]"
    队伍聊天: "[物理:Gruppenchat: /p <message>]"
