队伍命令:
  队伍:
    请指定玩家名: "[错误]Veuillez spécifier un nom de joueur"
    玩家不在线: "[错误]Ce joueur n'est pas en ligne"
    不能邀请自己: "[错误]Vous ne pouvez pas vous inviter vous-même"
    不在队伍中: "[错误]Vous n'êtes pas dans un groupe"
  信息:
    标题: "[计分板标题:===== Info du Groupe =====]"
    角色分布: "[警告:Distribution des rôles : ][玩家名:{0}]"
    队伍人数: "[警告:Taille du groupe : ][玩家名:{0}/5]"
    队长标记: "[元素世界:★Chef]"
    离线标记: "[物理:[Hors ligne]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== Groupes du Serveur Actuels =====]"
    开发中: "[警告:Fonctionnalité en développement, indisponible]"
  帮助:
    标题: "[计分板标题:===== Aide Commandes de Groupe =====]"
    创建: "[警告:/party create ][物理:- Créer un groupe]"
    邀请: "[警告:/party invite <player> ][物理:- Inviter un joueur]"
    接受: "[警告:/party accept ][物理:- Accepter l'invitation]"
    拒绝: "[警告:/party decline ][物理]- Refuser l'invitation]"
    离开: "[警告:/party leave ][物理:- Quitter le groupe]"
    踢出: "[警告:/party kick <player> ][物理:- Expulser un membre]"
    解散: "[警告:/party disband ][物理:- Dissoudre le groupe]"
    转让: "[警告:/party leader <player> ][物理:- Transférer le leadership]"
    就位: "[警告:/party ready ][物理]- Confirmer prêt]"
    就位检查: "[警告:/party readycheck ][物理:- Lancer une vérification de préparation]"
    信息: "[警告:/party info ][物理:- Voir les infos du groupe]"
    队伍聊天: "[物理:Chat de groupe : /p <message>]"
