队伍命令:
  队伍:
    请指定玩家名: "[错误]プレイヤー名を指定してください"
    玩家不在线: "[错误]そのプレイヤーはオフラインです"
    不能邀请自己: "[错误]自分を招待することはできません"
    不在队伍中: "[错误]パーティーに参加していません"
  信息:
    标题: "[计分板标题:===== パーティー情報 =====]"
    角色分布: "[警告:ロール分布：][玩家名:{0}]"
    队伍人数: "[警告:パーティー人数：][玩家名:{0}/5]"
    队长标记: "[元素世界:★リーダー]"
    离线标记: "[物理:[オフライン]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== 現在のサーバーパーティー =====]"
    开发中: "[警告:開発中の機能です、利用できません]"
  帮助:
    标题: "[计分板标题:===== パーティーコマンドヘルプ =====]"
    创建: "[警告:/party create ][物理:- パーティーを作成]"
    邀请: "[警告:/party invite <player> ][物理:- プレイヤーを招待]"
    接受: "[警告:/party accept ][物理:- 招待を承認]"
    拒绝: "[警告:/party decline ][物理]- 招待を拒否]"
    离开: "[警告:/party leave ][物理:- パーティーを離脱]"
    踢出: "[警告:/party kick <player> ][物理:- メンバーを追放]"
    解散: "[警告:/party disband ][物理:- パーティーを解散]"
    转让: "[警告:/party leader <player> ][物理:- リーダーを譲渡]"
    就位: "[警告:/party ready ][物理]- 準備完了を確認]"
    就位检查: "[警告:/party readycheck ][物理]- レディチェックを開始]"
    信息: "[警告:/party info ][物理:- パーティー情報を表示]"
    队伍聊天: "[物理:パーティーチャット：/p <message>]"
