    接受: "[警告:/party accept ][物理:- Przyjmij zaproszenie]"
    拒绝: "[警告:/party decline ][物理]- Odrzuć zaproszenie]"
    离开: "[警告:/party leave ][物理:- Opuść grupę]"
    踢出: "[警告:/party kick <player> ][物理:- Wyrzuć członka]"
    解散: "[警告:/party disband ][物理:- Rozwiąż grupę]"
    转让: "[警告:/party leader <player> ][物理:- Przekaż przywództwo]"
    就位: "[警告:/party ready ][物理]- Potwierdź gotowość]"
    就位检查: "[警告:/party readycheck ][物理]- Rozpocznij sprawdzanie gotowości]"
    信息: "[警告:/party info ][物理:- Wyświetl info o grupie]"
    队伍聊天: "[物理:Czat grupy: /p <message>]"
