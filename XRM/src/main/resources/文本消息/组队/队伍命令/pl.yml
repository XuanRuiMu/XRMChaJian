  信息:
    标题: "[计分板标题:===== Info o Grupie =====]"
    角色分布: "[警告:Rozkład ról: ][玩家名:{0}]"
    队伍人数: "[警告:Rozmiar grupy: ][玩家名:{0}/5]"
    队长标记: "[元素世界:★Lider]"
    离线标记: "[物理:[Offline]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== Obecne Grupy na Serwerze =====]"
