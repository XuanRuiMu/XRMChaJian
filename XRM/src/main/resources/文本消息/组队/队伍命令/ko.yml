队伍命令:
  队伍:
    请指定玩家名: "[错误]플레이어 이름을 지정해 주세요"
    玩家不在线: "[错误]해당 플레이어는 오프라인입니다"
    不能邀请自己: "[错误]자신을 초대할 수 없습니다"
    不在队伍中: "[错误]파티에 참여하지 않았습니다"
  信息:
    标题: "[计分板标题:===== 파티 정보 =====]"
    角色分布: "[警告:역할 분포: ][玩家名:{0}]"
    队伍人数: "[警告:파티 인원: ][玩家名:{0}/5]"
    队长标记: "[元素世界:★리더]"
    离线标记: "[物理:[오프라인]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== 현재 서버 파티 =====]"
    开发中: "[警告:개발 중인 기능입니다, 사용할 수 없습니다]"
  帮助:
    标题: "[计分板标题:===== 파티 명령어 도움말 =====]"
    创建: "[警告:/party create ][物理:- 파티 생성]"
    邀请: "[警告:/party invite <player> ][物理:- 플레이어 초대]"
    接受: "[警告:/party accept ][物理:- 초대 수락]"
    拒绝: "[警告:/party decline ][物理]- 초대 거절]"
    离开: "[警告:/party leave ][物理:- 파티 나가기]"
    踢出: "[警告:/party kick <player> ][物理:- 멤버 추방]"
    解散: "[警告:/party disband ][物理:- 파티 해산]"
    转让: "[警告:/party leader <player> ][物理:- 리더 양도]"
    就位: "[警告:/party ready ][物理]- 준비 확인]"
    就位检查: "[警告:/party readycheck ][物理]- 준비 체크 시작]"
    信息: "[警告:/party info ][物理:- 파티 정보 보기]"
    队伍聊天: "[物理:파티 채팅: /p <message>]"
