    拒绝: "[警告:/party decline ][物理]- Tolak jemputan]"
    离开: "[警告:/party leave ][物理:- Tinggalkan kumpulan]"
    踢出: "[警告:/party kick <player> ][物理]- Tendang ahli]"
    解散: "[警告:/party disband ][物理:- Bubarkan kumpulan]"
    转让: "[警告:/party leader <player> ][物理:- Pindah kepimpinan]"
    就位: "[警告:/party ready ][物理]- Sahkan sedia]"
    就位检查: "[警告:/party readycheck ][物理]- Mulakan semakan kesediaan]"
    信息: "[警告:/party info ][物理:- Lihat info kumpulan]"
    队伍聊天: "[物理:Sembak kumpulan: /p <message>]"
