    队长标记: "[元素世界:★Ketua]"
    离线标记: "[物理:[Luar Talian]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== Kumpulan Pelayan Semasa =====]"
