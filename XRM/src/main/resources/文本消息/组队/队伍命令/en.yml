# ============================================
# MulangEpoch Plugin - 队伍命令 Messages
# Placeholder convention:
#   {0}, {1}... = runtime parameters
#   [KeywordName] = static keyword (auto-colored)
#   [KeywordName:Value] = parameterized keyword (replace params then color)
# ============================================

队伍命令:
  队伍:
    请指定玩家名: "[错误]Please specify a player name"
    玩家不在线: "[错误]That player is not online"
    不能邀请自己: "[错误]You cannot invite yourself"
    不在队伍中: "[错误]You are not in a party"
  信息:
    标题: "[计分板标题:===== Party Info =====]"
    角色分布: "[警告:Role Distribution: ][玩家名:{0}]"
    队伍人数: "[警告:Party Size: ][玩家名:{0}/5]"
    队长标记: "[元素世界:★Leader]"
    离线标记: "[物理:[Offline]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== Current Server Parties =====]"
    开发中: "[警告:Feature in development, unavailable]"
  帮助:
    标题: "[计分板标题:===== Party Command Help =====]"
    创建: "[警告:/party create ][物理:- Create a party]"
    邀请: "[警告:/party invite <player> ][物理:- Invite a player]"
    接受: "[警告:/party accept ][物理:- Accept invitation]"
    拒绝: "[警告:/party decline ][物理]- Decline invitation]"
    离开: "[警告:/party leave ][物理:- Leave the party]"
    踢出: "[警告:/party kick <player> ][物理:- Kick a member]"
    解散: "[警告:/party disband ][物理:- Disband the party]"
    转让: "[警告:/party leader <player> ][物理:- Transfer leadership]"
    就位: "[警告:/party ready ][物理]- Confirm ready]"
    就位检查: "[警告:/party readycheck ][物理:- Initiate ready check]"
    信息: "[警告:/party info ][物理:- View party info]"
    队伍聊天: "[物理:Party chat: /p <message>]"
