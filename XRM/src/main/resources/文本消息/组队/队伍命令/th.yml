队伍命令:
  队伍:
    请指定玩家名: "[错误]กรุณาระบุชื่อผู้เล่น"
    玩家不在线: "[错误]ผู้เล่นนั้นไม่ออนไลน์"
    不能邀请自己: "[错误]คุณไม่สามารถเชิญตัวเองได้"
    不在队伍中: "[错误]คุณไม่ได้อยู่ในปาร์ตี้"
  信息:
    标题: "[计分板标题:===== ข้อมูลปาร์ตี้ =====]"
    角色分布: "[警告:การกระจายบทบาท: ][玩家名:{0}]"
    队伍人数: "[警告:ขนาดปาร์ตี้: ][玩家名:{0}/5]"
    队长标记: "[元素世界:★ผู้นำ]"
    离线标记: "[物理:[ออฟไลน์]]"
    成员行坦克: "  [坦克:{0}] [玩家名:{1}]{2}{3}"
    成员行治疗: "  [治疗:{0}] [玩家名:{1}]{2}{3}"
    成员行输出: "  [输出:{0}] [玩家名:{1}]{2}{3}"
  列表:
    标题: "[计分板标题:===== ปาร์ตี้เซิร์ฟเวอร์ปัจจุบัน =====]"
    开发中: "[警告:ฟีเจอร์อยู่ระหว่างพัฒนา ไม่พร้อมใช้งาน]"
  帮助:
    标题: "[计分板标题:===== ความช่วยเหลือคำสั่งปาร์ตี้ =====]"
    创建: "[警告:/party create ][物理:- สร้างปาร์ตี้]"
    邀请: "[警告:/party invite <player> ][物理:- เชิญผู้เล่น]"
    接受: "[警告:/party accept ][物理]- ยอมรับคำเชิญ]"
    拒绝: "[警告:/party decline ][物理]- ปฏิเสธคำเชิญ]"
    离开: "[警告:/party leave ][物理]- ออกจากปาร์ตี้]"
    踢出: "[警告:/party kick <player> ][物理]- เตะสมาชิก]"
    解散: "[警告:/party disband ][物理]- ยุบปาร์ตี้]"
    转让: "[警告:/party leader <player> ][物理:- โอนตำแหน่งผู้นำ]"
    就位: "[警告:/party ready ][物理]- ยืนยันพร้อม]"
    就位检查: "[警告:/party readycheck ][物理]- เริ่มตรวจสอบความพร้อม]"
    信息: "[警告:/party info ][物理]- ดูข้อมูลปาร์ตี้]"
    队伍聊天: "[物理:แชทปาร์ตี้: /p <message>]"
