# ============================================
# 暮澜纪元插件 - 秘法崩裂 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

秘法崩裂:
  施放: "[延迟][秒数:0.4]秒后，释放[第二技能]秘法崩裂。"
  无充能: "[第二技能]秘法崩裂未能释放，[秘能]不足。"
  无目标: "[第二技能]秘法崩裂未命中目标，范围内无目标，未消耗[秘能]。"
  单目标命中: "[第二技能]秘法崩裂命中{0}，造成了[伤害数值:{1}]点[奥术]伤害，消耗[秘能]{2}。"
  单目标暴击: "[第二技能]秘法崩裂命中{0}，造成了[伤害数值:{1}]（[暴击]！）点[奥术]伤害，消耗[秘能]{2}。"
  命中: "[第二技能]秘法崩裂命中{0}个目标，平均造成[伤害数值:{1}]点[奥术]伤害，消耗[秘能]{2}。"
  暴击: "[第二技能]秘法崩裂命中{0}个目标，平均造成[伤害数值:{1}]（[暴击]！）点[奥术]伤害，消耗[秘能]{2}。"
