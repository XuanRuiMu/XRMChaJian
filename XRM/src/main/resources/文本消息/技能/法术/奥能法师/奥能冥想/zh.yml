# ============================================
# 暮澜纪元插件 - 奥能冥想 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

奥能冥想:
  施放: "释放了[第七技能]，消耗了{0}点[秘能]，治疗了[治疗数值:{1}]点[生命值]。"
  效果结束: "[第七技能]蓄能完成，获得了[点数:{0}]点<blue>临时智力值</blue>。"
