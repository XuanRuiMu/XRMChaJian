# ============================================
# 暮澜纪元插件 - 混沌束缚 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

混沌束缚:
  施放: "释放了[第五技能]混沌束缚。"
  命中: "[第五技能]混沌束缚命中{0}，造成了[伤害数值:{1}]点[混乱]伤害，施加[减益]缓慢，获得[秘能]{2}。"
  暴击: "[第五技能]混沌束缚命中{0}，造成了[伤害数值:{1}]（[暴击]！）点[混乱]伤害，施加[减益]缓慢，获得[秘能]{2}。"
  命中含范围: "[第五技能]混沌束缚命中{0}，造成了[伤害数值:{1}]点[混乱]伤害，施加[减益]缓慢，获得[秘能]{2}，范围命中{3}个目标造成[伤害数值:{4}]点伤害。"
  暴击含范围: "[第五技能]混沌束缚命中{0}，造成了[伤害数值:{1}]（[暴击]！）点[混乱]伤害，施加[减益]缓慢，获得[秘能]{2}，范围命中{3}个目标造成[伤害数值:{4}]点伤害。"
