# ============================================
# 暮澜纪元插件 - 秘法湮灭 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

秘法湮灭:
  施放: "[延迟][秒数:3.0]秒后，释放[第八技能]秘法湮灭。"
  第一波: "[第八技能]秘法湮灭第一波，造成了[伤害数值:{0}]点[奥术]伤害。"
  第一波暴击: "[第八技能]秘法湮灭第一波，造成了[伤害数值:{0}]（[暴击]！）点[奥术]伤害。"
  第二波: "[第八技能]秘法湮灭第二波，造成了[伤害数值:{0}]点[奥术]伤害。"
  第二波暴击: "[第八技能]秘法湮灭第二波，造成了[伤害数值:{0}]（[暴击]！）点[奥术]伤害。"
  第三波: "[第八技能]秘法湮灭第三波，造成了[伤害数值:{0}]点[奥术]伤害。"
  第三波暴击: "[第八技能]秘法湮灭第三波，造成了[伤害数值:{0}]（[暴击]！）点[奥术]伤害。"
  第三波有充能: "[第八技能]秘法湮灭第三波，造成了[伤害数值:{0}]点[奥术]伤害，获得[秘能]1。"
  第四波: "[第八技能]秘法湮灭最终爆发，造成了[伤害数值:{0}]点[奥术]伤害，获得[秘能]{1}。"
  第四波暴击: "[第八技能]秘法湮灭最终爆发，造成了[伤害数值:{0}]（[暴击]！）点[奥术]伤害，获得[秘能]{1}。"
