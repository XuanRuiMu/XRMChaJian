# ============================================
# 暮澜纪元插件 - 秘法陨落 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

秘法陨落:
  施放: "[蓄力][秒数:1.5]秒后，释放[第四技能]秘法陨落。"
  命中: "[第四技能]秘法陨落命中{0}，造成了[伤害数值:{1}]点[奥术]伤害。"
  命中获得充能: "[第四技能]秘法陨落命中{0}，造成了[伤害数值:{1}]点[奥术]伤害，获得[秘能]1。"
