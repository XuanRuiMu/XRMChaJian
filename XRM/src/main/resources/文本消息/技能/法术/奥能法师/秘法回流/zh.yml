# ============================================
# 暮澜纪元插件 - 秘法回流 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

秘法回流:
  治疗: "释放了[第六技能]，治疗了[治疗数值:{0}]点[生命值]，获得了{1}点[秘能]。"
  移动额外治疗: "[第六技能]额外治疗了[治疗数值:{0}]点[生命值]，获得了{1}点[秘能]。"
