# ============================================
# 暮澜纪元插件 - 奥术冲击 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

奥术冲击:
  延长冥想: "[第一技能]奥术冲击延长了[增益]奥能冥想效果。"
  命中: "[第一技能]奥术冲击命中{0}，造成了[伤害数值:{1}]点[奥术]伤害，获得[秘能]{2}。"
  暴击: "[第一技能]奥术冲击命中{0}，造成了[伤害数值:{1}]（[暴击]！）点[奥术]伤害，获得[秘能]{2}。"
  回响命中: "[第一技能]奥术冲击回响命中{0}，造成了[伤害数值:{1}]点[奥术]伤害。"
