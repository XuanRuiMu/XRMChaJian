# ============================================
# 暮澜纪元插件 - 技能释放服务 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

技能释放服务:
  通用:
    公共冷却中: "[冷却]公共冷却中 [秒数:{0}]秒"
    冷却中: "[冷却中]{0} 冷却中 [秒数:{1}]秒"
    蓄力后释放: "[蓄力]蓄力 [秒数:{0}]秒 后释放 {1}"
    引导后释放: "[引导]引导 [秒数:{0}]秒 后释放 {1}"
    执行错误: "[错误]技能执行出错: {0}"
    蓄力被打断: "[打断]蓄力被打断"
    引导被打断: "[打断]引导被打断"
