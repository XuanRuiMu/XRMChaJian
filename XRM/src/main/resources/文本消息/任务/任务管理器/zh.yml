# ============================================
# 暮澜纪元插件 - 任务管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

任务管理器:
  对话:
    格式: "[元素世界]{0}"
  任务:
    接取成功: "[成功]已接取任务: [信息:{0}]"
    目标完成: "[成功]任务目标已完成: [信息:{0}]"
    进度更新: "[警告]任务进度: [信息:{0}] [点数:{1}/{2}]"
    进度回退: "[错误]任务进度回退: [信息:{0}]"
    条件达成: "[成功]任务条件已达成: [信息:{0}]"
    完成: "[成功]任务完成: [元素世界:{0}]"
    奖励经验: "[治疗数值]获得经验等级: [点数:{0}]"
    新任务解锁: "[成功]新任务已解锁！"
