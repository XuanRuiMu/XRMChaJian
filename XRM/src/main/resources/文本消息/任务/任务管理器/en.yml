# ============================================
# MulangEpoch Plugin - 任务管理器 Messages
# Placeholder convention:
#   {0}, {1}... = runtime parameters
#   [KeywordName] = static keyword (auto-colored)
#   [KeywordName:Value] = parameterized keyword (replace params then color)
# ============================================

任务管理器:
  对话:
    格式: "[元素世界]{0}"
  任务:
    接取成功: "[成功]Quest accepted: [信息:{0}]"
    目标完成: "[成功]Quest objective completed: [信息:{0}]"
    进度更新: "[警告]Quest progress: [信息:{0}] [点数:{1}/{2}]"
    进度回退: "[错误]Quest progress reverted: [信息:{0}]"
    条件达成: "[成功]Quest condition met: [信息:{0}]"
    完成: "[成功]Quest completed: [元素世界:{0}]"
    奖励经验: "[治疗数值]Experience levels gained: [点数:{0}]"
    新任务解锁: "[成功]New quest unlocked!"
