# ============================================
# 暮澜纪元插件 - 任务定义翻译（中文）
# 包含任务名称、描述、NPC对话的翻译键
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

quest:
  # ========== 主线任务 ==========
  主线1:
    name: "[自定义技能]选择职业与专精"
    description: "[物理]前往城市中心的白色塔楼选择职业，然后去橙色地带的大使馆区确定专精方向，最后回到塔楼附近的训练场确认你的选择。"
    dialog:
      accept: "[元素世界:加尔雷安·烬痕] 欢迎来到暮澜纪元，冒险者！在这里，你需要选择自己的职业与专精，这将决定你的战斗方式。请前往城市中心的白色塔楼选择你的职业，然后去橙色地带的大使馆区确定专精方向，最后回到塔楼附近的训练场确认你的选择。"
      progress: "[元素世界:加尔雷安·烬痕] 你已经接受了选择职业的任务，请前往城市中心的白色塔楼选择职业。"
      deliver: "[元素世界:妮伊尔·共轴] 啊，新来的冒险者！看来你已经做出了选择，我能从你的眼神中看到决心的光芒。"
      complete: "[元素世界:妮伊尔·共轴] 你已经完成了选择职业的任务。"
  主线2:
    name: "[自定义技能]趁热打铁"
    description: "[物理]点击训练场石柱上的按钮召唤训练假人，用你学到的技能摧毁训练假人。"
    dialog:
      accept: "[元素世界:妮伊尔·共轴] 理论知识固然重要，但没有实践的力量就像是没有引线的火药。点击我旁边石柱子上的按钮，召唤出训练假人，用你所学的一切将它摧毁。"
      progress: "[元素世界:妮伊尔·共轴] 你还没有击败训练假人，快去召唤场中央的召唤石召唤出对手，并用你所学的一切将其摧毁。"
      deliver: "[元素世界:妮伊尔·共轴] 干得漂亮！你已经成功击败了训练假人，你的实力已经得到了验证。"
      complete: "[元素世界:妮伊尔·共轴] 你已经完成了趁热打铁的任务。"
  主线3:
    name: "[自定义技能]冒险者，出发"
    description: "[物理]出城，在桥对岸左侧沙丘上找到抵抗军领袖莱雅·苦叶。"
    dialog:
      accept: "[元素世界:妮伊尔·共轴] 你已完成了职业选择，现在需要证明你的实力。接下来你需要出城，在桥对岸左侧沙丘上找到抵抗军领袖莱雅·苦叶。"
      progress: "[元素世界:妮伊尔·共轴] 你需要出城，在桥对岸左侧沙丘上找到抵抗军领袖莱雅·苦叶。"
      deliver: "[元素世界:莱雅·苦叶] 你终于来了，我们正需要你的帮助。试炼之塔遭到了破坏，腐化生物已逃脱并在附近游荡。"
      complete: "[元素世界:莱雅·苦叶] 你已经完成了冒险者，出发的任务。"
  主线4:
    name: "[自定义技能]清理通道"
    description: "[物理]清理试炼之塔附近的腐化生物，击杀4个腐化僵尸，沿道路向南找到奥格林·博学者。"
    dialog:
      accept: "[元素世界:莱雅·苦叶] 试炼之塔遭到了破坏，腐化生物已逃脱并在附近游荡，对任何生命都构成威胁。请去消灭那些腐化生物。"
      progress: "[元素世界:莱雅·苦叶] 你还需要消灭更多腐化僵尸。"
      deliver: "[元素世界:奥格林·博学者] 你做得很好，已经消灭了那些腐化生物。但是这些只是小喽啰，真正的威胁是腐化之源。"
      complete: "[元素世界:奥格林·博学者] 你已经完成了清理通道的任务。"
  主线5:
    name: "[自定义技能]腐化之源"
    description: "[物理]进入试炼之塔第二层，找到并消灭腐化僵尸首领，返回向奥格林·博学者汇报。"
    dialog:
      accept: "[元素世界:奥格林·博学者] 试炼之塔镇压着这个世界的腐化力量，你需要进一步削弱腐化力量。去击杀腐化僵尸首领！"
      progress: "[元素世界:奥格林·博学者] 腐化之源依然存在，请去击杀腐化僵尸首领，削弱腐化力量。"
      deliver: "[元素世界:奥格林·博学者] 太好了！你成功击败了腐化僵尸首领，削弱了腐化力量。你的勇气和实力令人钦佩。"
      complete: "[元素世界:奥格林·博学者] 你已经完成了腐化之源的任务。"
  主线6:
    name: "[自定义技能]支援前线"
    description: "[物理]沿路往回走，路过亭子，走到中央石头圆盘处向右走，跨过石桥进入山洞，找到塞缪·狮心。"
    dialog:
      accept: "[元素世界:奥格林·博学者] 你需要前往西部支援前线。沿路往回走，路过亭子，走到中央石头圆盘处向右走，跨过石桥进入山洞，找到塞缪·狮心。"
      progress: "[元素世界:奥格林·博学者] 你需要前往西部支援前线，找到塞缪·狮心。"
      deliver: "[元素世界:塞缪·狮心] 你终于来了，前线正需要你的帮助。"
      complete: "[元素世界:塞缪·狮心] 你已经完成了支援前线的任务。"
  主线7:
    name: "[自定义技能]补充食物"
    description: "[物理]弄点吃的填饱肚子，饥饿值需要达到18及以上。"
    dialog:
      accept: "[元素世界:塞缪·狮心] 前线人手紧缺，但先别急着上战场，去弄点吃的填饱肚子。"
      progress: "[元素世界:塞缪·狮心] 你还没有吃饱，请去弄点吃的填饱肚子。"
      deliver: "[元素世界:塞缪·狮心] 看起来你已经吃饱喝足了，精神饱满！"
      complete: "[元素世界:塞缪·狮心] 你已经完成了补充食物的任务。"
  主线8:
    name: "[自定义技能]熟悉基本操作"
    description: "[物理]输入/cd打开游戏菜单，查看技能和任务进度。"
    dialog:
      accept: "[元素世界:塞缪·狮心] 现在请输入/cd打开游戏菜单，熟悉基本操作。"
      progress: "[元素世界:塞缪·狮心] 你还没有熟悉基本操作，请输入/cd打开游戏菜单。"
      deliver: "[元素世界:塞缪·狮心] 很好，你已经熟悉了基本操作。"
      complete: "[元素世界:塞缪·狮心] 你已经完成了熟悉基本操作的任务。"
  主线9:
    name: "[自定义技能]推进中继塔"
    description: "[物理]清除魔网中继塔周围的掠行者哨兵，击杀5个掠行者哨兵。"
    dialog:
      accept: "[元素世界:塞缪·狮心] 我们的下个目标是魔网中继塔，陨灭先驱用它传播腐化能量，但塔周围布满了掠行者哨兵，需要清除威胁。"
      progress: "[元素世界:塞缪·狮心] 你还需要击杀更多掠行者哨兵。"
      deliver: "[元素世界:塞缪·狮心] 太好了！你成功清除了所有掠行者哨兵，为我们的进攻扫清了障碍。"
      complete: "[元素世界:塞缪·狮心] 你已经完成了推进中继塔的任务，成为了暮澜纪元的真正英雄！"

  # ========== 支线任务 ==========
  支线1:
    name: "[自定义技能]遗失的日记"
    description: "[物理]在暮斓汀城中寻找遗失的日记，将日记归还给主人。"
    dialog:
      accept: "[元素世界:旅行者艾拉] 我在暮斓汀城中遗失了一本重要的日记，你能帮我找到吗？"
      progress: "[元素世界:旅行者艾拉] 日记还没有找到，请继续在城中寻找。"
      deliver: "[元素世界:旅行者艾拉] 太好了！你找到了我的日记，非常感谢！"
      complete: "[元素世界:旅行者艾拉] 你已经完成了遗失的日记任务。"

  # ========== 日常任务 ==========
  日常1:
    name: "[自定义技能]每日巡逻"
    description: "[物理]击杀3个腐化生物，维护暮斓汀周边的安全。"
    dialog:
      accept: "[元素世界:巡逻队长马克] 暮斓汀周边的腐化生物越来越多了，帮我清理一些吧。"
      progress: "[元素世界:巡逻队长马克] 还需要击杀更多腐化生物。"
      deliver: "[元素世界:巡逻队长马克] 干得好，今天的巡逻任务完成了。"
      complete: "[元素世界:巡逻队长马克] 每日巡逻任务已完成。"
  日常2:
    name: "[自定义技能]资源收集"
    description: "[物理]收集10个铁锭，交给铁匠用于锻造装备。"
    dialog:
      accept: "[元素世界:铁匠格里克] 我需要一些铁锭来锻造装备，你能帮我收集吗？"
      progress: "[元素世界:铁匠格里克] 铁锭还不够，继续收集吧。"
      deliver: "[元素世界:铁匠格里克] 这些铁锭质量不错，辛苦你了！"
      complete: "[元素世界:铁匠格里克] 资源收集任务已完成。"
