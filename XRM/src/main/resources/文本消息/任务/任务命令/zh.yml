# ============================================
# 暮澜纪元插件 - 任务命令 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

任务命令:
  错误:
    未知子命令: "[错误]未知的子命令: {0}"
    无权限: "[错误]你没有权限执行此命令"
    目标不在线: "[错误]目标玩家不在线"
    任务不存在: "[错误]任务不存在: {0}"
    无进度: "[错误]该玩家没有此任务的进度"
    未知操作: "[错误]未知操作: {0}"
  用法:
    主命令: "[警告]用法: /任务 [菜单|进度|管理|重载]"
    管理: "[警告]用法: /任务 管理 <接取|完成|重置> <玩家名> <任务ID>"
  菜单:
    打开成功: "[成功]已打开任务菜单"
  进度:
    标题: "[计分板标题:========== 任务进度 ==========]"
    摘要: "[警告]进行中任务{0}个 / 可交付任务{1}个 / 已完成任务{2}个"
    条目: "[物理]  {0} : {1}/{2}"
    分类标签: "[警告:{0}:]"
    任务行: "[物理:  {0} ]{1}"
  状态:
    未解锁: "[空槽位:未解锁]"
    可接取: "[成功:可接取]"
    进行中: "[警告:进行中]"
    可交付: "[元素世界:可交付]"
    已完成: "[治疗数值:已完成]"
  管理:
    接取成功: "[成功]已为 [玩家名:{0}] 接取任务: [信息:{1}]"
    完成成功: "[成功]已为 [玩家名:{0}] 完成任务: [信息:{1}]"
    重置成功: "[成功]已为 [玩家名:{0}] 重置任务: [信息:{1}]"
  重载:
    成功: "[成功]任务配置已重载"
