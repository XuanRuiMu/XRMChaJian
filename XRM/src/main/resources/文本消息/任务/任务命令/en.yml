# ============================================
# MulangEpoch Plugin - 任务命令 Messages
# Placeholder convention:
#   {0}, {1}... = runtime parameters
#   [KeywordName] = static keyword (auto-colored)
#   [KeywordName:Value] = parameterized keyword (replace params then color)
# ============================================

任务命令:
  错误:
    未知子命令: "[错误]Unknown subcommand: {0}"
    无权限: "[错误]You don't have permission to execute this command"
    目标不在线: "[错误]Target player is not online"
    任务不存在: "[错误]Quest does not exist: {0}"
    无进度: "[错误]This player has no progress for this quest"
    未知操作: "[错误]Unknown operation: {0}"
  用法:
    主命令: "[警告]Usage: /quest [menu|progress|manage|reload]"
    管理: "[警告]Usage: /quest manage <accept|complete|reset> <player> <questID>"
  菜单:
    打开成功: "[成功]Quest menu opened"
  进度:
    标题: "[计分板标题:========== Quest Progress ==========]"
    摘要: "[警告]In Progress: {0} / Completable: {1} / Completed: {2}"
    条目: "[物理]  {0} : {1}/{2}"
    分类标签: "[警告:{0}:]"
    任务行: "[物理:  {0} ]{1}"
  状态:
    未解锁: "[空槽位:Locked]"
    可接取: "[成功:Available]"
    进行中: "[警告:In Progress]"
    可交付: "[元素世界:Completable]"
    已完成: "[治疗数值:Completed]"
  管理:
    接取成功: "[成功]Accepted quest for [玩家名:{0}]: [信息:{1}]"
    完成成功: "[成功]Completed quest for [玩家名:{0}]: [信息:{1}]"
    重置成功: "[成功]Reset quest for [玩家名:{0}]: [信息:{1}]"
  重载:
    成功: "[成功]Quest configuration reloaded"
