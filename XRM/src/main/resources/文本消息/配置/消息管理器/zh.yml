# ============================================
# 暮澜纪元插件 - 消息管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

消息管理器:
  初始化:
    完成: "[成功]消息管理器初始化完成"
  重载:
    完成: "[成功]消息文件已重新加载"
  日志:
    文件创建失败: "[错误]无法创建日志文件: {0}"
    写入失败: "[错误]写入日志文件失败: {0}"
    找不到语言文件: "[警告]找不到语言文件: {0}"
