# ============================================
# 暮澜纪元插件 - 仇恨管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================
仇恨管理器:
  仇恨:
    已清除: "[成功]附近仇恨已清除"
    调试开启: "[信息]仇恨调试模式已开启"
    调试关闭: "[信息]仇恨调试模式已关闭"
    调试前缀: "[仇恨]"
    调试消息: "{0} → {1} [仇恨:{2}]"
