伤害服务:
  实体类型:
    怪物: "몬스터"
  护盾:
    默认名: "방패"
  攻击者:
    未知: "알 수 없음"
  技能:
    普攻: "자동 공격"
  动作:
    攻击: "공격"
  伤害提示: "{0}에게 [伤害数值:{1}] 피해를 입힘"
  伤害暴击提示: "{0}에게 [伤害数值:{1}] ([暴击]!) 피해를 입힘"
  治疗提示: "{0}의 체력을 [治疗数值:{1}] 회복함"
  治疗暴击提示: "{0}의 체력을 [治疗数值:{1}] ([暴击]!) 회복함"
  躲闪提示: "{0}이(가) 공격을 회피함"
  战斗日志:
    吸血回复: " [生命]생명력 흡수로 [治疗数值:{0}] 회복됨"
    造成伤害: "{0}에게 [伤害数值:{1}] 피해를 입힘"
    受到伤害:
      默认: "[伤害数值:{0}] 피해를 받음"
      有减免: "[伤害数值:{0}] 피해를 받음 ({2} 감소 [伤害数值:{3}])"
    脱战回血: "전투 이탈, [治疗数值:{0}] 체력 회복"
    治疗他人: "{0}의 체력을 [治疗数值:{1}] 회복함"
