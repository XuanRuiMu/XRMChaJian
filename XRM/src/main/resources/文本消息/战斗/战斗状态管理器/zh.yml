# ============================================
# 暮澜纪元插件 - 战斗状态管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================
战斗状态管理器:
  状态:
    进入: "[进入战斗]你已进入战斗状态"
    离开: "[脱战]你已脱离战斗"
    战斗中禁止命令: "[警告]战斗中无法使用该命令"
    战斗中禁止更换装备: "[警告]战斗中无法更换装备"
  调试:
    开启: "[信息]战斗调试模式已开启"
    关闭: "[信息]战斗调试模式已关闭"
