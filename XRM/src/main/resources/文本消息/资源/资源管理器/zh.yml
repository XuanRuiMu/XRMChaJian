# ============================================
# 暮澜纪元插件 - 资源管理器 消息
# 占位符规范：
#   {0}, {1}... = 运行时参数
#   [关键词名] = 静态关键词（自动着色）
#   [关键词名:值] = 带参数关键词（先替换参数再着色）
# ============================================

资源管理器:
  资源变化:
    增加: "[资源]{0} [成功]+{1}"
    消耗: "[资源]{0} [警告]-{1}"
    不足: "[错误]{0} 不足，需要 [点数:{1}]"
    衰减: "[资源]{0} [警告]衰减 [点数:{1}]"
