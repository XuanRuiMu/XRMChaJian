# 效果定义配置
# 定义所有效果的基础属性，由效果注册服务加载
#
# 字段说明：
#   名称: 效果的中文名称（用于日志和调试）
#   名称翻译键: 效果名称的翻译键（用于客户端显示）
#   描述翻译键: 效果描述的翻译键（用于客户端显示）
#   处理器: 效果处理器类的全限定名（实现 mljy.领域层.效果.效果处理器 接口，空字符串表示无处理器）
#   持续时间: 效果持续时间（毫秒，-1表示永久）
#   最大层数: 效果最大层数（-1表示无上限，用于护盾值等数值型效果）
#   可驱散: 是否可被驱散技能移除
#   可叠加: 重复添加时是否叠加层数（true=叠加层数，false=刷新持续时间）

效果:
  # 秘兆 - 奥能法师精通魔法预兆触发的增伤效果
  # 处理器预留：精通魔法预兆当前作为技能执行器实现，未来可扩展为效果处理器
  "1_9_1":
    名称: "秘兆"
    名称翻译键: "effect.奥能法师.秘兆.name"
    描述翻译键: "effect.奥能法师.秘兆.description"
    处理器: "mljy.技能实现.奥能法师.秘兆效果处理器"
    持续时间: 5000
    最大层数: 1
    可驱散: false
    可叠加: false

  # 奥术护盾 - 奥能法师奥术护盾技能产生的护盾效果（层数=护盾值）
  "1_3_1":
    名称: "奥术护盾"
    名称翻译键: "effect.奥能法师.奥术护盾.name"
    描述翻译键: "effect.奥能法师.奥术护盾.description"
    处理器: "mljy.技能实现.奥能法师.奥术护盾效果处理器"
    持续时间: 20000
    最大层数: -1
    可驱散: false
    可叠加: false

  # 奥能冥想蓄能 - 奥能冥想蓄力阶段效果（2秒蓄力，金色上升粒子+光环）
  "1_7_1":
    名称: "奥能冥想蓄能"
    名称翻译键: "effect.奥能法师.奥能冥想蓄能.name"
    描述翻译键: "effect.奥能法师.奥能冥想蓄能.description"
    处理器: "mljy.技能实现.奥能法师.奥能冥想蓄能效果处理器"
    持续时间: 2000
    最大层数: 4
    可驱散: false
    可叠加: false

  # 奥能冥想 - 奥能冥想技能完成后提供的冥想效果（层数=消耗的秘能层数，处理分级周身特效）
  "1_7_2":
    名称: "奥能冥想"
    名称翻译键: "effect.奥能法师.奥能冥想.name"
    描述翻译键: "effect.奥能法师.奥能冥想.description"
    处理器: "mljy.技能实现.奥能法师.奥能冥想效果处理器"
    持续时间: 30000
    最大层数: -1
    可驱散: false
    可叠加: false
