    目标:
      类型: "条件检查"
      目标ID: "class_selected"
      数量: 1
    奖励:
      经验等级: 1
      金币: 0
      物品: {}
    接取对话键: "quest.主线1.dialog.accept"
    进行中对话键: "quest.主线1.dialog.progress"
    可交付对话键: "quest.主线1.dialog.deliver"
    完成后对话键: "quest.主线1.dialog.complete"

