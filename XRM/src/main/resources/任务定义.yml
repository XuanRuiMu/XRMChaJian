# 任务定义配置
# 定义所有任务的静态属性，由任务注册服务加载
#
# 字段说明：
#   分类: 主线|支线|日常
#   名称翻译键: 任务名称的翻译键（用于客户端显示）
#   描述翻译键: 任务描述的翻译键（用于客户端显示）
#   所需等级: 接取任务所需的最低等级（0表示无限制）
#   可重复: 是否可重复完成（日常任务为true）
#   前置任务: 前置任务ID列表（必须全部完成才能接取）
#   接取NPC: 接取任务的NPC名称
#   交付NPC: 交付任务的NPC名称
#   目标:
#     类型: 击杀实体|收集物品|到达位置|对话NPC|使用技能|条件检查|护送
#     目标ID: 实体类型/物品材质/NPC名称/技能标识/条件标识
#     数量: 目标数量
#   奖励:
#     经验等级: 奖励的经验等级数
#     金币: 奖励的金币数（预留，需经济系统）
#     物品: 物品ID:数量 映射
#   接取对话键/进行中对话键/可交付对话键/完成后对话键: NPC对话翻译键

