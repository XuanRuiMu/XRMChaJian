# XRMmljy 配置文件
# 版本: 2026.3.8
# 警告: 请勿手动修改版本号，否则配置将被重置

# ===== 调试设置 =====
# 全局调试开关：控制 调试日志器 是否输出 [XRM-DEBUG][模块] 消息 调试日志
# 各模块独立的细化开关见下方 日志.调试配置
调试:
  全局开关: true
  # 已禁用模块列表（黑名单模式：列表中的模块名不输出调试日志，其余模块正常输出）
  # 默认空列表表示所有模块都输出调试日志
  # 可用模块名（区分大小写）：
  #   总菜单、总菜单命令、反伤监听器、躲闪监听器、奥术冲击
  #   内存玩家服务、内存属性服务、Yaml配置加载器、公CD显示服务
  #   技能释放服务、技能按键监听器、伤害计算服务、属性计算服务
  #   日志合并管理器、战斗状态服务、计分板服务、属性命令处理器
  #   菜单服务、菜单配置加载器、乐器服务、效果调度服务
  #   战斗日志上下文、职业类型服务、混沌束缚
  # 高频模块（建议在非调试时加入黑名单）：日志合并管理器、伤害计算服务、属性计算服务、技能按键监听器、公CD显示服务
  已禁用模块: []

# ===== 日志设置 =====
# 更改：支持分功能独立控制调试信息输出和文件存储
日志:
  # 全局日志级别：ERROR / WARN / INFO / DEBUG
  级别: "INFO"

  # ===== 分功能调试配置 =====
  # 每个功能可以独立控制：
  # - 日志：是否输出到服务端控制台
  # - 存储：是否保存到文件（plugins/XRM/日志/日期_编号.txt）

  调试配置:
    # 技能系统调试
    技能:
      日志: true
      存储: true

    # 战斗系统调试（伤害计算、暴击、吸血等）
    战斗:
      日志: true
      存储: true

    # 仇恨系统调试
    仇恨:
      日志: true
      存储: true

    # 属性系统调试（属性计算、更新等）
    属性:
      日志: true
      存储: true

    # 资源系统调试（法力、能量、怒气等）
    资源:
      日志: true
      存储: true

    # 被动技能调试
    被动技能:
      日志: true
      存储: true

    # 秘兆调试（奥能法师精通被动）
    秘兆:
      日志: true
      存储: true

    # 奥术冲击调试
    奥术冲击:
      日志: true
      存储: true

    # 秘法陨落调试
    秘法陨落:
      日志: true
      存储: true

    # 菜单系统调试
    菜单:
      日志: true
      存储: true

    # 玩家数据调试
    玩家数据:
      日志: true
      存储: true

    # 额外功能调试（伤害免疫、岩浆块等）
    额外功能:
      日志: true
      存储: true

    # 驭空术系统调试
    驭空术:
      日志: true
      存储: true

    # 天赋系统调试
    天赋:
      日志: true
      存储: true

# ===== 技能设置 =====
技能:
  # 玩家个人技能日志默认是否开启
  默认技能日志开启: true

  # 专精编号映射（专精名称→编号）
  # 技能标识格式为 {专精编号}_{槽位编号}，如 1_1 表示奥能法师的第一技能
  专精编号映射:
    奥能法师: 1

# ===== 战斗设置 =====
战斗:
  # 玩家个人战斗日志默认是否开启
  默认战斗日志开启: true

  # 脱战判定：持续多少秒没有战斗行为则脱战
  战斗状态退出秒数: 5

  # 仇恨自然衰减：每秒衰减比例（0.05 = 5%）
  # 注意：需求文档规定"只要玩家不死且距离在40格内，仇恨不会随时间衰减"，此配置仅作保留
  仇恨衰减每秒比例: 0.05

  # 仇恨最大有效距离（单位：格）
  仇恨最大距离: 40.0

  # 仇恨是否需要视野
  # 更新：不需要视线也可以维持仇恨
  仇恨需要视野: false

  # 仇恨清除范围（管理员命令用）
  仇恨清空范围: 40.0

  # 仇恨系数（按角色类型区分）
  # 坦克3倍、治疗0.5倍、输出1倍
  仇恨系数:
    坦克: 3.0
    治疗: 0.5
    输出: 1.0

  # 战斗中命令白名单（不带/）
  命令白名单:
    - "msg"
    - "tell"
    - "w"
    - "r"
    - "me"
    - "xrmp"
    - "xrmop"
    - "jn"

# ===== 伤害探针设置 =====
# FP-04 EliteMobs伤害根因验证探针
# 默认关闭，需要时手动开启。开启后会监听所有XRM技能伤害事件并输出6个优先级（LOWEST/LOW/NORMAL/HIGH/HIGHEST/MONITOR）的伤害值日志
# 用于定位 EliteMobs 是否在某个事件优先级修改了XRM技能伤害的数值
伤害探针:
  启用: false

# ===== EliteMobs伤害修复设置 =====
# FP-03 EliteMobs伤害归一化修复
# 根因：EliteMobs 10 通过监听 EntityDamageByEntityEvent 重新计算"玩家对精英怪"的伤害
# 公式基于玩家武器技能等级 + 物品等级 + Boss等级 + 技能加成，与传入 damage() 的数值无关
# 当玩家武器技能/物品等级较低时，公式输出值被 max(formulaDamage, 1) 下限提升为1.0
# 这导致 XRM 技能伤害 2.0/4.0/8.0 被统一替换为 1.0
# 修复：在 HIGHEST 优先级监听事件，识别 XRM 技能伤害（PDC 键 xrm_skill_damage），强制恢复为 XRM 预期值
# 官方文档依据：wiki.nightbreak.io/EliteMobs/damage_system + docs.superiormc.cn/elitemobs-wiki/zhi-nan/shang-hai-xi-tong
# 默认启用：仅修改 PDC 含 xrm_skill_damage 键的事件，不影响普通伤害或其他插件
EliteMobs伤害修复:
  启用: true

# ===== 属性设置 =====
属性:
  # 公共冷却基础值（秒）
  基础公CD秒数: 1.2
  # 当前赛季最高等级
  最高等级: 60

# ===== 显示设置 =====
显示:
  # 是否在计分板显示技能冷却
  技能冷却展示开启: true
  # 生命条默认显示的总体红心数量；玩家加入、重连和重置时使用此值
  生命条:
    默认总体红心数: 20

# ===== 总菜单设置 =====
总菜单:
  # 菜单大小（必须为9的倍数，最大54）
  菜单大小: 54
  # 任务系统入口
  任务系统:
    槽位: 20
    物品材质: "BOOK"
  # 属性系统入口
  属性系统:
    槽位: 28
    物品材质: "DIAMOND_SWORD"
    # 点击属性系统执行的命令（不带/）
    命令: "sx"
  # 技能日志开关入口
  技能日志设置:
    槽位: 11
    物品材质: "FEATHER"
  # 战斗日志开关入口
  战斗日志设置:
    槽位: 13
    物品材质: "IRON_SWORD"

# ===== 数据持久化设置 =====
数据持久化:
  # 存储方式：YAML（未来可替换为MySQL）
  存储方式: "YAML"
  # 玩家数据存储目录（相对于plugins/XRM/）
  数据目录: "玩家数据"
  # 是否启用自动保存
  自动保存: true
  # 自动保存间隔（秒）
  自动保存间隔: 300

# ===== 玩家默认设置 =====
玩家默认设置:
  # 新玩家默认职业
  默认职业: "魔法世界"
  # 新玩家默认专精
  默认专精: "奥能法师"
  # 新玩家默认技能日志开关
  默认技能日志开启: true
  # 新玩家默认战斗日志开关
  默认战斗日志开启: true

# ===== 数据库设置 =====
数据库:
  # 数据库主机地址
  主机: "localhost"
  # 数据库端口
  端口: 3306
  # 数据库名称
  数据库名: "燃烧之陨"
  # 数据库用户名
  用户名: "root"
  # 数据库密码
  密码: "BXYXblupz542284"

# ===== 额外功能 =====
额外功能:
  # 总开关
  总开关: true

  # 调试输出：开启后会额外输出一些日志
  调试输出: false

  # 伤害免疫（无敌帧）控制
  伤害免疫:
    # 取消玩家无敌帧
    取消玩家无敌帧: true
    # 取消生物无敌帧
    取消生物无敌帧: true
    # 监控持续时间（秒）
    监控持续秒: 5
    # 监控检查间隔（tick，20tick=1秒）
    监控间隔Tick: 1
    调试伤害事件: false
    调试免疫状态: false
    调试监控任务: false

  # 岩浆块伤害免疫
  岩浆块免疫:
    玩家免疫: true
    狗免疫: true

  # 猪灵相关
  猪灵:
    取消以物易物: true
    永久敌对: true
    索敌范围: 20.0
    # 阻止猪灵僵尸化（例如主世界停留导致的僵尸化）
    阻止僵尸化: true
    # 强制敌对检查间隔（tick，20tick=1秒）
    检查间隔Tick: 20

  # 蜘蛛相关
  蜘蛛:
    永久敌对: true
    索敌范围: 20.0
    检查间隔Tick: 20

  # 末影人相关
  末影人:
    免疫水雨伤害: true
    禁止传送: true

  # 击退抗性
  击退抗性:
    开启: true
    # 0.0~1.0，越高越不容易被击退
    值: 1.0

# ===== 语言设置 =====
语言:
  服务器默认语言: "zh"

# ===== 组队设置 =====
组队:
  # 邀请过期时间（秒）
  邀请过期秒数: 30
  # 离线踢出时间（秒），参考WoW：离线超时自动移出队伍
  离线踢出秒数: 300
  # 最大队伍人数（5人小队）
  最大队伍人数: 5

# ===== 乐器设置 =====
# 乐器配置由独立文件 乐器配置.yml 管理（FP-13 配置驱动，修复 GAP-08 双轨问题）
# 此处仅保留引用，实际配置请见 乐器配置.yml
# 支持热重载：/乐器 重载 后即时生效
乐器:
  配置文件: "乐器配置.yml"

# ===== 驭空术设置 =====
驭空术:
  # 总开关
  总开关: true
  # 战斗中是否禁用驭空术
  战斗中禁用: true

  # 活力系统
  活力:
    # 活力上限
    上限: 100.0
    # 飞行每秒消耗
    飞行每秒消耗: 5.0
    # 地面每秒恢复
    地面每秒恢复: 10.0
    # 飞行每秒恢复（额外恢复，可为0）
    飞行每秒恢复: 0.0

  # 起飞技能
  起飞:
    # 消耗活力
    消耗: 20.0
    # 升空高度（格）
    升空高度: 20.0
    # 升空时长（tick，20tick=1秒）
    升空时长: 40

  # 冲刺技能
  冲刺:
    # 消耗活力
    消耗: 15.0
    # 冷却（tick）
    冷却: 60
    # 推力（加速度）
    推力: 1.1
    # 持续Tick
    持续Tick: 30

  # 爆发技能
  爆发:
    # 消耗活力
    消耗: 25.0
    # 冷却（tick）
    冷却: 100
    # 推力（加速度）
    推力: 0.9
    # 持续Tick
    持续Tick: 30

  # 俯冲技能
  俯冲:
    # 消耗活力
    消耗: 10.0
    # 冷却（tick）
    冷却: 40
    # 推力（加速度）
    推力: 1.5
    # 持续Tick
    持续Tick: 30

  # 飞行物理参数
  物理:
    # 重力加速度（每tick）
