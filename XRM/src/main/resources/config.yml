    俯冲加速倍数: 2.0
    # 抬头减速倍数
    抬头减速倍数: 0.5

  # 摔落保护
  摔落保护:
    # 保护秒数（驭空状态结束后免疫摔落伤害的时长）
    秒数: 2

  # 准驭空状态
  准驭空:
    # 超时秒（骑乘后第一次按空格进入准驭空，超时后回到地面状态）
    超时秒: 1
    # 双击间隔毫秒（连续两次按空格视为双击）
    双击间隔毫秒: 500

  # BossBar显示
  BossBar:
    # 更新间隔Tick
    更新间隔Tick: 5
