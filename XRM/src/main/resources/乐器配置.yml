# ===== 钢琴布局配置（FP-03 黑白键槽位）=====
# 黑键在白键上方一行（第 4 行 36-44 槽穿插空槽）
# 白键在第 5 行 45-53 槽
# 黑键音高偏移：相对当前音域根音的半音数（C#=1, D#=3, F#=6, G#=8, A#=10）
# 白键音高偏移：C=0, D=2, E=4, F=5, G=7, A=9, B=11
