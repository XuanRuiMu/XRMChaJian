# ============================================
# 暮澜纪元插件 - 乐器详细配置
# 此文件为乐器系统的唯一配置源（FP-13 配置驱动）。
# config.yml 仅保留引用：乐器.配置文件: 乐器配置.yml
# 音色字段对应Bukkit Sound枚举，通过player.playSound(Location, Sound, volume, pitch)播放
# pitch对应音高（0.5-2.0），由音高值（0-24）通过公式 pow(2.0, (音高-12)/12.0) 计算
# 支持热重载：/乐器 重载 后即时生效
# ============================================

# ===== 全局参数 =====
全局:
  # 音符听觉范围（格）
  听觉范围: 48.0
  # 是否显示音符粒子效果
  音符粒子效果: true
  # 每个玩家最大乐谱存储数
  最大乐谱存储数: 20
  # 最大录制时长（秒）
  最大录制时长秒: 300
  # 默认速度BPM
  默认速度BPM: 120
  # 默认时值Tick
  默认时值Tick: 4
  # 默认力度（0.0-1.0）
  默认力度: 1.0
  # 默认音量（0.0-1.0）
  默认音量: 1.0
  # 合奏最小人数
  合奏最小人数: 2

# ===== 乐器列表（23 种：16 原版基础 + 6 头颅 + 1 Trumpet）=====
