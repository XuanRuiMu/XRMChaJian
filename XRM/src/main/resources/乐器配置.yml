# ===== 节拍器配置（FP-08）=====
# 节拍器作为演奏/录音/合奏的统一节奏时钟源
# BPM转tick间隔：每拍tick = 1200/BPM（如120BPM→10tick/拍）
节拍器:
  # 默认BPM（每分钟拍数）
  默认BPM: 120
  # 默认拍号（分子/分母，如4/4即每小节4拍以四分音符为一拍）
  默认拍号分子: 4
  默认拍号分母: 4
  # 强拍音色（每小节第一拍，Sound枚举）
  强拍音色: "BLOCK_NOTE_BLOCK_HAT"
  # 弱拍音色（其余拍，Sound枚举）
  弱拍音色: "BLOCK_NOTE_BLOCK_HAT"
  # 强拍音高（pitch值，0.5-2.0）
  强拍音高: 1.0
  # 弱拍音高（pitch值，0.5-2.0）
  弱拍音高: 0.5
  # 强拍音量（0.0-1.0）
  强拍音量: 1.0
  # 弱拍音量（0.0-1.0）
  弱拍音量: 0.6
  # count-in 预备拍小节数（FP-08.3 / O1，0/1/2，默认 1）
  # 演奏/录制/合奏前发出 count-in 节拍声 + 标题字幕提示
  # 0 = 无 count-in，1 = 1 小节预备拍，2 = 2 小节预备拍
  count-in小节数: 1
  # FP-10 播放中拍号显示开关（false=仅 count-in 显示，true=播放中也显示当前拍号位置如 1/4 2/4 3/4 4/4）
  拍号显示: false

# ===== 演奏界面配置（FP-03 6×9 钢琴布局）=====
# GUI 6 行 × 9 列 = 54 槽：
#   第 0 行（槽 0-8）：9 功能位（保存/清除/关闭/NBS导入/NBS导出/和弦预设/公共乐谱库/钢琴卷帘编辑/分层切换）
#   第 1-3 行（槽 9-35）：中部显示区（音域/力度切换 + 录制/停止/播放 + 延音模式切换 + 装饰）
#   第 4 行（槽 36-44）：黑键行（5 黑键穿插空槽）
#   第 5 行（槽 45-53）：白键行（7 白键 + 2 装饰）
# 钢琴布局遵循"黑键在上、白键在下"的真实钢琴视觉惯例
演奏界面:
  # GUI大小（必须是9的倍数）
  GUI大小: 54

# ===== 9 功能位配置（FP-03 默认分配）=====
# 前 3 个（保存/清除/关闭）功能已实现
