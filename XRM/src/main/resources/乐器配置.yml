  黑键槽位: [37, 39, 41, 42, 43]
  白键槽位: [45, 46, 47, 48, 49, 50, 51]
  黑键音高偏移: [1, 3, 6, 8, 10]
  白键音高偏移: [0, 2, 4, 5, 7, 9, 11]

# ===== 延音配置（FP-04）=====
# 受 MC 原版 playSound「一击即逝」限制，延音通过对同一音以略低音量重复触发若干次模拟自然衰减尾音
# 按住模式（默认）：点击音符=开始持续播放，关闭GUI=停止
# 切换模式（可选）：再点击同音符=停止
延音:
  # 默认延音模式：按住 / 切换
  默认模式: 按住
  # 重触发间隔（tick，1秒=20tick）
  重触发间隔: 4
  # 重触发次数（含首次触发，共触发 N 次）
  重触发次数: 4
  # 音量衰减系数（每次重触发音量乘以此系数，0-1）
  衰减系数: 0.85

# ===== 键位绑定配置（FP-06 逐音域完全独立绑定）=====
# 5 音域 × 12 键 = 60 项配置，每个音域拥有独立的完整键位映射表。
# 默认填充规则（八度平移）：
#   - 音域 k 的根音 = 基准根音（音域 0）+ k × 12 个半音
#   - 音域 0 是基础，必须显式配置；音域 1-4 可省略，回退到八度平移
#   - 玩家可在任意音域 k 显式指定某键的音高，覆盖默认的八度平移结果
# 默认键位流派：Apple Musical Typing（A S D F G H J 白键 + W E T Y U 黑键）
# 键名大小写不敏感；a/s/d/f/g/h/j 为白键，w/e/t/y/u 为黑键
# 音高取值范围：0-59（5 音域 × 12 半音）
键位绑定:
  音域0:
    a: 0   # F♯3
    s: 1   # G3
    d: 2   # G♯3
    f: 3   # A3
    g: 4   # A♯3
    h: 5   # B3
    j: 6   # C4
    w: 7   # C♯4
    e: 8   # D4
    t: 9   # D♯4
    y: 10  # E4
    u: 11  # F4
  # 音域 1-4 未配置时自动按八度平移填充（根音 = 12, 24, 36, 48）
  # 玩家可在此显式覆盖任意键，例如：
  # 音域1:
  #   a: 14  # 覆盖默认的 12，改为 G♯4

# ===== mod 玩家真实力度配置（FP-05.2 velocity-by-duration）=====
# 仅 mod 玩家可启用，需在 /乐器 偏好 中显式开启「真实力度（按键时长）」开关
# 算法：服务端记录按键按下与松开时刻，velocity = clamp(round((松开-按下)/最大有效时长 × 127), 0, 127)
# 响应延迟：按下后服务端不立即发声，等待松开后才计算 velocity 并播放（业界已知缺陷，用户已接受）
# 关闭时回退到 5 档力度（pp/p/mf/f/ff，C/V 切换）
mod:
  # 是否启用按键时长反推真实力度（默认 false）
  velocity-by-duration: false
  # 最大有效时长（毫秒），超过则视为 ff；默认 400ms
  最大有效时长ms: 400

# ===== 录音量化配置（FP-09 非破坏性量化）=====
# 录音默认开启量化，避免人手按键误差导致回放节奏混乱
# 非破坏性：保留原始时间，量化仅为回放/导出视图，玩家可通过 /乐器 录音 撤销量化 恢复原始
# 量化算法：将每个录音音符的累计起始 tick 吸附到最近的量化网格点
# 网格 tick = (1200 / BPM) / 每拍分割数
量化:
  # 默认量化档位（可选：1/8 / 1/16 / 1/32 / 1/8T / 1/16T / 1/32T，T = 三连音变体）
  # 1/8 = 每半拍一网格，1/16 = 每 1/4 拍一网格（默认），1/32 = 每 1/8 拍一网格
  # 三连音变体：3/6/12 分割数，产生三连音感
  默认档位: "1/16"
  # 录音时是否默认开启量化（玩家可运行时覆盖）
  默认开启: true

# ===== swing 量化配置（FP-09.3 / O2）=====
# swing 比例 50%-65%：50% = 直（无 swing），>50% 三连音感，默认 50% 即关闭
# 业界常用 55%-65% 范围产生轻 swing 感
# swing 仅影响非首拍位置（半拍处的 8 分音符弱拍），首拍不变
# 三连音档位不应用 swing（已是三连音感）
swing:
  # 默认 swing 比例（0.50-0.65）
  默认比例: 0.50
  # 是否默认启用 swing（玩家可运行时覆盖）
  默认开启: false

# ===== 演奏可视化反馈配置（FP-10）=====
# 三档反馈：GUI 高亮 + 粒子反馈 + 拍号显示
# GUI 玩家：弹奏某音时 GUI 中对应方块短暂切换为发光态（附魔光效 enchant_glint）并恢复
# 世界粒子反馈：弹奏时在玩家位置向上发射对应颜色的粒子（颜色取音名色，FP-02 25 色方块映射）
# 拍号显示：节拍器播放中持续显示当前拍号位置（如 1/4 2/4 3/4 4/4）
可视化:
  # GUI 高亮持续 tick（1秒=20tick，默认 8 tick = 400ms，符合业界 6-10 tick 范围）
  GUI高亮持续tick: 8
  # 是否启用粒子反馈（受全局 音符粒子效果 二次控制，两者均开才显示）
  粒子启用: true
  # 是否启用播放中拍号显示（与 节拍器.拍号显示 等效，热重载时同步到节拍器）
  拍号显示: false

# ===== 和弦预设配置（FP-11 + O8 和弦记忆）=====
# 12 种业界标准和弦预设（maj/min/7/maj7/m7/dim/aug/sus2/sus4/add9/6/9）
# 和弦类型音程集合不可变（参考 mljy.领域层.乐器.和弦类型 枚举）
# 和弦记忆（O8）：按一次和弦键开始循环播放和弦，再按一次或切换停止
和弦:
  # 和弦记忆默认重触发间隔（tick，1秒=20tick，默认 10 tick = 500ms）
  # 调用方可通过 启动和弦记忆 自定义间隔，此处仅作默认值
  默认记忆重复间隔: 10

# ===== 公共乐谱库配置（FP-18 / O4）=====
# 玩家上传/下载/评分/审核乐谱，所有玩家共享
# 存储路径：plugins/XRM/公共乐谱/{乐谱ID}.yml
# 乐谱ID：UUID 前 8 位十六进制，碰撞时重新生成
公共乐谱库:
  # 评分范围下限（含）
  评分下限: 1
  # 评分范围上限（含）
  评分上限: 5
  # 乐谱ID长度（十六进制字符数，默认 8）
  乐谱ID长度: 8
  # ID 生成最大尝试次数（避免极端碰撞死循环）
  ID生成最大尝试: 5

# ===== 分层键盘配置（FP-19 / O7）=====
# 分层键盘 split：左区音高 < 分界点用左乐器，右区音高 >= 分界点用右乐器
# 玩家通过 GUI 分层切换按钮（槽 8）切换分层模式开关
# mod 玩家可在 /乐器 偏好 中指定乐器 1（左）/乐器 2（右）
# 未启用分层时所有音高使用玩家当前乐器；启用分层时左右乐器未配置回退到当前乐器
分层:
  # 新玩家默认是否启用分层模式（默认 false，需玩家显式切换）
  默认启用: false
  # 默认分界点音高（0-24，默认 12 = C4 中间 C）
  默认分界点: 12

# ===== 弯音轮 + 调制轮配置（FP-21 / O6，mod 独享）=====
# 弯音轮：0-127，64 = 无弯音，0 = -范围半音，127 = +范围半音
# 调制轮：0-127，0 = 无颤音，127 = 最大颤音深度（±0.5 半音）
# 颤音频率默认 6 Hz（每秒 6 次周期性变化），与业界 LFO 标准范围 5-7 Hz 一致
# 服务端权威计算：pitch 倍率 = pow(2, 半音偏移/12)；调制通过 sin 函数 + 时间相位
弯音调制:
  # 默认弯音范围（半音，1-12，默认 ±2 半音，符合 MIDI 标准）
  默认弯音范围半音: 2
  # 默认调制频率（Hz，1-10，默认 6 Hz）
  默认调制频率Hz: 6

# ===== 资源包配置（FP-14 保底方案）=====
# 资源包策略：原版保底 + 资源包增强 + 不强制推送
# - 不装资源包的玩家听到原版 block.note_block.* 音色（12-16 种），力度降级为纯 volume 变化
# - 装了资源包的玩家获得扩展乐器音色 + 真实尾音衰减采样
# - 玩家拒绝下载时降级为原版保底音色，功能完整可用
# 资源包路径：plugins/XRM/资源包/（含 pack.mcmeta + assets/minecraft/sounds/xrm/）
# pack_format 26 对应 MC 1.21.x（与 Purpur 26.2 兼容）
资源包:
  # 是否启用资源包推送（默认 false，玩家自愿下载）
  启用: false
