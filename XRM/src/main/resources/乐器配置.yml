#   默认音域 / 音域下限 / 音域上限 / 八度偏移 / 物理机制 / 力度敏感 / 描述
# 物理机制取值（FP-13.4）：瞬时触发 / 持续激励 / 慢衰减
# NoteBlockAPI乐器ID（FP-23.4）：0-17，-1 或省略表示不使用 NoteBlockAPI
