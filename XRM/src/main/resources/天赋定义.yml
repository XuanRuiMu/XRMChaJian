# 天赋定义配置
# 定义所有专精的天赋树（DAG有向无环图），由天赋注册服务加载
#
# 字段说明：
#   最大点数: 该专精可投入的天赋点数上限
#   节点: 天赋节点字典，键为天赋标识
#     类型: 普通/选择/关键
#     坐标X: GUI中的列位置（0-8）
#     坐标Y: GUI中的行位置（0-5），槽位=Y×9+X
#     前置: 前置天赋标识列表（OR逻辑：任一满足即可）
#     选择组: 选择组名称（同组互斥，只能选一个；空字符串表示无选择组）
#     所需总点数: 学习此天赋需要已投入的总点数门控
#     影响技能: 此天赋影响的技能名称列表（用于UI显示）
#     名称翻译键: 天赋名称的翻译键
#     描述翻译键: 天赋描述的翻译键
#     修饰器: 此天赋附带的修饰器列表（学习时自动注册，取消时自动注销）
#       类别: 修饰器类别（如 属性_智力、伤害_全伤害百分比、资源_秘能上限 等）
#       方式: 相加/相乘/覆盖
#       数值: 修饰器数值
#       优先级: 修饰器优先级（数字越小越优先）

天赋树:
  奥能法师:
    最大点数: 10
    节点:
      奥术亲和:
        类型: 普通
        坐标X: 4
        坐标Y: 0
        前置: []
        选择组: ""
        所需总点数: 0
        影响技能:
          - 奥术冲击
        名称翻译键: "talent.奥能法师.奥术亲和.name"
        描述翻译键: "talent.奥能法师.奥术亲和.description"
        修饰器:
          - 类别: "技能_奥术冲击伤害系数"
            方式: 覆盖
            数值: 0.08
            优先级: 0
          - 类别: "资源_充能衰减速度"
            方式: 相乘
            数值: 2.0
            优先级: 0

      奥术涌动:
        类型: 普通
        坐标X: 2
        坐标Y: 1
        前置:
          - 奥术亲和
        选择组: ""
        所需总点数: 1
        影响技能:
