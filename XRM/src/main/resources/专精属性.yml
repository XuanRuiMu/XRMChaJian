# 专精基础属性配置
# 定义各专精的初始基础属性（未经修饰器处理）
# 属性说明：
#   生命值上限: 玩家最大生命值
#   公共冷却时间: 基础GCD秒数（受急速影响递减）
#   急速: 影响GCD/蓄力时间（除法模型，受通用递减约束）
#   力量/敏捷/智力: 三主属性，影响技能数值
#   法术暴击几率: 每点增加1%暴击率
#   法术暴击伤害: 每点增加1%暴击额外伤害
#   精通: 影响特定技能数值
#   全能: 每点+0.5%伤害+0.5%减伤
#   吸血: 每点造成伤害/治疗时按比例治疗自身
#   躲闪: 每点1%几率免疫普通攻击
#   生命恢复: 脱战时每秒恢复生命值
#   移速: 移动速度加成

