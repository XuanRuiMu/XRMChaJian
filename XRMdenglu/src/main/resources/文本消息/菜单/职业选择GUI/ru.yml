职业描述:
  奥能法师: "<red>Дальний <blue>магический</blue> DPS, стабильный урон.</red>|<gray>Обладает способностями контроля толпы.</gray>"
  战斗法师: "<red>Дальний <blue>магический</blue> DPS, ближний <gray>физический</gray> DPS, взрывной урон.</red>|<gray>Накапливает ресурсы для взрывного урона.</gray>"
  符文法师: "<red>Ближний <blue>магический</blue> DPS.</red>|<gray>Специализируется на сопротивлении <blue>магическому</blue> урону. Использует навыки для массового снижения урона или взрывного урона.</gray>"
  大魔导师: "<red>Дальний <blue>магический</blue> DPS.</red>|<gray>После применения различных усиливающих навыков, выпускает <blue>магические</blue> снаряды с различными эффектами.</gray>"
  德鲁伊: "<red>Ближний <gray>физический</gray> DPS, дальний <blue>магический</blue> DPS.</red>|<green>Продолжительное исцеление.</green>"
  精灵卫士: "<red>Дальний <blue>магический</blue> DPS. Весь урон — AoE малого радиуса.</red>|<gray>Низкий личный урон, но может перемещать себя и союзников.</gray>|<gray>Может накапливать Звёздные Осколки для урона или снижения урона союзников.</gray>"
  树人守卫: "<gray>Канализирует для массового снижения урона, но замедляет себя.</gray>|<red>Сильный урон от навыков и снижение урона.</red>|<green>Впечатляющее самоисцеление.</green>"
  荆棘领主: "<green>Сильный похищение жизни.</green>|<red>Призывает шипы в области, нанося урон врагам и накладывая уязвимость.</red>"
  枪炮师: "<red>Дальний <gray>физический</gray> DPS.</red>|<red>Стоя на месте увеличивает шанс критического удара.</red>|<red>Наносит дополнительный урон целям с высоким здоровьем.</red>"
  机械师: "<red>Ближний <gray>физический</gray> DPS, стабильный урон.</red>|<red>Атаки накладывают кровотечение на врагов.</red>|<gray>Сильные способности самосохранения.</gray>"
  修补匠: "<gray>Переключайтесь между тремя различными формами для разных ситуаций.</gray>|<gray>Может размещать механические устройства.</gray>"
  狐灵法师: "<red>Дальний <blue>магический</blue> DPS.</red>|<gray>Более низкий урон, но может усиливать союзников.</gray>"
  蛇影刺客: "<red>Ближний заклинательный DPS, взрывной урон.</red>|<red>Полагается на комбо для массового урона.</red>"
  鹿灵祭司: "<red>Может накладывать уязвимость на врагов.</red>|<green>Союзники, атакующие уязвимые цели, исцеляют заклинателя.</green>"
  虎威战士: "<green>Сопротивление и регенерация здоровья увеличиваются при снижении здоровья.</green>|<gray>Накапливает полученный урон за короткое время для обмена на взрывной щит.</gray>"
  灵魂行者: "<green>Широкоугольное исцеление или контроль толпы.</green>|<green>Более низкое исцеление одной цели, но делится здоровьем с союзниками.</green>"
  骑士: "<red>Ближний <gray>физический</gray> DPS.</red>|<green>Навык неуязвимости с коротким восстановлением.</green>|<green>Впечатляющая способность исцеления.</green>"
  牧师: "<green>Исцеление увеличивается с недостающим здоровьем цели.</green>|<green>Критические исцеления дают дополнительные преимущества.</green>"
  神谕者: "<red>Ближний заклинательный DPS.</red>|<gray>Некоторые навыки влияют и на союзников, и на врагов.</gray>|<gray>Может одновременно увеличить урон и получаемый урон цели, предоставляя щиты и уязвимость.</gray>"
  战地统帅: "<red>Ближний <gray>физический</gray> DPS, взрывной урон.</red>|<gray>Получает заряд каждый раз, когда ближайшие союзники применяют навык.</gray>|<gray>Использует этот ресурс для урона или исцеления союзников.</gray>|<green>Обладает аурой снижения урона по площади.</green>"
  影舞者: "<red>Ближний <gray>физический</gray> DPS.</red>|<red>Атака со спины цели наносит дополнительный урон.</red>|<red>Обладает способностью казни.</red>"
  暗影术士: "<red>Дальний <blue>магический</blue> DPS.</red>|<red>Нанесение урона врагам оставляет метки.</red>|<red>Детонация меток через навыки вызывает AoE урон и распространяет метки.</red>"
  冰霜战士: "<red>Больше здоровья — больше урона.</red>|<gray>Навыки могут замораживать врагов.</gray>|<red>Наносит бонусный урон замороженным целям.</red>"
  暗影守卫: "<green>Пассивное снижение урона увеличивается с количеством ближайших врагов.</green>|<green>Притягивает ближайших врагов и исцеляет себя.</green>|<green>Поглощает урон и конвертирует его в здоровье со временем.</green>|<green>Может временно сделать союзников неуязвимыми.</green>"
  末日预言者: "<green>После наложения Молитвы Погибели на союзников, нанесение урона врагам исцеляет союзников.</green>|<gray>Может применять контроль толпы на большой площади.</gray>|<green>На пороге смерти восстанавливает собственное здоровье.</green>"
  死灵收割者: "<red>Ближний <gray>физический</gray> и <blue>магический</blue> урон.</red>|<gray>Получает временные Остатки при нанесении урона или когда ближайшие враги умирают.</gray>|<gray>Расходует Остатки для высвобождения мощных навыков урона.</gray>"
  女巫: "<red>Дальний <blue>магический</blue> DPS, DEBUFF урон с длинными интервалами, AoE урон.</red>|<green>Площадное исцеление с долгим восстановлением.</green>|<green>Может дать себе и союзникам иммунитет к массовому урону.</green>"
  沸血战士: "<red>Активный навык непрерывно расходует собственное здоровье для усилений.</red>|<red>После активации получает эффект Жажды Крови в секунду, увеличивая получаемый урон.</red>|<gray>Может высвободить этот ресурс для дополнительных усилений.</gray>|<red>Ниже 50% здоровья получает Рассечение и другие дополнительные усиления.</red>"
  雷电督军: "<red>Дальний <blue>магический</blue> DPS, стабильный урон.</red>|<gray>Обладает мощными навыками контроля.</gray>|<red>Часть урона наносит дополнительный урон щитам.</red>|<red>Большинство навыков случайным образом отскакивают к другому ближайшему врагу.</red>"
  平衡术士: "<red>Дальний <gray>физический</gray>/<blue>магический</blue> DPS.</red>|<gray>Навыки разделены на несколько типов.</gray>|<red>Использование навыка другого типа, чем предыдущий, наносит бонусный урон.</red>"
  深渊吞噬者: "<red>Дальний <blue>магический</blue> DPS.</red>|<gray>Навыки могут накладывать DEBUFF на себя; активно высвободить для наложения этих DEBUFF на ближайших врагов и самоисцеления.</gray>|<green>На пороге смерти пожирает ближайших врагов и восстанавливает <dark_green><bold>здоровье</bold></dark_green>.</green>"
  混沌使者: "<red>Ближний <blue>магический</blue> DPS, более низкий урон.</red>|<gray>Навыки могут накладывать случайные DEBUFF на врагов и снижать их силу атаки.</gray>|<gray>При попадании под контроль толпы, может перенести его на ближайших врагов.</gray>"
  时空旅行家: "<red>Дальний <blue>магический</blue> DPS.</red>|<green>Может записывать и перематывать здоровье союзников, предоставляя щиты случайной величины и снижение урона.</green>|<red>Накладывает нарастающий урон и замедление на врагов.</red>|<gray>Случайно увеличивает или уменьшает собственное исцеление и урон.</gray>"
  幻影灵魂: "<red>Дальний <blue>магический</blue> DPS.</red>|<gray>Атака врагов или исцеление союзников накапливает метки на них.</gray>|<gray>Детонация меток случайно вызывает исцеление/урон/контроль/усиление урона.</gray>"
  梦魇咒术师: "<gray>Использует различные комбинации навыков для урона/исцеления/танкования и всех функций.</gray>"
