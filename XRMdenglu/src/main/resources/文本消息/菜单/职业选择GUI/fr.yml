职业描述:
  奥能法师: "<red>DPS <blue>magique</blue> à distance, dégâts constants.</red>|<gray>Possède des capacités de contrôle.</gray>"
  战斗法师: "<red>DPS <blue>magique</blue> à distance, DPS <gray>physique</gray> au corps à corps, dégâts explosifs.</red>|<gray>Accumule des ressources pour des dégâts explosifs.</gray>"
  符文法师: "<red>DPS <blue>magique</blue> au corps à corps.</red>|<gray>Spécialisé dans la résistance aux dégâts <blue>magiques</blue>. Utilise des compétences pour une réduction massive des dégâts ou des dégâts explosifs.</gray>"
  大魔导师: "<red>DPS <blue>magique</blue> à distance.</red>|<gray>Après avoir lancé différents sorts d'amélioration, libère des projectiles <blue>magiques</blue> aux effets variés.</gray>"
  德鲁伊: "<red>DPS <gray>physique</gray> au corps à corps, DPS <blue>magique</blue> à distance.</red>|<green>Soin soutenu.</green>"
  精灵卫士: "<red>DPS <blue>magique</blue> à distance. Tous les dégâts sont des AoE à courte portée.</red>|<gray>Faible dégâts personnels, mais peut repositionner soi-même et les alliés.</gray>|<gray>Peut accumuler des Éclats Stellaires pour des dégâts ou la réduction de dégâts des alliés.</gray>"
  树人守卫: "<gray>Canalise pour obtenir une réduction massive des dégâts, mais se ralentit.</gray>|<red>Forts dégâts de compétences et réduction des dégâts.</red>|<green>Impressionnante auto-guérison.</green>"
  荆棘领主: "<green>Fort vol de vie.</green>|<red>Invoque des ronces dans une zone, infligeant des dégâts aux ennemis et appliquant la vulnérabilité.</red>"
  枪炮师: "<red>DPS <gray>physique</gray> à distance.</red>|<red>Rester immobile augmente les chances de coup critique.</red>|<red>Inflige des dégâts supplémentaires aux cibles avec beaucoup de santé.</red>"
  机械师: "<red>DPS <gray>physique</gray> au corps à corps, dégâts constants.</red>|<red>Les attaques appliquent des saignements aux ennemis.</red>|<gray>Fortes capacités d'auto-préservation.</gray>"
  修补匠: "<gray>Alterne entre trois formes différentes pour gérer diverses situations.</gray>|<gray>Peut déployer des dispositifs mécaniques.</gray>"
  狐灵法师: "<red>DPS <blue>magique</blue> à distance.</red>|<gray>Dégâts inférieurs, mais peut renforcer les alliés.</gray>"
  蛇影刺客: "<red>DPS sort au corps à corps, dégâts explosifs.</red>|<red>S'appuie sur des combos pour des dégâts massifs.</red>"
  鹿灵祭司: "<red>Peut appliquer la vulnérabilité aux ennemis.</red>|<green>Les alliés attaquant des cibles vulnérables soignent le lanceur.</green>"
  虎威战士: "<green>La résistance et la régénération de santé augmentent à mesure que la santé diminue.</green>|<gray>Stocke les dégâts subis sur une courte période pour les échanger contre un bouclier explosif.</gray>"
  灵魂行者: "<green>Soin ou contrôle de zone étendue.</green>|<green>Faible soin monocible, mais partage la santé avec les alliés.</green>"
  骑士: "<red>DPS <gray>physique</gray> au corps à corps.</red>|<green>Compétence d'invulnérabilité à court temps de recharge.</green>|<green>Impressionnante capacité de soin.</green>"
  牧师: "<green>Le soin augmente avec la santé manquante de la cible.</green>|<green>Les soins critiques confèrent des avantages supplémentaires.</green>"
  神谕者: "<red>DPS sort au corps à corps.</red>|<gray>Certaines compétences affectent à la fois les alliés et les ennemis.</gray>|<gray>Peut simultanément augmenter les dégâts et les dégâts subis d'une cible, tout en accordant des boucliers et la vulnérabilité.</gray>"
  战地统帅: "<red>DPS <gray>physique</gray> au corps à corps, dégâts explosifs.</red>|<gray>Gagne une charge chaque fois que des alliés proches lancent une compétence.</gray>|<gray>Utilise cette ressource pour des dégâts ou le soin des alliés.</gray>|<green>Possède une aura de réduction des dégâts de zone.</green>"
  影舞者: "<red>DPS <gray>physique</gray> au corps à corps.</red>|<red>Attaquer par derrière la cible inflige des dégâts supplémentaires.</red>|<red>Possède une capacité d'exécution.</red>"
  暗影术士: "<red>DPS <blue>magique</blue> à distance.</red>|<red>Infliger des dégâts aux ennemis laisse des marques.</red>|<red>Détoner les marques via des compétences provoque des dégâts AoE et propage les marques.</red>"
  冰霜战士: "<red>Plus de santé signifie plus de dégâts.</red>|<gray>Les compétences peuvent geler les ennemis.</gray>|<red>Inflige des dégâts bonus aux cibles gelées.</red>"
  暗影守卫: "<green>La réduction passive des dégâts augmente avec plus d'ennemis proches.</green>|<green>Attire les ennemis proches et se soigne.</green>|<green>Absorbe les dégâts et les convertit en santé au fil du temps.</green>|<green>Peut rendre les alliés temporairement invulnérables.</green>"
  末日预言者: "<green>Après avoir appliqué Prière de Perdition aux alliés, blesser les ennemis soigne les alliés.</green>|<gray>Peut lancer un contrôle de zone étendue.</gray>|<green>À l'approche de la mort, restaure sa propre santé.</green>"
  死灵收割者: "<red>Dégâts <gray>physiques</gray> et <blue>magiques</blue> au corps à corps.</red>|<gray>Gagne des Reliques temporairement en infligeant des dégâts ou quand des ennemis proches meurent.</gray>|<gray>Consomme des Reliques pour déchaîner de puissantes compétences de dégâts.</gray>"
  女巫: "<red>DPS <blue>magique</blue> à distance, dégâts DEBUFF à intervalle long, dégâts AoE.</red>|<green>Soin de zone à long temps de recharge.</green>|<green>Peut accorder à soi-même et aux alliés une immunité contre les dégâts massifs.</green>"
  沸血战士: "<red>La compétence active consomme continuellement sa propre santé pour des améliorations.</red>|<red>Après activation, gagne l'effet de Soif de Sang par seconde, augmentant les dégâts subis.</red>|<gray>Peut libérer cette ressource pour des améliorations supplémentaires.</gray>|<red>En dessous de 50% de santé, gagne Clivage et d'autres bonus supplémentaires.</red>"
  雷电督军: "<red>DPS <blue>magique</blue> à distance, dégâts constants.</red>|<gray>Possède de puissantes compétences de contrôle.</gray>|<red>Certains dégâts infligent des dégâts supplémentaires aux boucliers.</red>|<red>La plupart des compétences rebondissent aléatoirement vers un autre ennemi proche.</red>"
  平衡术士: "<red>DPS <gray>physique</gray>/<blue>magique</blue> à distance.</red>|<gray>Les compétences sont divisées en plusieurs types.</gray>|<red>Utiliser une compétence d'un type différent de la précédente inflige des dégâts bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>magique</blue> à distance.</red>|<gray>Les compétences peuvent appliquer des DEBUFFs à soi-même ; libérer activement pour appliquer ces DEBUFFs aux ennemis proches et se soigner.</gray>|<green>À l'approche de la mort, dévore les ennemis proches et restaure la <dark_green><bold>santé</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>magique</blue> au corps à corps, dégâts inférieurs.</red>|<gray>Les compétences peuvent appliquer des DEBUFFs aléatoires aux ennemis et réduire leur puissance d'attaque.</gray>|<gray>Lorsqu'affecté par un contrôle, peut le transférer aux ennemis proches.</gray>"
  时空旅行家: "<red>DPS <blue>magique</blue> à distance.</red>|<green>Peut enregistrer et rembobiner la santé des alliés, accordant des boucliers de valeur aléatoire et une réduction des dégâts.</green>|<red>Applique des dégâts croissants et un ralentissement aux ennemis.</red>|<gray>Augmente ou réduit aléatoirement ses propres soins et dégâts.</gray>"
  幻影灵魂: "<red>DPS <blue>magique</blue> à distance.</red>|<gray>Attaquer des ennemis ou soigner des alliés empile des marques sur eux.</gray>|<gray>Détoner les marques provoque aléatoirement des soins/dégâts/contrôle/amplification de dégâts.</gray>"
  梦魇咒术师: "<gray>Utilise différentes combinaisons de compétences pour dégâts/soin/tanking et toutes les fonctions.</gray>"
