职业描述:
  奥能法师: "<red>Uzaktan <blue>büyü</blue> DPS, stabil hasar.</red>|<gray>Bazı kalabalık kontrol yetenekleri vardır.</gray>"
  战斗法师: "<red>Uzaktan <blue>büyü</blue> DPS, yakın dövüş <gray>fiziksel</gray> DPS, patlama hasarı.</red>|<gray>Patlama hasarı için kaynak biriktirir.</gray>"
  符文法师: "<red>Yakın dövüş <blue>büyü</blue> DPS.</red>|<gray><blue>Büyü</blue> hasarına dayanıklılıkta uzman. Yetenekler ile büyük hasar azaltma veya patlama hasarı sağlar.</gray>"
  大魔导师: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<gray>Farklı güçlendirme yetenekleri kullandıktan sonra, değişik etkilere sahip <blue>büyü</blue> mermileri fırlatır.</gray>"
  德鲁伊: "<red>Yakın dövüş <gray>fiziksel</gray> DPS, uzaktan <blue>büyü</blue> DPS.</red>|<green>Sürekli iyileştirme.</green>"
  精灵卫士: "<red>Uzaktan <blue>büyü</blue> DPS. Tüm hasar kısa menzilli AoE'dir.</red>|<gray>Düşük kişisel hasar, ama kendini ve müttefikleri konumlandırabilir.</gray>|<gray>Yıldız Parçaları biriktirerek hasar veya müttefik hasar azaltma için kullanabilir.</gray>"
  树人守卫: "<gray>Büyük hasar azaltma için kanalize eder, ama kendini yavaşlatır.</gray>|<red>Güçlü yetenek hasarı ve hasar azaltma.</red>|<green>Etkileyici kendi kendine iyileştirme.</green>"
  荆棘领主: "<green>Güçlü yaşam çalma.</green>|<red>Bir alanda dikenler çağırır, düşmanlara hasar verir ve savunmasızlık uygular.</red>"
  枪炮师: "<red>Uzaktan <gray>fiziksel</gray> DPS.</red>|<red>Durmak kritik vuruş şansını artırır.</red>|<red>Yüksek sağlıklı hedeflere ekstra hasar verir.</red>"
  机械师: "<red>Yakın dövüş <gray>fiziksel</gray> DPS, stabil hasar.</red>|<gray>Saldırılar düşmanlara kanama uygular.</gray>|<gray>Güçlü kendi kendini koruma yetenekleri.</gray>"
  修补匠: "<gray>Çeşitli durumlarla başa çıkmak için üç farklı form arasında geçiş yapar.</gray>|<gray>Mekanik cihazlar yerleştirebilir.</gray>"
  狐灵法师: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<gray>Daha düşük hasar, ama müttefikleri güçlendirebilir.</gray>"
  蛇影刺客: "<red>Yakın dövüş büyü DPS, patlama hasarı.</red>|<gray>Devasa hasar için kombolara dayanır.</red>"
  鹿灵祭司: "<red>Düşmanlara savunmasızlık uygulayabilir.</red>|<green>Savunmasız hedeflere saldıran müttefikler büyücüyü iyileştirir.</green>"
  虎威战士: "<green>Sağlık azaldıkça direnç ve sağlık rejenerasyonu artar.</green>|<gray>Kısa sürede alınan hasarı depolayarak patlama kalkanı ile takas eder.</gray>"
  灵魂行者: "<green>Geniş alan iyileştirme veya kalabalık kontrol.</green>|<gray>Daha düşük tek hedef iyileştirme, ama müttefiklerle sağlık paylaşır.</gray>"
  骑士: "<red>Yakın dövüş <gray>fiziksel</gray> DPS.</red>|<green>Kısa bekleme süresi olan dokunulmazlık yeteneği.</green>|<green>Etkileyici iyileştirme yeteneği.</green>"
  牧师: "<green>İyileştirme, hedefin eksik sağlığı ile artar.</green>|<green>Kritik iyileştirmeler ek faydalar sağlar.</green>"
  神谕者: "<red>Yakın dövüş büyü DPS.</red>|<gray>Bazı yetenekler hem müttefikleri hem düşmanları etkiler.</gray>|<gray>Bir hedefin hasarını ve aldığı hasarı aynı anda artırabilir, kalkan ve savunmasızlık verir.</gray>"
  战地统帅: "<red>Yakın dövüş <gray>fiziksel</gray> DPS, patlama hasarı.</red>|<gray>Yakındaki müttefikler yetenek kullandığında bir yığın kazanır.</gray>|<gray>Bu kaynağı hasar veya müttefik iyileştirme için kullanır.</gray>|<green>Alan hasar azaltma aurasına sahiptir.</green>"
  影舞者: "<red>Yakın dövüş <gray>fiziksel</gray> DPS.</red>|<red>Hedefin arkasından saldırmak ekstra hasar verir.</red>|<red>İnfaz yeteneğine sahiptir.</red>"
  暗影术士: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<red>Düşmanlara hasar vermek işaret bırakır.</red>|<red>Yeteneklerle işaretleri patlatmak AoE hasar verir ve işaretleri yayar.</red>"
  冰霜战士: "<red>Daha fazla sağlık daha fazla hasar demektir.</red>|<gray>Yetenekler düşmanları dondurabilir.</gray>|<red>Dondurulmuş hedeflere bonus hasar verir.</red>"
  暗影守卫: "<green>Pasif hasar azaltma, yakındaki düşmanlar arttıkça artar.</green>|<green>Yakındaki düşmanları çeker ve kendini iyileştirir.</green>|<green>Hasarı emer ve zamanla sağlığa dönüştürür.</green>|<green>Müttefikleri geçici olarak dokunulmaz yapabilir.</green>"
  末日预言者: "<green>Müttefiklere Kıyamet Duası uyguladıktan sonra, düşmanlara hasar vermek müttefikleri iyileştirir.</green>|<gray>Geniş alan kalabalık kontrol yapabilir.</gray>|<green>Ölümün eşiğindeyken kendi sağlığını geri yükler.</green>"
  死灵收割者: "<red>Yakın dövüş <gray>fiziksel</gray> ve <blue>büyü</blue> hasarı.</red>|<gray>Hasar verdiğinde veya yakındaki düşmanlar öldüğünde geçici Kalıntılar kazanır.</gray>|<gray>Güçlü hasar yeteneklerini serbest bırakmak için Kalıntıları tüketir.</gray>"
  女巫: "<red>Uzaktan <blue>büyü</blue> DPS, uzun aralıklı DEBUFF hasarı, AoE hasarı.</red>|<green>Uzun bekleme süreli alan iyileştirmesi.</green>|<green>Kendine ve müttefiklere devasa hasara bağışıklık verebilir.</green>"
  沸血战士: "<red>Aktif yetenek sürekli kendi sağlığını güçlendirmeler için tüketir.</red>|<red>Aktifleştirmeden sonra, saniyede Kan Susuzluğu efekti kazanır, alınan hasarı artırır.</red>|<gray>Bu kaynağı ek güçlendirmeler için serbest bırakabilir.</gray>|<red>%50 sağlık altında, Yarma ve diğer ek güçlendirmeler kazanır.</red>"
  雷电督军: "<red>Uzaktan <blue>büyü</blue> DPS, stabil hasar.</red>|<gray>Güçlü kalabalık kontrol yetenekleri vardır.</gray>|<red>Bazı hasar kalkanlara ekstra hasar verir.</red>|<red>Yeteneklerin çoğu rastgele yakındaki başka bir düşmana seker.</red>"
  平衡术士: "<red>Uzaktan <gray>fiziksel</gray>/<blue>büyü</blue> DPS.</red>|<gray>Yetenekler birkaç türe ayrılır.</gray>|<red>Öncekiyle farklı türde bir yetenek kullanmak bonus hasar verir.</red>"
  深渊吞噬者: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<gray>Yetenekler kendine DEBUFF uygulayabilir; aktif serbest bırakarak bu DEBUFF'ları yakındaki düşmanlara uygulayabilir ve kendini iyileştirebilir.</gray>|<green>Ölümün eşiğindeyken yakındaki düşmanları yutar ve <dark_green><bold>sağlık</bold></dark_green> geri yükler.</green>"
  混沌使者: "<red>Yakın dövüş <blue>büyü</blue> DPS, daha düşük hasar.</red>|<gray>Yetenekler düşmanlara rastgele DEBUFF uygulayabilir ve saldırı güçlerini azaltabilir.</gray>|<gray>Kalabalık kontrol altındayken, bunu yakındaki düşmanlara aktarabilir.</gray>"
  时空旅行家: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<green>Müttefiklerin sağlığını kaydedip geri sarabilir, rastgele değerli kalkanlar ve hasar azaltma verir.</green>|<red>Düşmanlara artan hasar ve yavaşlama uygular.</red>|<gray>Kendi iyileştirmesini ve hasarını rastgele artırır veya azaltır.</gray>"
  幻影灵魂: "<red>Uzaktan <blue>büyü</blue> DPS.</red>|<gray>Düşmanlara saldırmak veya müttefikleri iyileştirmek üzerlerinde işaretler biriktirir.</gray>|<gray>İşaretleri patlatmak rastgele iyileştirme/hasar/kontrol/hasar güçlendirme sağlar.</gray>"
  梦魇咒术师: "<gray>Hasar/iyileştirme/tanklık ve tüm işlevler için farklı yetenek kombinasyonları kullanır.</gray>"
