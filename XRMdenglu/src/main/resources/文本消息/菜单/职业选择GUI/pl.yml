职业描述:
  奥能法师: "<red>DPS <blue>magiczny</blue> dystansowy, stabilne obrażenia.</red>|<gray>Posiada zdolności kontroli tłumu.</gray>"
  战斗法师: "<red>DPS <blue>magiczny</blue> dystansowy, DPS <gray>fizyczny</gray> wręcz, obrażenia burst.</red>|<gray>Gromadzi zasoby do obrażeń burst.</gray>"
  符文法师: "<red>DPS <blue>magiczny</blue> wręcz.</red>|<gray>Specjalizuje się w odporności na obrażenia <blue>magiczne</blue>. Używa umiejętności do masowej redukcji obrażeń lub obrażeń burst.</gray>"
  大魔导师: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<gray>Po rzuceniu różnych umiejętności wzmacniających, wystrzeliwuje <blue>magiczne</blue> pociski o różnorodnych efektach.</gray>"
  德鲁伊: "<red>DPS <gray>fizyczny</gray> wręcz, DPS <blue>magiczny</blue> dystansowy.</red>|<green>Ciągłe leczenie.</green>"
  精灵卫士: "<red>DPS <blue>magiczny</blue> dystansowy. Wszystkie obrażenia to AoE krótkiego zasięgu.</red>|<gray>Niskie obrażenia osobiste, ale może repositionować siebie i sojuszników.</gray>|<gray>Może gromadzić Odłamki Gwiazd dla obrażeń lub redukcji obrażeń sojuszników.</gray>"
  树人守卫: "<gray>Kanalizuje dla masowej redukcji obrażeń, ale spowalnia się.</gray>|<red>Silne obrażenia z umiejętności i redukcja obrażeń.</red>|<green>Imponujące samoleczenie.</green>"
  荆棘领主: "<green>Silne kradzież życia.</green>|<red>Przywołuje ciernie w obszarze, zadając obrażenia wrogom i nakładając podatność.</red>"
  枪炮师: "<red>DPS <gray>fizyczny</gray> dystansowy.</red>|<red>Stanie w miejscu zwiększa szansę na cios krytyczny.</red>|<red>Zadaje dodatkowe obrażenia celom z dużą ilością zdrowia.</red>"
  机械师: "<red>DPS <gray>fizyczny</gray> wręcz, stabilne obrażenia.</red>|<gray>Ataki nakładają krwawienie na wrogów.</gray>|<gray>Silne zdolności samoobrony.</gray>"
  修补匠: "<gray>Przełączaj się między trzema różnymi formami, aby radzić sobie z różnymi sytuacjami.</gray>|<gray>Może rozmieszczać urządzenia mechaniczne.</gray>"
  狐灵法师: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<gray>Niższe obrażenia, ale może wzmacniać sojuszników.</gray>"
  蛇影刺客: "<red>DPS zaklęć wręcz, obrażenia burst.</red>|<red>Polega na kombinacjach dla masowych obrażeń.</red>"
  鹿灵祭司: "<red>Może nakładać podatność na wrogów.</red>|<green>Sojusznicy atakujący podatne cele leczą rzucającego.</green>"
  虎威战士: "<green>Odporność i regeneracja zdrowia rosną wraz ze spadkiem zdrowia.</green>|<gray>Magazynuje otrzymane obrażenia przez krótki czas, aby wymienić na tarczę burst.</gray>"
  灵魂行者: "<green>Leczenie obszarowe lub kontrola tłumu.</green>|<green>Niższe leczenie pojedynczego celu, ale dzieli się zdrowiem z sojusznikami.</green>"
  骑士: "<red>DPS <gray>fizyczny</gray> wręcz.</red>|<green>Umiejętność niezniszczalności z krótkim odnowieniem.</green>|<green>Imponująca zdolność leczenia.</green>"
  牧师: "<green>Leczenie rośnie wraz z brakującym zdrowiem celu.</green>|<green>Krytyczne leczenie zapewnia dodatkowe korzyści.</green>"
  神谕者: "<red>DPS zaklęć wręcz.</red>|<gray>Niektóre umiejętności wpływają na sojuszników i wrogów.</gray>|<gray>Może jednocześnie zwiększyć obrażenia i otrzymywane obrażenia celu, przyznając tarcze i podatność.</gray>"
  战地统帅: "<red>DPS <gray>fizyczny</gray> wręcz, obrażenia burst.</red>|<gray>Zyskuje stos za każdym razem, gdy pobliski sojusznik rzuca umiejętność.</gray>|<gray>Używa tego zasobu do obrażeń lub leczenia sojuszników.</gray>|<green>Posiada aurę redukcji obrażeń obszarowych.</green>"
  影舞者: "<red>DPS <gray>fizyczny</gray> wręcz.</red>|<gray>Atakowanie od tyłu celu zadaje dodatkowe obrażenia.</gray>|<red>Posiada umiejętność egzekucji.</red>"
  暗影术士: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<gray>Zadawanie obrażeń wrogom zostawia znaki.</red>|<red>Detonowanie znaków przez umiejętności powoduje obrażenia AoE i rozprzestrzenia znaki.</red>"
  冰霜战士: "<red>Więcej zdrowia oznacza więcej obrażeń.</red>|<gray>Umiejętności mogą zamrażać wrogów.</gray>|<red>Zadaje bonusowe obrażenia zamrożonym celom.</red>"
  暗影守卫: "<green>Pasywna redukcja obrażeń rośnie z większą liczbą pobliskich wrogów.</green>|<green>Przyciąga pobliskich wrogów i leczy się.</green>|<green>Absorbuje obrażenia i zamienia je w zdrowie w czasie.</green>|<green>Może tymczasowo uczynić sojuszników niezniszczalnymi.</green>"
  末日预言者: "<green>Po nałożeniu Modlitwy Zagłady na sojuszników, zadawanie obrażeń wrogom leczy sojuszników.</green>|<gray>Może rzucać kontrolę tłumu na dużym obszarze.</gray>|<green>W obliczu śmierci, przywraca własne zdrowie.</green>"
  死灵收割者: "<red>Obrażenia <gray>fizyczne</gray> i <blue>magiczne</blue> wręcz.</red>|<gray>Zyskuje tymczasowe Resztki zadając obrażenia lub gdy pobliscy wrogowie giną.</gray>|<gray>Konsumuje Resztki, by uwolnić potężne umiejętności obrażeń.</gray>"
  女巫: "<red>DPS <blue>magiczny</blue> dystansowy, obrażenia DEBUFF o długich odstępach, obrażenia AoE.</red>|<green>Leczenie obszarowe o długim odnowieniu.</green>|<green>Może przyznać sobie i sojusznikom odporność na masowe obrażenia.</green>"
  沸血战士: "<red>Aktywna umiejętność stale zużywa własne zdrowie dla wzmocnień.</red>|<red>Po aktywacji, zyskuje efekt Pragnienia Krwi co sekundę, zwiększając otrzymywane obrażenia.</red>|<gray>Może uwolnić ten zasób dla dodatkowych wzmocnień.</gray>|<red>Poniżej 50% zdrowia, zyskuje Rąbanie i inne dodatkowe wzmocnienia.</red>"
  雷电督军: "<red>DPS <blue>magiczny</blue> dystansowy, stabilne obrażenia.</red>|<gray>Posiada potężne umiejętności kontroli.</gray>|<red>Niektóre obrażenia zadają dodatkowo tarczom.</red>|<red>Większość umiejętności odbija się losowo do innego pobliskiego wroga.</red>"
  平衡术士: "<red>DPS <gray>fizyczny</gray>/<blue>magiczny</blue> dystansowy.</red>|<gray>Umiejętności są podzielone na kilka typów.</gray>|<red>Użycie umiejętności innego typu niż poprzednia zadaje bonusowe obrażenia.</red>"
  深渊吞噬者: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<gray>Umiejętności mogą nakładać DEBUFFy na siebie; aktywne uwolnienie nakłada te DEBUFFy na pobliskich wrogów i leczy się.</gray>|<green>W obliczu śmierci, pożera pobliskich wrogów i przywraca <dark_green><bold>zdrowie</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>magiczny</blue> wręcz, niższe obrażenia.</red>|<gray>Umiejętności mogą nakładać losowe DEBUFFy na wrogów i zmniejszać ich siłę ataku.</gray>|<gray>Gdy pod wpływem kontroli tłumu, może ją przenieść na pobliskich wrogów.</gray>"
  时空旅行家: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<green>Może nagrywać i cofać zdrowie sojuszników, przyznając tarcze o losowych wartościach i redukcję obrażeń.</green>|<red>Nakłada rosnące obrażenia i spowolnienie na wrogów.</red>|<gray>Losowo zwiększa lub zmniejsza własne leczenie i obrażenia.</gray>"
  幻影灵魂: "<red>DPS <blue>magiczny</blue> dystansowy.</red>|<gray>Atakowanie wrogów lub leczenie sojuszników kumuluje na nich znaki.</gray>|<gray>Detonowanie znaków losowo powoduje leczenie/obrażenia/kontrolę/zwiększenie obrażeń.</gray>"
  梦魇咒术师: "<gray>Używa różnych kombinacji umiejętności do obrażeń/leczenia/tankowania i wszystkich funkcji.</gray>"
