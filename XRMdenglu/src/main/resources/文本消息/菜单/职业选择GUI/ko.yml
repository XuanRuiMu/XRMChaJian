职业描述:
  奥能法师: "<red>원거리 <blue>마법</blue> DPS, 안정적인 딜.</red>|<gray>군중 제어 기술 보유.</gray>"
  战斗法师: "<red>원거리 <blue>마법</blue> DPS, 근접 <gray>물리</gray> DPS, 폭딜.</red>|<gray>자원을 모아 폭딜.</gray>"
  符文法师: "<red>근접 <blue>마법</blue> DPS.</red>|<gray><blue>마법</blue> 피해 저항에 특화. 스킬로 대량 피해 감소 또는 대량 딜.</gray>"
  大魔导师: "<red>원거리 <blue>마법</blue> DPS.</red>|<gray>다양한 강화 스킬 시전 후, 효과가 다른 <blue>마법</blue> 투사체 발사.</gray>"
  德鲁伊: "<red>근접 <gray>물리</gray> DPS, 원거리 <blue>마법</blue> DPS.</red>|<green>지속 힐.</green>"
  精灵卫士: "<red>원거리 <blue>마법</blue> DPS. 모든 피해가 근거리 AoE.</red>|<gray>개인 화력은 낮지만, 자신과 아군의 위치 조정 가능.</gray>|<gray>별조각을 모아 피해 또는 아군 피해 감소에 사용.</gray>"
  树人守卫: "<gray>정신집중으로 대량 피해 감소 획득, but 자신 감속.</gray>|<red>강력한 스킬 피해와 피해 감소.</red>|<green>뛰어난 자가 회복.</green>"
  荆棘领主: "<green>강력한 생명력 흡수.</green>|<red>범위에 가시를 소환하여 적에게 피해와 취약 부여.</red>"
  枪炮师: "<red>원거리 <gray>물리</gray> DPS.</red>|<red>제자리에 서 있으면 치명타 확률 증가.</red>|<red>체력이 높은 대상에게 추가 피해.</red>"
  机械师: "<red>근접 <gray>물리</gray> DPS, 안정적 딜.</red>|<red>공격 시 적에게 출혈 부여.</red>|<gray>강력한 자기 보존 능력.</gray>"
  修补匠: "<gray>세 가지 다른 형태로 전환하여 다양한 상황 대처.</gray>|<gray>기계 장치 배치 가능.</gray>"
  狐灵法师: "<red>원거리 <blue>마법</blue> DPS.</red>|<gray>화력은 낮지만 아군 버프 가능.</gray>"
  蛇影刺客: "<red>근접 주술 DPS, 폭딜.</red>|<gray>콤보로 대량 피해.</gray>"
  鹿灵祭司: "<red>적에게 취약 부여 가능.</red>|<green>아군이 취약 대상 공격 시 시전자 회복.</green>"
  虎威战士: "<green>체력이 감소할수록 저항과 체력 재생 증가.</green>|<gray>짧은 시간 동안 받은 피해를 저장해 폭딜 방패로 교환.</gray>"
  灵魂行者: "<green>광역 힐 또는 군중 제어.</green>|<green>단일 힐은 낮지만 아군과 체력 공유.</green>"
  骑士: "<red>근접 <gray>물리</gray> DPS.</red>|<green>짧은 쿨다운 무적 스킬.</green>|<green>뛰어난 회복력.</green>"
  牧师: "<green>대상의 잃은 체력에 비례하여 힐량 증가.</green>|<green>치명타 힐이 추가 효과 부여.</green>"
  神谕者: "<red>근접 주술 DPS.</red>|<gray>일부 스킬은 아군과 적 모두에게 영향.</gray>|<gray>대상의 피해와 받는 피해를 동시에 증가시키며, 방패와 취약 부여.</gray>"
  战地统帅: "<red>근접 <gray>물리</gray> DPS, 폭딜.</red>|<gray>근처 아군이 스킬 사용 시 스택 획득.</gray>|<gray>이 자원을 피해 또는 아군 힐에 사용.</gray>|<green>범위 피해 감소 오라 보유.</green>"
  影舞者: "<red>근접 <gray>물리</gray> DPS.</red>|<red>대상 뒤에서 공격 시 추가 피해.</red>|<red>처형 스킬 보유.</red>"
  暗影术士: "<red>원거리 <blue>마법</blue> DPS.</red>|<red>적에게 피해 시 표식 남김.</red>|<red>스킬로 표식 폭발 시 AoE 피해 및 표식 전파.</red>"
  冰霜战士: "<red>체력이 많을수록 피해 증가.</red>|<gray>스킬로 적 빙결 가능.</gray>|<red>빙결 대상에게 보너스 피해.</red>"
  暗影守卫: "<green>근처 적이 많을수록 패시브 피해 감소 증가.</green>|<green>근처 적을 끌어당기고 자가 회복.</green>|<green>피해를 흡수하여 시간당 체력으로 변환.</green>|<green>아군을 일시적으로 무적으로 만들 수 있음.</green>"
  末日预言者: "<green>아군에게 파멸 기도 부여 후, 적에게 피해 시 아군 회복.</green>|<gray>광역 군중 제어 시전 가능.</gray>|<green>빈사 시 자신의 체력 회복.</green>"
  死灵收割者: "<red>근접 <gray>물리</gray> 및 <blue>마법</blue> 피해.</red>|<gray>피해 시 또는 근처 적 사망 시 일시적 잔재 획득.</gray>|<gray>잔재를 소비하여 강력한 피해 스킬 발동.</gray>"
  女巫: "<red>원거리 <blue>마법</blue> DPS, 긴 간격 DEBUFF 피해, AoE 피해.</red>|<green>긴 쿨다운 광역 힐.</green>|<green>자신과 아군에게 대량 피해 면역 부여 가능.</green>"
  沸血战士: "<red>액티브 스킬이 자신의 체력을 지속 소모하여 버프 획득.</red>|<red>발동 후 매초 피의 갈증 효과 획득, 받는 피해 증가.</red>|<gray>이 자원을 해방하여 추가 버프 획득.</gray>|<red>체력 50% 이하에서 범위 공격 및 추가 버프 획득.</red>"
  雷电督军: "<red>원거리 <blue>마법</blue> DPS, 안정적 딜.</red>|<gray>강력한 군중 제어 스킬 보유.</gray>|<red>일부 피해는 방패에 추가 피해.</red>|<red>대부분의 스킬이 무작위로 근처 다른 적에게 튕김.</red>"
  平衡术士: "<red>원거리 <gray>물리</gray>/<blue>마법</blue> DPS.</red>|<gray>스킬이 여러 유형으로 나뉨.</gray>|<red>이전과 다른 유형의 스킬 사용 시 보너스 피해.</red>"
  深渊吞噬者: "<red>원거리 <blue>마법</blue> DPS.</red>|<gray>스킬로 자신에게 DEBUFF 부여 가능; 능동 해방 시 근처 적에게 DEBUFF 부여 및 자가 회복.</gray>|<green>빈사 시 근처 적을 삼키고 <dark_green><bold>체력</bold></dark_green> 회복.</green>"
  混沌使者: "<red>근접 <blue>마법</blue> DPS, 낮은 피해.</red>|<gray>스킬로 적에게 무작위 DEBUFF 부여 및 공격력 감소.</gray>|<gray>군중 제어 받을 시 근처 적에게 전이 가능.</gray>"
  时空旅行家: "<red>원거리 <blue>마법</blue> DPS.</red>|<green>아군 체력 기록 및 되감기, 무작위 값 방패와 피해 감소 부여.</green>|<red>적에게 점증 피해와 감속 부여.</red>|<gray>자신의 힐과 피해를 무작위로 증감.</gray>"
  幻影灵魂: "<red>원거리 <blue>마법</blue> DPS.</red>|<gray>적 공격 또는 아군 힐 시 표식 중첩.</gray>|<gray>표식 폭발 시 무작위로 힐/피해/군중제어/피해증가.</gray>"
  梦魇咒术师: "<gray>다양한 스킬 조합으로 피해/힐/탱킹의 모든 기능 발휘.</gray>"
