职业描述:
  奥能法师: "<red>DPS <blue>sihir</blue> jarak jauh, kerosakan stabil.</red>|<gray>Memiliki keupayaan kawalan ramai.</gray>"
  战斗法师: "<red>DPS <blue>sihir</blue> jarak jauh, DPS <gray>fizikal</gray> jarak dekat, kerosakan pecut.</red>|<gray>Mengumpul sumber untuk kerosakan pecut.</gray>"
  符文法师: "<red>DPS <blue>sihir</blue> jarak dekat.</red>|<gray>Mahir menahan kerosakan <blue>sihir</blue>. Menggunakan kemahiran untuk pengurangan kerosakan besar atau kerosakan pecut.</gray>"
  大魔导师: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Selepas melancarkan kemahiran pengukuhan berbeza, melepaskan projektil <blue>sihir</blue> dengan pelbagai kesan.</gray>"
  德鲁伊: "<red>DPS <gray>fizikal</gray> jarak dekat, DPS <blue>sihir</blue> jarak jauh.</red>|<green>Penyembuhan berterusan.</green>"
  精灵卫士: "<red>DPS <blue>sihir</blue> jarak jauh. Semua kerosakan adalah AoE jarak dekat.</red>|<gray>Kerosakan peribadi rendah, tetapi boleh memposisikan semula diri dan sekutu.</gray>|<gray>Boleh mengumpul Serpihan Bintang untuk kerosakan atau pengurangan kerosakan sekutu.</gray>"
  树人守卫: "<gray>Menyalurkan untuk pengurangan kerosakan besar, tetapi melambatkan diri.</gray>|<red>Kerosakan kemahiran dan pengurangan kerosakan yang kuat.</red>|<green>Penyembuhan diri yang mengagumkan.</green>"
  荆棘领主: "<green>Curi nyawa yang kuat.</green>|<red>Memanggil duri di kawasan, merosakkan musuh dan mengenakan kerentanan.</red>"
  枪炮师: "<red>DPS <gray>fizikal</gray> jarak jauh.</red>|<red>Berdiri diam meningkatkan peluang serangan kritikal.</red>|<red>Memberi kerosakan tambahan kepada sasaran dengan kesihatan tinggi.</red>"
  机械师: "<red>DPS <gray>fizikal</gray> jarak dekat, kerosakan stabil.</red>|<red>Serangan mengenakan pendarahan kepada musuh.</red>|<gray>Keupayaan pemeliharaan diri yang kuat.</gray>"
  修补匠: "<gray>Bertukar antara tiga bentuk berbeza untuk mengendalikan pelbagai situasi.</gray>|<gray>Boleh melancarkan peranti mekanikal.</gray>"
  狐灵法师: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Kerosakan lebih rendah, tetapi boleh mengukuhkan sekutu.</gray>"
  蛇影刺客: "<red>DPS mantera jarak dekat, kerosakan pecut.</red>|<gray>Bergantung pada combo untuk kerosakan besar.</gray>"
  鹿灵祭司: "<red>Boleh mengenakan kerentanan kepada musuh.</red>|<green>Sekutu menyerang sasaran rentan menyembuhkan pelancar.</green>"
  虎威战士: "<green>Rintangan dan penjanaan semula kesihatan meningkat apabila kesihatan berkurangan.</green>|<gray>Menyimpan kerosakan yang diterima dalam tempoh singkat untuk ditukar dengan perisai pecut.</gray>"
  灵魂行者: "<green>Penyembuhan kawasan luas atau kawalan ramai.</green>|<green>Penyembuhan sasaran tunggal lebih rendah, tetapi berkongsi kesihatan dengan sekutu.</green>"
  骑士: "<red>DPS <gray>fizikal</gray> jarak dekat.</red>|<green>Kemahiran kebalahan dengan masa sejuk pendek.</green>|<green>Keupayaan penyembuhan yang mengagumkan.</green>"
  牧师: "<green>Penyembuhan meningkat dengan kesihatan hilang sasaran.</green>|<green>Penyembuhan kritikal memberikan manfaat tambahan.</green>"
  神谕者: "<red>DPS mantera jarak dekat.</red>|<gray>Beberapa kemahiran mempengaruhi sekutu dan musuh.</gray>|<gray>Boleh meningkatkan kerosakan dan kerosakan diterima sasaran serentak, sambil memberikan perisai dan kerentanan.</gray>"
  战地统帅: "<red>DPS <gray>fizikal</gray> jarak dekat, kerosakan pecut.</red>|<gray>Mendapat tindanan setiap kali sekutu berdekatan melancarkan kemahiran.</gray>|<gray>Menggunakan sumber ini untuk kerosakan atau penyembuhan sekutu.</gray>|<green>Memiliki aura pengurangan kerosakan kawasan.</green>"
  影舞者: "<red>DPS <gray>fizikal</gray> jarak dekat.</red>|<red>Menyerang dari belakang sasaran memberi kerosakan tambahan.</red>|<red>Memiliki keupayaan pelaksanaan.</red>"
  暗影术士: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<red>Memberi kerosakan kepada musuh meninggalkan tanda.</red>|<red>Meletupkan tanda melalui kemahiran menyebabkan kerosakan AoE dan menyebarkan tanda.</red>"
  冰霜战士: "<red>Kesihatan lebih tinggi bermakna kerosakan lebih tinggi.</red>|<gray>Kemahiran boleh membekukan musuh.</gray>|<red>Memberi kerosakan bonus kepada sasaran beku.</red>"
  暗影守卫: "<green>Pengurangan kerosakan pasif meningkat dengan lebih banyak musuh berdekatan.</green>|<green>Menarik musuh berdekatan dan menyembuhkan diri.</green>|<green>Menyerap kerosakan dan menukarnya kepada kesihatan dari masa ke masa.</green>|<green>Boleh menjadikan sekutu sementara kebal.</green>"
  末日预言者: "<green>Selepas mengenakan Doa Kiamat kepada sekutu, merosakkan musuh menyembuhkan sekutu.</green>|<gray>Boleh melancarkan kawalan ramai kawasan luas.</gray>|<green>Hampir mati, memulihkan kesihatan sendiri.</green>"
  死灵收割者: "<red>Kerosakan <gray>fizikal</gray> dan <blue>sihir</blue> jarak dekat.</red>|<gray>Mendapat Sisaan sementara apabila memberi kerosakan atau apabila musuh berdekatan mati.</gray>|<gray>Menggunakan Sisaan untuk melepaskan kemahiran kuat untuk kerosakan.</gray>"
  女巫: "<red>DPS <blue>sihir</blue> jarak jauh, kerosakan DEBUFF selang panjang, kerosakan AoE.</red>|<green>Penyembuhan kawasan masa sejuk tinggi.</green>|<green>Boleh memberikan kekebalan terhadap kerosakan besar kepada diri dan sekutu.</green>"
  沸血战士: "<red>Kemahiran aktif sentiasa menggunakan kesihatan sendiri untuk pengukuhan.</red>|<red>Selepas pengaktifan, mendapat kesan Dahaga Darah sesaat, meningkatkan kerosakan diterima.</red>|<gray>Boleh melepaskan sumber ini untuk pengukuhan tambahan.</gray>|<red>Di bawah 50% kesihatan, mendapat Belah dan pengukuhan tambahan lain.</red>"
  雷电督军: "<red>DPS <blue>sihir</blue> jarak jauh, kerosakan stabil.</red>|<gray>Memiliki kemahiran kawalan yang kuat.</gray>|<red>Sebahagian kerosakan memberi tambahan kepada perisai.</red>|<red>Kebanyakan kemahiran melantun secara rawak ke musuh berdekatan lain.</red>"
  平衡术士: "<red>DPS <gray>fizikal</gray>/<blue>sihir</blue> jarak jauh.</red>|<gray>Kemahiran dibahagikan kepada beberapa jenis.</gray>|<red>Menggunakan kemahiran jenis berbeza dari sebelumnya memberi kerosakan bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Kemahiran boleh mengenakan DEBUFF pada diri sendiri; lepaskan secara aktif untuk mengenakan DEBUFF ini pada musuh berdekatan dan menyembuhkan diri.</gray>|<green>Hampir mati, menelan musuh berdekatan dan memulihkan <dark_green><bold>kesihatan</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>sihir</blue> jarak dekat, kerosakan lebih rendah.</red>|<gray>Kemahiran boleh mengenakan DEBUFF rawak pada musuh dan mengurangkan kuasa serangan mereka.</gray>|<gray>Apabila terjejas oleh kawalan, boleh memindahkannya kepada musuh berdekatan.</gray>"
  时空旅行家: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<green>Boleh merakam dan memundurkan kesihatan sekutu, memberikan perisai nilai rawak dan pengurangan kerosakan.</green>|<red>Mengenakan kerosakan meningkat dan perlambatan kepada musuh.</red>|<gray>Secara rawak meningkatkan atau mengurangkan penyembuhan dan kerosakan sendiri.</gray>"
  幻影灵魂: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Menyerang musuh atau menyembuhkan sekutu menimbunkan tanda pada mereka.</gray>|<gray>Meletupkan tanda secara rawak menyebabkan penyembuhan/kerosakan/kawalan/penguatan kerosakan.</gray>"
  梦魇咒术师: "<gray>Menggunakan kombinasi kemahiran berbeza untuk kerosakan/penyembuhan/tanking dan semua fungsi.</gray>"
