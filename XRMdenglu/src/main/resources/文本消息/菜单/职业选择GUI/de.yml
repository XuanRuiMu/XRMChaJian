职业描述:
  奥能法师: "<red>Fernkampf <blue>Magie</blue> DPS, stetiger Schaden.</red>|<gray>Besitzt einige Kontrollfähigkeiten.</gray>"
  战斗法师: "<red>Fernkampf <blue>Magie</blue> DPS, Nahkampf <gray>physisch</gray> DPS, Burst-Schaden.</red>|<gray>Ressourcen für Burst-Schaden aufbauen.</gray>"
  符文法师: "<red>Nahkampf <blue>Magie</blue> DPS.</red>|<gray>Spezialisiert auf <blue>Magie</blue>schadenswiderstand. Nutzt Fähigkeiten für massiven Schadensreduktion oder -ausstoß.</gray>"
  大魔导师: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<gray>Nach dem Wirken verschiedener Verstärkungsfähigkeiten werden <blue>Magie</blue>geschosse mit unterschiedlichen Effekten freigesetzt.</gray>"
  德鲁伊: "<red>Nahkampf <gray>physisch</gray> DPS, Fernkampf <blue>Magie</blue> DPS.</red>|<green>Anhaltende Heilung.</green>"
  精灵卫士: "<red>Fernkampf <blue>Magie</blue> DPS. Jeglicher Schaden ist Flächenschaden in kleinem Bereich.</red>|<gray>Geringer Eigenschaden, kann sich und Verbündete umpositionieren.</gray>|<gray>Kann Sternensplitter für Schaden oder Schadensreduktion bei Verbündeten sammeln.</gray>"
  树人守卫: "<gray>Kanalisieren für massive Schadensreduktion, aber selbst verlangsamt.</gray>|<red>Starker Fähigkeitsschaden und Schadensreduktion.</red>|<green>Beeindruckende Selbstheilung.</green>"
  荆棘领主: "<green>Starkes Lebensrauben.</green>|<red>Beschwört Dornen in einem Bereich, fügt Feinden Schaden zu und schwächt sie.</red>"
  枪炮师: "<red>Fernkampf <gray>physisch</gray> DPS.</red>|<red>Stehenbleiben erhöht die kritische Trefferchance.</red>|<red>Verursacht Extraschaden bei Zielen mit viel Gesundheit.</red>"
  机械师: "<red>Nahkampf <gray>physisch</gray> DPS, stetiger Schaden.</red>|<red>Angriffe verursachen Bluten bei Feinden.</red>|<gray>Starke Selbsterhaltungsfähigkeiten.</gray>"
  修补匠: "<gray>Wechsle zwischen drei verschiedenen Formen, um verschiedene Situationen zu bewältigen.</gray>|<gray>Kann mechanische Vorrichtungen einsetzen.</gray>"
  狐灵法师: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<gray>Geringerer Schaden, kann aber Verbündete verstärken.</gray>"
  蛇影刺客: "<red>Nahkampf-Zauber-DPS, Burst-Schaden.</red>|<red>Verlässt sich auf Kombos für massiven Schaden.</red>"
  鹿灵祭司: "<red>Kann Feinde schwächen.</red>|<green>Verbündete, die geschwächte Ziele angreifen, heilen den Wirker.</green>"
  虎威战士: "<green>Widerstand und Gesundheitsregeneration steigen, je weniger Gesundheit verbleibt.</green>|<gray>Speichert erlittenen Schaden über kurze Zeit, um ihn gegen einen Burst-Schild einzutauschen.</gray>"
  灵魂行者: "<green>Flächenheilung oder Kontrolle.</green>|<green>Geringere Einzelzielheilung, teilt aber Gesundheit mit Verbündeten.</green>"
  骑士: "<red>Nahkampf <gray>physisch</gray> DPS.</red>|<green>Unverwundbarkeitsfähigkeit mit kurzer Abklingzeit.</green>|<green>Beeindruckende Heilkraft.</green>"
  牧师: "<green>Heilung steigt mit fehlender Gesundheit des Ziels.</green>|<green>Kritische Heilungen gewähren zusätzliche Vorteile.</green>"
  神谕者: "<red>Nahkampf-Zauber-DPS.</red>|<gray>Einige Fähigkeiten wirken sich auf Verbündete und Feinde aus.</gray>|<gray>Kann gleichzeitig den Schaden und den erlittenen Schaden eines Ziels erhöhen, während Schild und Schwächung gewährt werden.</gray>"
  战地统帅: "<red>Nahkampf <gray>physisch</gray> DPS, Burst-Schaden.</red>|<gray>Erhält einen Stapel, wenn nahegelegene Verbündete eine Fähigkeit wirken.</gray>|<gray>Nutzt diese Ressource für Schaden oder Heilung von Verbündeten.</gray>|<green>Besitzt eine Flächen-Schadensreduktionsaura.</green>"
  影舞者: "<red>Nahkampf <gray>physisch</gray> DPS.</red>|<red>Hinter dem Ziel anzugreifen verursacht Extraschaden.</red>|<red>Besitzt Hinrichtungsfähigkeit.</red>"
  暗影术士: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<red>Schaden an Feinden hinterlässt Marken.</red>|<red>Das Zünden von Marken durch Fähigkeiten verursacht Flächenschaden und verbreitet Marken.</red>"
  冰霜战士: "<red>Mehr Gesundheit bedeutet mehr Schaden.</red>|<gray>Fähigkeiten können Feinde einfrieren.</gray>|<red>Verursacht Bonusschaden an eingefrorenen Zielen.</red>"
  暗影守卫: "<green>Passive Schadensreduktion steigt mit mehr nahegelegenen Feinden.</green>|<green>Zieht nahegelegene Feinde heran und heilt sich selbst.</green>|<green>Absorbiert Schaden und wandelt ihn über Zeit in Gesundheit um.</green>|<green>Kann Verbündete vorübergehend unverwundbar machen.</green>"
  末日预言者: "<green>Nach dem Wirken von Verdammnisgebet auf Verbündete, heilt das Zufügen von Schaden an Feinden die Verbündeten.</green>|<gray>Kann Flächenkontrolle wirken.</gray>|<green>Kurz vor dem Tod wird die eigene Gesundheit wiederhergestellt.</green>"
  死灵收割者: "<red>Nahkampf <gray>physisch</gray> und <blue>Magie</blue>schaden.</red>|<gray>Erhält vorübergehend Überreste, wenn Schaden zugefügt wird oder nahegelegene Feinde sterben.</gray>|<gray>Verbraucht Überreste, um mächtige Fähigkeiten für Schaden zu entfesseln.</gray>"
  女巫: "<red>Fernkampf <blue>Magie</blue> DPS, DEBUFF-Schaden mit langen Intervallen, Flächenschaden.</red>|<green>Flächenheilung mit langer Abklingzeit.</green>|<green>Kann sich und Verbündete Immunität gegen massiven Schaden gewähren.</green>"
  沸血战士: "<red>Aktive Fähigkeit verbraucht kontinuierlich eigene Gesundheit für Verstärkungen.</red>|<red>Nach Aktivierung wird pro Sekunde der Blutrausch-Effekt gewonnen, der erlittenen Schaden erhöht.</red>|<gray>Kann diese Ressource für zusätzliche Verstärkungen freisetzen.</gray>|<red>Unter 50% Gesundheit werden Spalten und weitere Extras gewährt.</red>"
  雷电督军: "<red>Fernkampf <blue>Magie</blue> DPS, stetiger Schaden.</red>|<gray>Besitzt mächtige Kontrollfähigkeiten.</gray>|<red>Einige Schadensarten fügen Schilden Extraschaden zu.</red>|<red>Die meisten Fähigkeiten springen zufällig zu einem weiteren nahegelegenen Feind.</red>"
  平衡术士: "<red>Fernkampf <gray>physisch</gray>/<blue>Magie</blue> DPS.</red>|<gray>Fähigkeiten sind in mehrere Typen unterteilt.</gray>|<red>Eine Fähigkeit anderen Typs als die vorherige verursacht Bonusschaden.</red>"
  深渊吞噬者: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<gray>Fähigkeiten können DEBUFFs auf sich selbst anwenden; aktiv freisetzen, um diese DEBUFFs auf nahegelegene Feinde zu übertragen und sich zu heilen.</gray>|<green>Kurz vor dem Tod verschlingt nahegelegene Feinde und stellt <dark_green><bold>Gesundheit</bold></dark_green> wieder her.</green>"
  混沌使者: "<red>Nahkampf <blue>Magie</blue> DPS, geringerer Schaden.</red>|<gray>Fähigkeiten können zufällige DEBUFFs auf Feinde anwenden und deren Angriffskraft verringern.</gray>|<gray>Wenn von Kontrolle betroffen, kann diese auf nahegelegene Feinde übertragen werden.</gray>"
  时空旅行家: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<green>Kann die Gesundheit von Verbündeten aufzeichnen und zurückspulen, Schild mit zufälligen Werten und Schadensreduktion gewähren.</green>|<red>Wendet zunehmenden Schaden und Verlangsamung auf Feinde an.</red>|<gray>Erhöht oder verringert zufällig eigene Heilung und Schaden.</gray>"
  幻影灵魂: "<red>Fernkampf <blue>Magie</blue> DPS.</red>|<gray>Angriffe auf Feinde oder Heilung von Verbündeten stapelt Marken auf ihnen.</gray>|<gray>Das Zünden von Marken verursacht zufällig Heilung/Schaden/Kontrolle/Schadensverstärkung.</gray>"
  梦魇咒术师: "<gray>Nutzt verschiedene Fähigkeitskombinationen für Schaden/Heilung/Tanken und alle Funktionen.</gray>"
