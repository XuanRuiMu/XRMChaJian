职业描述:
  奥能法师: "<red>DPS <blue>mágico</blue> à distância, dano constante.</red>|<gray>Possui habilidades de controle de grupo.</gray>"
  战斗法师: "<red>DPS <blue>mágico</blue> à distância, DPS <gray>físico</gray> corpo a corpo, dano explosivo.</red>|<gray>Acumula recursos para dano explosivo.</gray>"
  符文法师: "<red>DPS <blue>mágico</blue> corpo a corpo.</red>|<gray>Especializado em resistir a dano <blue>mágico</blue>. Usa habilidades para redução massiva de dano ou dano explosivo.</gray>"
  大魔导师: "<red>DPS <blue>mágico</blue> à distância.</red>|<gray>Após lançar diferentes habilidades de aprimoramento, libera projéteis <blue>mágicos</blue> com efeitos variados.</gray>"
  德鲁伊: "<red>DPS <gray>físico</gray> corpo a corpo, DPS <blue>mágico</blue> à distância.</red>|<green>Cura sustentada.</green>"
  精灵卫士: "<red>DPS <blue>mágico</blue> à distância. Todo dano é AoE de curto alcance.</red>|<gray>Baixo dano pessoal, mas pode reposicionar a si mesmo e aliados.</gray>|<gray>Pode acumular Fragmentos Estelares para dano ou redução de dano dos aliados.</gray>"
  树人守卫: "<gray>Canaliza para obter redução massiva de dano, mas se desacelera.</gray>|<red>Forte dano de habilidades e redução de dano.</red>|<green>Impressionante autocura.</green>"
  荆棘领主: "<green>Forte roubo de vida.</green>|<red>Invoca espinhos em uma área, causando dano aos inimigos e aplicando vulnerabilidade.</red>"
  枪炮师: "<red>DPS <gray>físico</gray> à distância.</red>|<red>Ficar parado aumenta a chance de acerto crítico.</red>|<red>Causa dano extra a alvos com muita saúde.</red>"
  机械师: "<red>DPS <gray>físico</gray> corpo a corpo, dano constante.</red>|<red>Ataques aplicam sangramento aos inimigos.</red>|<gray>Fortes habilidades de autopreservação.</gray>"
  修补匠: "<gray>Alterne entre três formas diferentes para lidar com várias situações.</gray>|<gray>Pode implantar dispositivos mecânicos.</gray>"
  狐灵法师: "<red>DPS <blue>mágico</blue> à distância.</red>|<gray>Menor dano, mas pode fortalecer aliados.</gray>"
  蛇影刺客: "<red>DPS feitiço corpo a corpo, dano explosivo.</red>|<red>Depende de combos para dano massivo.</red>"
  鹿灵祭司: "<red>Pode aplicar vulnerabilidade aos inimigos.</red>|<green>Aliados atacando alvos vulneráveis curam o conjurador.</green>"
  虎威战士: "<green>Resistência e regeneração de saúde aumentam conforme a saúde diminui.</green>|<gray>Armazena dano recebido em um curto período para trocar por um escudo explosivo.</gray>"
  灵魂行者: "<green>Cura ou controle de grupo em área ampla.</green>|<green>Menor cura de alvo único, mas compartilha saúde com aliados.</green>"
  骑士: "<red>DPS <gray>físico</gray> corpo a corpo.</red>|<green>Habilidade de invulnerabilidade com recarga curta.</green>|<green>Impressionante capacidade de cura.</green>"
  牧师: "<green>A cura aumenta conforme a saúde faltante do alvo.</green>|<green>Curas críticas concedem benefícios adicionais.</green>"
  神谕者: "<red>DPS feitiço corpo a corpo.</red>|<gray>Algumas habilidades afetam tanto aliados quanto inimigos.</gray>|<gray>Pode aumentar simultaneamente o dano e o dano recebido de um alvo, concedendo escudos e vulnerabilidade.</gray>"
  战地统帅: "<red>DPS <gray>físico</gray> corpo a corpo, dano explosivo.</red>|<gray>Ganha uma pilha cada vez que aliados próximos lançam uma habilidade.</gray>|<gray>Usa este recurso para dano ou cura de aliados.</gray>|<green>Possui uma aura de redução de dano em área.</green>"
  影舞者: "<red>DPS <gray>físico</gray> corpo a corpo.</red>|<red>Atacar por trás do alvo causa dano extra.</red>|<red>Possui habilidade de execução.</red>"
  暗影术士: "<red>DPS <blue>mágico</blue> à distância.</red>|<red>Causar dano aos inimigos deixa marcas.</red>|<red>Detonar marcas através de habilidades causa dano AoE e propaga marcas.</red>"
  冰霜战士: "<red>Mais saúde significa mais dano.</red>|<gray>Habilidades podem congelar inimigos.</gray>|<red>Causa dano bônus a alvos congelados.</red>"
  暗影守卫: "<green>Redução passiva de dano aumenta com mais inimigos próximos.</green>|<green>Atrai inimigos próximos e se cura.</green>|<green>Absorve dano e converte em saúde ao longo do tempo.</green>|<green>Pode tornar aliados temporariamente invulneráveis.</green>"
  末日预言者: "<green>Após aplicar Oração de Perdição aos aliados, causar dano aos inimigos cura os aliados.</green>|<gray>Pode lançar controle de grupo em área ampla.</gray>|<green>À beira da morte, restaura a própria saúde.</green>"
  死灵收割者: "<red>Dano <gray>físico</gray> e <blue>mágico</blue> corpo a corpo.</red>|<gray>Ganha Remanescentes temporariamente ao causar dano ou quando inimigos próximos morrem.</gray>|<gray>Consome Remanescentes para desencadear habilidades poderosas de dano.</gray>"
  女巫: "<red>DPS <blue>mágico</blue> à distância, dano DEBUFF de intervalo longo, dano AoE.</red>|<green>Cura em área de recarga alta.</green>|<green>Pode conceder a si e aos aliados imunidade contra dano massivo.</green>"
  沸血战士: "<red>Habilidade ativa consome continuamente a própria saúde por aprimoramentos.</red>|<red>Após ativação, ganha efeito de Sede de Sangue por segundo, aumentando o dano recebido.</red>|<gray>Pode liberar este recurso para aprimoramentos adicionais.</gray>|<red>Abaixo de 50% de saúde, ganha Fender e outros aprimoramentos extras.</red>"
  雷电督军: "<red>DPS <blue>mágico</blue> à distância, dano constante.</red>|<gray>Possui poderosas habilidades de controle.</gray>|<red>Parte do dano causa extra a escudos.</red>|<red>A maioria das habilidades ricocheteia aleatoriamente para outro inimigo próximo.</red>"
  平衡术士: "<red>DPS <gray>físico</gray>/<blue>mágico</blue> à distância.</red>|<gray>Habilidades são divididas em vários tipos.</gray>|<red>Usar uma habilidade de tipo diferente da anterior causa dano bônus.</red>"
  深渊吞噬者: "<red>DPS <blue>mágico</blue> à distância.</red>|<gray>Habilidades podem aplicar DEBUFFs a si mesmo; liberar ativamente para aplicar estes DEBUFFs a inimigos próximos e se curar.</gray>|<green>À beira da morte, devora inimigos próximos e restaura <dark_green><bold>saúde</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>mágico</blue> corpo a corpo, menor dano.</red>|<gray>Habilidades podem aplicar DEBUFFs aleatórios aos inimigos e reduzir seu poder de ataque.</gray>|<gray>Quando afetado por controle de grupo, pode transferi-lo para inimigos próximos.</gray>"
  时空旅行家: "<red>DPS <blue>mágico</blue> à distância.</red>|<green>Pode registrar e rebobinar a saúde dos aliados, concedendo escudos de valor aleatório e redução de dano.</green>|<red>Aplica dano crescente e lentidão aos inimigos.</red>|<gray>Aumenta ou reduz aleatoriamente a própria cura e dano.</gray>"
  幻影灵魂: "<red>DPS <blue>mágico</blue> à distância.</red>|<gray>Atacar inimigos ou curar aliados acumula marcas neles.</gray>|<gray>Detonar marcas causa aleatoriamente cura/dano/controle/amplificação de dano.</gray>"
  梦魇咒术师: "<gray>Usa diferentes combinações de habilidades para dano/cura/tanque e todas as funções.</gray>"
