职业描述:
  奥能法师: "<red>Afstand <blue>magie</blue> DPS, stabiele schade.</red>|<gray>Heeft wat menigtecontrole-vaardigheden.</gray>"
  战斗法师: "<red>Afstand <blue>magie</blue> DPS, melee <gray>fysiek</gray> DPS, burstschade.</red>|<gray>Bouw bronnen op voor burstschade.</gray>"
  符文法师: "<red>Melee <blue>magie</blue> DPS.</red>|<gray>Gespecialiseerd in <blue>magie</blue>schadeweerstand. Gebruikt vaardigheden voor massieve schadevermindering of schade.</gray>"
  大魔导师: "<red>Afstand <blue>magie</blue> DPS.</red>|<gray>Na het casten van verschillende versterkingsvaardigheden, vuurt <blue>magie</blue>projectielen af met uiteenlopende effecten.</gray>"
  德鲁伊: "<red>Melee <gray>fysiek</gray> DPS, afstand <blue>magie</blue> DPS.</red>|<green>Doorlopende genezing.</green>"
  精灵卫士: "<red>Afstand <blue>magie</blue> DPS. Alle schade is AoE op korte afstand.</red>|<gray>Lage persoonlijke schade, maar kan zichzelf en bondgenoten herpositioneren.</gray>|<gray>Kan Sterrenscherven verzamelen voor schade of schadevermindering van bondgenoten.</gray>"
  树人守卫: "<gray>Kanaliseren voor massieve schadevermindering, maar zelf vertraagd.</gray>|<red>Sterke vaardighedenschade en schadevermindering.</red>|<green>Indrukwekkende zelfgenezing.</green>"
  荆棘领主: "<green>Sterke levensdiefstal.</green>|<red>Roept doornen op in een gebied, beschadigt vijanden en brengt kwetsbaarheid aan.</red>"
  枪炮师: "<red>Afstand <gray>fysiek</gray> DPS.</red>|<red>Stilstaan verhoogt kritieke trefferkans.</red>|<red>Extra schade aan doelen met veel gezondheid.</red>"
  机械师: "<red>Melee <gray>fysiek</gray> DPS, stabiele schade.</red>|<red>Aanvallen brengen bloedingen toe aan vijanden.</red>|<gray>Sterke zelfbehoudvaardigheden.</gray>"
  修补匠: "<gray>Schakel tussen drie verschillende vormen om diverse situaties aan te pakken.</gray>|<gray>Kan mechanische apparaten inzetten.</gray>"
  狐灵法师: "<red>Afstand <blue>magie</blue> DPS.</red>|<gray>Lagere schade, maar kan bondgenoten versterken.</gray>"
  蛇影刺客: "<red>Melee spreuk DPS, burstschade.</red>|<gray>Leunt op combo's voor massieve schade.</gray>"
  鹿灵祭司: "<red>Kan kwetsbaarheid toebrengen aan vijanden.</red>|<green>Bondgenoten die kwetsbare doelen aanvallen genezen de caster.</green>"
  虎威战士: "<green>Weerstand en gezondheidsregeneratie nemen toe naarmate gezondheid afneemt.</green>|<gray>Slaat ontvangen schade over korte tijd op om te ruilen voor een burstschild.</gray>"
  灵魂行者: "<green>Grootschalige genezing of menigtecontrole.</green>|<green>Lagere enkelvoudige genezing, maar deelt gezondheid met bondgenoten.</green>"
  骑士: "<red>Melee <gray>fysiek</gray> DPS.</red>|<green>Onoverwinnelijkheidsvaardigheid met korte afkoeltijd.</green>|<green>Indrukwekkend genezingsvermogen.</green>"
  牧师: "<green>Genezing neemt toe met ontbrekende gezondheid van het doel.</green>|<green>Kritieke genezingen bieden extra voordelen.</green>"
  神谕者: "<red>Melee spreuk DPS.</red>|<gray>Sommige vaardigheden beïnvloeden zowel bondgenoten als vijanden.</gray>|<gray>Kan tegelijkertijd de schade en ontvangen schade van een doel verhogen, terwijl schilden en kwetsbaarheid worden verleend.</gray>"
  战地统帅: "<red>Melee <gray>fysiek</gray> DPS, burstschade.</red>|<gray>Krijgt een stapel telkens wanneer nabije bondgenoten een vaardigheid casten.</gray>|<gray>Gebruikt deze bron voor schade of genezing van bondgenoten.</gray>|<green>Heeft een gebiedsschadeverminderingaura.</green>"
  影舞者: "<red>Melee <gray>fysiek</gray> DPS.</red>|<red>Aanvallen van achter het doel geeft extra schade.</red>|<red>Heeft een executievaardigheid.</red>"
  暗影术士: "<red>Afstand <blue>magie</blue> DPS.</red>|<red>Schade aan vijanden achterlaat markeringen.</red>|<red>Het doen ontploffen van markeringen via vaardigheden veroorzaakt AoE-schade en verspreidt markeringen.</red>"
  冰霜战士: "<red>Meer gezondheid betekent meer schade.</red>|<gray>Vaardigheden kunnen vijanden bevriezen.</gray>|<red>Extra schade aan bevroren doelen.</red>"
  暗影守卫: "<green>Passieve schadevermindering neemt toe met meer nabije vijanden.</green>|<green>Trekt nabije vijanden aan en geneest zichzelf.</green>|<green>Absorbeert schade en zet dit in de loop der tijd om in gezondheid.</green>|<green>Kan bondgenoten tijdelijk onoverwinnelijk maken.</green>"
  末日预言者: "<green>Na het aanbrengen van Ondergangsgebed op bondgenoten, geneest het beschadigen van vijanden de bondgenoten.</green>|<gray>Kan grootschalige menigtecontrole casten.</gray>|<green>Bijna de dood, herstelt eigen gezondheid.</green>"
  死灵收割者: "<red>Melee <gray>fysiek</gray> en <blue>magie</blue>schade.</red>|<gray>Krijgt tijdelijk Restanten bij het toebrengen van schade of wanneer nabije vijanden sterven.</gray>|<gray>Verbruikt Restanten om krachtige vaardigheden voor schade los te laten.</gray>"
  女巫: "<red>Afstand <blue>magie</blue> DPS, DEBUFF-schade met lange intervallen, AoE-schade.</red>|<green>Gebiedsgenezing met lange afkoeltijd.</green>|<green>Kan zichzelf en bondgenoten immuniteit tegen massieve schade verlenen.</green>"
  沸血战士: "<red>Actieve vaardigheid verbruikt continu eigen gezondheid voor versterkingen.</red>|<red>Na activering, verkrijgt Bloeddorst-effect per seconde, wat ontvangen schade verhoogt.</red>|<gray>Kan deze bron vrijgeven voor extra versterkingen.</gray>|<red>Onder 50% gezondheid, krijgt Klief en andere extra versterkingen.</red>"
  雷电督军: "<red>Afstand <blue>magie</blue> DPS, stabiele schade.</red>|<gray>Heeft krachtige menigtecontrole-vaardigheden.</gray>|<red>Enkele schade doet extra tegen schilden.</red>|<gray>De meeste vaardigheden stuiteren willekeurig naar een andere nabije vijand.</gray>"
  平衡术士: "<red>Afstand <gray>fysiek</gray>/<blue>magie</blue> DPS.</red>|<gray>Vaardigheden zijn verdeeld in verschillende typen.</gray>|<red>Een vaardigheid van een ander type dan de vorige geeft bonusschade.</red>"
  深渊吞噬者: "<red>Afstand <blue>magie</blue> DPS.</red>|<gray>Vaardigheden kunnen DEBUFFs op zichzelf aanbrengen; actief vrijgeven om deze DEBUFFs op nabije vijanden aan te brengen en zichzelf te genezen.</gray>|<green>Bijna de dood, verslindt nabije vijanden en herstelt <dark_green><bold>gezondheid</bold></dark_green>.</green>"
  混沌使者: "<red>Melee <blue>magie</blue> DPS, lagere schade.</red>|<gray>Vaardigheden kunnen willekeurige DEBUFFs op vijanden aanbrengen en hun aanvalskracht verminderen.</gray>|<gray>Wanneer getroffen door menigtecontrole, kan dit worden overgedragen aan nabije vijanden.</gray>"
  时空旅行家: "<red>Afstand <blue>magie</blue> DPS.</red>|<green>Kan gezondheid van bondgenoten opnemen en terugspoelen, schilden met willekeurige waarden en schadevermindering verlenen.</green>|<red>Brengt toenemende schade en vertraging toe aan vijanden.</red>|<gray>Verhoogt of verlaagt willekeurig eigen genezing en schade.</gray>"
  幻影灵魂: "<red>Afstand <blue>magie</blue> DPS.</red>|<gray>Vijanden aanvallen of bondgenoten genezen stapelt markeringen op hen.</gray>|<gray>Het doen ontploffen van markeringen veroorzaakt willekeurig genezing/schade/controle/schadeversterking.</gray>"
  梦魇咒术师: "<gray>Gebruikt verschillende vaardigheidscombinaties voor schade/genezing/tanking en alle functies.</gray>"
