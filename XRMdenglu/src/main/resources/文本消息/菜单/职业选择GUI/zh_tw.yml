职业描述:
  奥能法师: "<red>遠程<blue>魔法</blue>輸出，平緩出傷。</red>|<gray>擁有一定的控制能力。</gray>"
  战斗法师: "<red>遠程<blue>魔法</blue>輸出，近戰<gray>物理</gray>輸出，爆發出傷。</red>|<gray>積攢資源換取爆發傷害。</gray>"
  符文法师: "<red>近戰<blue>魔法</blue>輸出。</red>|<gray>擅長抵抗<blue>魔法</blue>傷害。通過自身技能實現大量減傷或輸出。</gray>"
  大魔导师: "<red>遠程<blue>魔法</blue>輸出。</red>|<gray>釋放不同的強化類技能後可釋放附帶不同效果的<blue>魔法</blue>物質。</gray>"
  德鲁伊: "<red>近戰<gray>物理</gray>輸出，遠程<blue>魔法</blue>輸出。</red>|<green>持續恢復血量。</green>"
  精灵卫士: "<red>遠程<blue>魔法</blue>輸出。傷害均為小範圍AOE傷害。</red>|<gray>自身輸出較低，但可以改變自身與隊友的位置。</gray>|<gray>還可以積攢星辰碎片進行輸出或使隊友獲得減傷。</gray>"
  树人守卫: "<gray>引導後獲得大量減傷，但自身減速。</gray>|<red>技能傷害和減傷較為突出。</red>|<green>擁有不俗的自癒能力。</green>"
  荆棘领主: "<green>擁有不俗的吸血能力。</green>|<red>範圍內召喚荊棘，對敵方造成傷害並對其施加易傷。</red>"
  枪炮师: "<red>遠程<gray>物理</gray>輸出。</red>|<red>站立不動後提高暴擊。</red>|<red>對高血量單位造成額外傷害。</red>"
  机械师: "<red>近戰<gray>物理</gray>輸出，平緩出傷。</red>|<red>攻擊對敵方單位施加流血效果。</red>|<gray>擁有較強的自保能力。</gray>"
  修补匠: "<gray>在三種不同的形態內切換來應對不同的場景。</gray>|<gray>可以佈置一些機械化裝置。</gray>"
  狐灵法师: "<red>遠程<blue>魔法</blue>輸出。</red>|<gray>輸出較低，但可以為隊友增加增益效果。</gray>"
  蛇影刺客: "<red>近戰法術輸出，爆發出傷。</red>|<red>依靠連招打出大量傷害。</red>"
  鹿灵祭司: "<red>能夠給敵方單位施加易傷。</red>|<green>且友方單位對易傷單位的攻擊可以為自己恢復血量。</green>"
  虎威战士: "<green>抗性和生命恢復隨血量的降低而提高。</green>|<gray>將短時間內受到的傷害儲存起來，以換取爆發性的護盾。</gray>"
  灵魂行者: "<green>大範圍治療友方單位或控制敵人。</green>|<green>單體治療較低，但與隊友共享血量。</green>"
  骑士: "<red>近戰<gray>物理</gray>輸出。</red>|<green>擁有短CD的無敵技能。</green>|<green>擁有不俗的治療能力。</green>"
  牧师: "<green>目標損失的生命值越高，治療量越高。</green>|<green>治療量造成暴擊時擁有額外的收益。</green>"
  神谕者: "<red>近戰法系輸出。</red>|<gray>部分技能不分敵我。</gray>|<gray>可以對單目標同時提升其傷害與承傷，同時給予其護盾與易傷等。</gray>"
  战地统帅: "<red>近戰<gray>物理</gray>輸出，爆發出傷。</red>|<gray>周圍隊友每釋放一次技能就會獲得一層效果。</gray>|<gray>依靠該資源打出傷害或治療隊友。</gray>|<green>擁有範圍減傷光環。</green>"
  影舞者: "<red>近戰<gray>物理</gray>輸出。</red>|<red>若在目標身後進行攻擊，則會造成額外傷害。</red>|<red>擁有斬殺能力。</red>"
  暗影术士: "<red>遠程<blue>魔法</blue>輸出。</red>|<red>對敵方單位造成傷害，會留下印記。</red>|<red>通過技能引爆印記時造成範圍傷害並傳染印記。</red>"
  冰霜战士: "<red>血量越高傷害越高。</red>|<gray>技能可凍結敵方單位。</gray>|<red>自身對被凍結的單位造成傷害有額外加成。</red>"
  暗影守卫: "<green>被動減傷隨周圍敵方單位增多而增加。</green>|<green>拉近自身周圍的敵方單位並治療自己。</green>|<green>吸收傷害並延遲轉化為自身生命值。</green>|<green>讓隊友暫時無敵。</green>"
  末日预言者: "<green>為隊友施加末日禱言後，對敵方單位造成傷害後可以恢復隊友生命值。</green>|<gray>可釋放大範圍控制。</gray>|<green>瀕死時為自身恢復生命值。</green>"
  死灵收割者: "<red>近戰<gray>物理</gray>和<blue>魔法</blue>傷害。</red>|<gray>造成傷害或附近有敵方單位死亡時，可以暫時獲得殘骸。</gray>|<gray>消耗殘骸以釋放強大的技能來造成傷害。</gray>"
  女巫: "<red>遠程<blue>魔法</blue>輸出，間隔時間較長的DEBUFF出傷，範圍傷害。</red>|<green>範圍性高CD治療。</green>|<green>可以指定自身和友方單位免疫大量傷害。</green>"
  沸血战士: "<red>主動開啟技能可不斷消耗自身血量並獲得增益。</red>|<red>開啟後每秒獲得嗜血效果，增加自身的承受傷害。</red>|<gray>可釋放該資源以換取額外增益效果。</gray>|<red>血量減至50%以下時獲得順劈和其他額外增益。</red>"
  雷电督军: "<red>遠程<blue>魔法</blue>輸出，平緩出傷。</red>|<gray>擁有強力的控制技能。</gray>|<red>部分傷害對護盾有額外傷害。</red>|<red>大多數技能會隨機彈跳至另一名附近的敵方單位。</red>"
  平衡术士: "<red>遠程<gray>物理</gray>/<blue>魔法</blue>輸出。</red>|<gray>技能分為幾種不同種類。</gray>|<red>使用的技能和上一種不是同一類型技能，則可以額外造成傷害。</red>"
  深渊吞噬者: "<red>遠程<blue>魔法</blue>輸出。</red>|<gray>技能可給予自身DEBUFF，主動釋放後將這些DEBUFF施加到周圍的敵方單位身上並治療自己。</gray>|<green>瀕死時將吞噬周圍敵方單位，並為自身恢復<dark_green><bold>生命值</bold></dark_green>。</green>"
  混沌使者: "<red>近戰<blue>魔法</blue>輸出，傷害較低。</red>|<gray>技能可以使敵方受到隨機DEBUFF，還可以使其的攻擊力降低。</gray>|<gray>受到控制效果時可以轉移給附近的敵方單位。</gray>"
  时空旅行家: "<red>遠程<blue>魔法</blue>輸出。</red>|<green>可以記錄並回溯友方單位的血量，為隊友施加隨機數值的護盾和減傷。</green>|<red>為敵方單位施加逐漸變高的傷害和減速效果。</red>|<gray>隨機提升或降低自身的治療量和傷害。</gray>"
  幻影灵魂: "<red>遠程<blue>魔法</blue>輸出。</red>|<gray>對敵方單位的攻擊或對友方單位的治療會為其疊加印記。</gray>|<gray>引爆印記後可隨機造成治療/傷害/控制/增傷等效果。</gray>"
  梦魇咒术师: "<gray>通過不同的技能組合來進行傷害/治療/承傷等全部功能。</gray>"
