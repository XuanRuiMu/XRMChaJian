职业描述:
  奥能法师: "[dt]Ranged magic DPS, steady damage output.[/dt]|Has some crowd control abilities."
  战斗法师: "[dt]Ranged magic DPS, melee physical DPS, burst damage.[/dt]|Build resources for burst damage."
  符文法师: "[dt]Melee magic DPS.[/dt]|Excels at resisting magic damage. Uses skills for massive damage reduction or output."
  大魔导师: "[dt]Ranged magic DPS.[/dt]|[plain]After casting different enhancement skills, releases magic projectiles with varying effects.[/plain]"
  德鲁伊: "[dt]Melee physical DPS, ranged magic DPS.[/dt]|Sustained healing."
  精灵卫士: "[dt]Ranged magic DPS.[/dt]All damage is small-range AoE.|Low personal output, but can reposition self and allies.|Can accumulate Star Shards for damage or ally damage reduction."
  树人守卫: "Channel to gain massive damage reduction, but self-slowed.|Strong skill damage and damage reduction.|Impressive self-healing."
  荆棘领主: "Strong lifesteal.|Summons thorns in an area, damaging enemies and applying vulnerability."
  枪炮师: "[dt]Ranged physical DPS.[/dt]|Standing still increases critical strike chance.|Deals extra damage to high-health targets."
  机械师: "[dt]Melee physical DPS, steady damage.[/dt]|Attacks apply bleed to enemies.|Strong self-preservation abilities."
  修补匠: "Switch between three different forms to handle various situations.|Can deploy mechanical devices."
  狐灵法师: "[dt]Ranged magic DPS.[/dt]|Lower output, but can buff allies."
  蛇影刺客: "[dt]Melee spell DPS, burst damage.[/dt]|Relies on combos for massive damage."
  鹿灵祭司: "Can apply vulnerability to enemies.|Allies attacking vulnerable targets heal the caster."
  虎威战士: "Resistance and health regeneration increase as health decreases.|Stores damage taken over a short period to exchange for a burst shield."
  灵魂行者: "Wide-area healing or crowd control.|Lower single-target healing, but shares health with allies."
  骑士: "[dt]Melee physical DPS.[/dt]|Short cooldown invulnerability skill.|Impressive healing ability."
  牧师: "Healing increases as target's missing health increases.|Healing critical strikes provide additional benefits."
  神谕者: "[dt]Melee spell DPS.[/dt]|Some skills affect both allies and enemies.|Can simultaneously boost a target's damage and damage taken, while granting shields and vulnerability."
  战地统帅: "[dt]Melee physical DPS, burst damage.[/dt]|Gains a stack each time nearby allies cast a skill.|Uses this resource for damage or healing allies.|Has an area damage reduction aura."
  影舞者: "[dt]Melee physical DPS.[/dt]|Attacking from behind the target deals extra damage.|Has execute ability."
  暗影术士: "[dt]Ranged magic DPS.[/dt]|Dealing damage to enemies leaves marks.|Detonating marks through skills causes AoE damage and spreads marks."
  冰霜战士: "Higher health means higher damage.|Skills can freeze enemies.|Deals bonus damage to frozen targets."
  暗影守卫: "Passive damage reduction increases with more nearby enemies.|Pulls nearby enemies and heals self.|Absorbs damage and converts it to health over time.|Can make allies temporarily invulnerable."
  末日预言者: "After applying Doom Prayer to allies, damaging enemies heals allies.|Can cast wide-area crowd control.|Upon near-death, restores own health."
  死灵收割者: "[dt]Melee physical and magic damage.[/dt]|Gains Remnant temporarily when dealing damage or when nearby enemies die.|Consumes Remnants to unleash powerful skills for damage."
  女巫: "[dt]Ranged magic DPS.[/dt]|Long-interval DEBUFF damage, AoE damage.|High cooldown area healing.|Can grant self and allies immunity to massive damage."
  沸血战士: "Active skill continuously consumes own health for buffs.|After activation, gains Bloodthirst effect per second, increasing damage taken.|Can release this resource for additional buffs.|Below 50% health, gains Cleave and other extra buffs."
  雷电督军: "[dt]Ranged magic DPS, steady damage.[/dt]|Has powerful crowd control skills.|Some damage deals extra to shields.|Most skills randomly bounce to another nearby enemy."
  平衡术士: "[dt]Ranged physical/magic DPS.[/dt]|Skills are divided into several types.|Using a skill different from the previous type deals bonus damage."
  深渊吞噬者: "[dt]Ranged magic DPS.[/dt]|Skills can apply DEBUFFs to self; actively release to apply these DEBUFFs to nearby enemies and heal self.|Upon near-death, devours nearby enemies and restores health."
  混沌使者: "[dt]Melee magic DPS, lower damage.[/dt]|Skills can apply random DEBUFFs to enemies and reduce their attack powers.|When affected by crowd control, can transfer it to nearby enemies."
  时空旅行家: "[dt]Ranged magic DPS.[/dt]|Can record and rewind ally health, granting random-value shields and damage reduction.|Applies increasing damage and slow to enemies.|Randomly boosts or reduces own healing and damage."
  幻影灵魂: "[dt]Ranged magic DPS.[/dt]|Attacking enemies or healing allies stacks marks on them.|Detonating marks randomly causes healing/damage/crowd control/damage boost effects."
  梦魇咒术师: "Uses different skill combinations for damage/healing/tanking and all functions."
