职业描述:
  奥能法师: "<red>DPS <blue>pháp thuật</blue> tầm xa, sát thương ổn định.</red>|<gray>Có kỹ năng khống chế đám đông.</gray>"
  战斗法师: "<red>DPS <blue>pháp thuật</blue> tầm xa, DPS <gray>vật lý</gray> cận chiến, sát thương burst.</red>|<gray>Tích lũy tài nguyên cho sát thương burst.</gray>"
  符文法师: "<red>DPS <blue>pháp thuật</blue> cận chiến.</red>|<gray>Xuất sắc trong việc kháng sát thương <blue>pháp thuật</blue>. Dùng kỹ năng giảm sát thương lớn hoặc gây sát thương burst.</gray>"
  大魔导师: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<gray>Sau khi thi triển các kỹ năng cường hóa khác nhau, bắn đạn <blue>pháp thuật</blue> với hiệu ứng đa dạng.</gray>"
  德鲁伊: "<red>DPS <gray>vật lý</gray> cận chiến, DPS <blue>pháp thuật</blue> tầm xa.</red>|<green>Hồi máu liên tục.</green>"
  精灵卫士: "<red>DPS <blue>pháp thuật</blue> tầm xa. Toàn bộ sát thương là AoE cự ly ngắn.</red>|<gray>Sát thương cá nhân thấp, nhưng có thể định vị lại bản thân và đồng minh.</gray>|<gray>Có thể tích lũy Mảnh Sao cho sát thương hoặc giảm sát thương đồng minh.</gray>"
  树人守卫: "<gray>Đọc chú để giảm sát thương lớn, nhưng tự làm chậm bản thân.</gray>|<red>Sát thương kỹ năng và giảm sát thương mạnh.</red>|<green>Tự hồi máu ấn tượng.</green>"
  荆棘领主: "<green>Hút máu mạnh.</green>|<red>Triệu hồi gai trong khu vực, gây sát thương kẻ địch và áp dụng dễ tổn thương.</red>"
  枪炮师: "<red>DPS <gray>vật lý</gray> tầm xa.</red>|<red>Đứng yên tăng tỷ lệ chí mạng.</red>|<red>Gây sát thương thêm lên mục tiêu có nhiều máu.</red>"
  机械师: "<red>DPS <gray>vật lý</gray> cận chiến, sát thương ổn định.</red>|<red>Tấn công gây chảy máu kẻ địch.</red>|<gray>Kỹ năng tự bảo vệ mạnh.</gray>"
  修补匠: "<gray>Chuyển đổi giữa ba hình dạng khác nhau để xử lý nhiều tình huống.</gray>|<gray>Có thể triển khai thiết bị cơ khí.</gray>"
  狐灵法师: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<gray>Sát thương thấp hơn, nhưng có thể buff đồng minh.</gray>"
  蛇影刺客: "<red>DPS chú thuật cận chiến, sát thương burst.</red>|<red>Dựa vào combo cho sát thương lớn.</red>"
  鹿灵祭司: "<red>Có thể áp dụng dễ tổn thương lên kẻ địch.</red>|<green>Đồng minh tấn công mục tiêu dễ tổn thương sẽ hồi máu cho người thi triển.</green>"
  虎威战士: "<green>Kháng và hồi máu tăng khi máu giảm.</green>|<gray>Lưu sát thương nhận trong thời gian ngắn để đổi lấy khiên burst.</gray>"
  灵魂行者: "<green>Hồi máu hoặc khống chế đám đông diện rộng.</green>|<green>Hồi máu đơn mục tiêu thấp hơn, nhưng chia sẻ máu với đồng minh.</green>"
  骑士: "<red>DPS <gray>vật lý</gray> cận chiến.</red>|<green>Kỹ năng bất tử thời gian hồi ngắn.</green>|<green>Khả năng hồi máu ấn tượng.</green>"
  牧师: "<green>Lượng hồi máu tăng theo lượng máu thiếu của mục tiêu.</green>|<green>Hồi máu chí mạng mang lợi ích thêm.</green>"
  神谕者: "<red>DPS chú thuật cận chiến.</red>|<gray>Một số kỹ năng ảnh hưởng cả đồng minh và kẻ địch.</gray>|<gray>Có thể đồng thời tăng sát thương và sát thương nhận của mục tiêu, cấp khiên và dễ tổn thương.</gray>"
  战地统帅: "<red>DPS <gray>vật lý</gray> cận chiến, sát thương burst.</red>|<gray>Nhận 1 chồng mỗi khi đồng minh gần đó dùng kỹ năng.</gray>|<gray>Dùng tài nguyên này cho sát thương hoặc hồi máu đồng minh.</gray>|<green>Có hào quang giảm sát thương diện rộng.</green>"
  影舞者: "<red>DPS <gray>vật lý</gray> cận chiến.</red>|<red>Tấn công từ phía sau mục tiêu gây sát thương thêm.</red>|<red>Có kỹ năng hành quyết.</red>"
  暗影术士: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<red>Gây sát thương kẻ địch để lại dấu ấn.</red>|<gray>Kích nổ dấu ấn bằng kỹ năng gây sát thương AoE và lan dấu ấn.</gray>"
  冰霜战士: "<red>Nhiều máu hơn nghĩa là nhiều sát thương hơn.</red>|<gray>Kỹ năng có thể đóng băng kẻ địch.</gray>|<red>Gây sát thương bonus lên mục tiêu bị đóng băng.</red>"
  暗影守卫: "<green>Giảm sát thương thụ động tăng khi có nhiều kẻ địch gần hơn.</green>|<green>Kéo kẻ địch gần và tự hồi máu.</green>|<green>Hấp thụ sát thương và chuyển thành máu theo thời gian.</green>|<green>Có thể làm đồng minh bất tử tạm thời.</green>"
  末日预言者: "<green>Sau khi áp dụng Cầu Nguyện Diệt Vong lên đồng minh, gây sát thương kẻ địch sẽ hồi máu đồng minh.</green>|<gray>Có thể thi triển khống chế đám đông diện rộng.</gray>|<green>Gần chết, hồi phục máu bản thân.</green>"
  死灵收割者: "<red>Sát thương <gray>vật lý</gray> và <blue>pháp thuật</blue> cận chiến.</red>|<gray>Nhận Tàn Tích tạm thời khi gây sát thương hoặc khi kẻ địch gần đó chết.</gray>|<gray>Tiêu hao Tàn Tích để giải phóng kỹ năng sát thương mạnh.</gray>"
  女巫: "<red>DPS <blue>pháp thuật</blue> tầm xa, sát thương DEBUFF khoảng cách dài, sát thương AoE.</red>|<green>Hồi máu diện rộng thời gian hồi dài.</green>|<green>Có thể cấp miễn nhiễm sát thương lớn cho bản thân và đồng minh.</green>"
  沸血战士: "<red>Kỹ năng chủ động liên tục tiêu hao máu bản thân để lấy buff.</red>|<red>Sau khi kích hoạt, nhận hiệu ứng Khát Máu mỗi giây, tăng sát thương nhận.</red>|<gray>Có thể giải phóng tài nguyên này cho buff thêm.</gray>|<red>Dưới 50% máu, nhận Chẻ và buff thêm khác.</red>"
  雷电督军: "<red>DPS <blue>pháp thuật</blue> tầm xa, sát thương ổn định.</red>|<gray>Có kỹ năng khống chế mạnh.</gray>|<red>Một số sát thương gây thêm lên khiên.</red>|<red>Hầu hết kỹ năng nảy ngẫu nhiên sang kẻ địch gần khác.</red>"
  平衡术士: "<red>DPS <gray>vật lý</gray>/<blue>pháp thuật</blue> tầm xa.</red>|<gray>Kỹ năng chia thành nhiều loại.</gray>|<red>Dùng kỹ năng khác loại với lần trước gây sát thương bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<gray>Kỹ năng có thể áp dụng DEBUFF lên bản thân; giải phóng chủ động để áp dụng DEBUFF lên kẻ địch gần và tự hồi máu.</gray>|<green>Gần chết, nuốt chửng kẻ địch gần và hồi phục <dark_green><bold>máu</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>pháp thuật</blue> cận chiến, sát thương thấp hơn.</red>|<gray>Kỹ năng có thể áp dụng DEBUFF ngẫu nhiên lên kẻ địch và giảm sức tấn công.</gray>|<gray>Khi bị khống chế, có thể chuyển sang kẻ địch gần.</gray>"
  时空旅行家: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<green>Có thể ghi và tua lại máu đồng minh, cấp khiên giá trị ngẫu nhiên và giảm sát thương.</green>|<red>Áp dụng sát thương tăng dần và làm chậm kẻ địch.</red>|<gray>Ngẫu nhiên tăng hoặc giảm hồi máu và sát thương bản thân.</gray>"
  幻影灵魂: "<red>DPS <blue>pháp thuật</blue> tầm xa.</red>|<gray>Tấn công kẻ địch hoặc hồi máu đồng minh tích dấu ấn lên họ.</gray>|<gray>Kích nổ dấu ấn ngẫu nhiên gây hồi máu/sát thương/khống chế/tăng sát thương.</gray>"
  梦魇咒术师: "<gray>Dùng các tổ hợp kỹ năng khác nhau cho sát thương/hồi máu/tank và mọi chức năng.</gray>"
