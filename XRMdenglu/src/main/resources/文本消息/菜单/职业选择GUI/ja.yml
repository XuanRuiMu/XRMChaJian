职业描述:
  奥能法师: "<red>遠距離<blue>魔法</blue>DPS、安定したダメージ出力。</red>|<gray>CC能力を持つ。</gray>"
  战斗法师: "<red>遠距離<blue>魔法</blue>DPS、近接<gray>物理</gray>DPS、バーストダメージ。</red>|<gray>リソースを蓄積してバーストダメージを放つ。</gray>"
  符文法师: "<red>近接<blue>魔法</blue>DPS。</red>|<gray><blue>魔法</blue>ダメージ耐性に優れる。スキルで大ダメージ軽減または大ダメージ出力。</gray>"
  大魔导师: "<red>遠距離<blue>魔法</blue>DPS。</red>|<gray>異なる強化スキルを詠唱後、効果の異なる<blue>魔法</blue>弾を放つ。</gray>"
  德鲁伊: "<red>近接<gray>物理</gray>DPS、遠距離<blue>魔法</blue>DPS。</red>|<green>持続ヒール。</green>"
  精灵卫士: "<red>遠距離<blue>魔法</blue>DPS。全ダメージが小範囲AoE。</red>|<gray>自身の火力は低いが、自身と味方の位置を調整できる。</gray>|<gray>スターシャードを蓄積し、ダメージまたは味方のダメージ軽減に使用。</gray>"
  树人守卫: "<gray>チャネリングで大ダメージ軽減を得るが、自身が減速。</gray>|<red>強力なスキルダメージとダメージ軽減。</red>|<green>優れた自己回復。</green>"
  荆棘领主: "<green>強力なライフスティール。</green>|<red>範囲に茨を召喚し、敵にダメージと脆弱を付与。</red>"
  枪炮师: "<red>遠距離<gray>物理</gray>DPS。</red>|<red>立ち止まるとクリティカル率が上昇。</red>|<red>高体力の対象に追加ダメージ。</red>"
  机械师: "<red>近接<gray>物理</gray>DPS、安定ダメージ。</red>|<red>攻撃が敵に出血を付与。</red>|<gray>強力な自己保存能力。</gray>"
  修补匠: "<gray>3つの異なる形態を切り替えて様々な状況に対応。</gray>|<gray>機械装置を展開可能。</gray>"
  狐灵法师: "<red>遠距離<blue>魔法</blue>DPS。</red>|<gray>火力は低めだが、味方をバフ可能。</gray>"
  蛇影刺客: "<red>近接スペルDPS、バーストダメージ。</red>|<red>コンボで大ダメージを狙う。</red>"
  鹿灵祭司: "<red>敵に脆弱を付与可能。</red>|<green>味方が脆弱な対象を攻撃すると詠唱者を回復。</green>"
  虎威战士: "<green>体力が減るほど耐性と体力再生が上昇。</green>|<gray>短時間に受けたダメージを蓄積し、バーストシールドと交換。</gray>"
  灵魂行者: "<green>広範囲ヒールまたはCC。</green>|<green>単体ヒールは低めだが、味方と体力を共有。</green>"
  骑士: "<red>近接<gray>物理</gray>DPS。</red>|<green>短クールダウンの無敵スキル。</green>|<green>優れた回復力。</green>"
  牧师: "<green>対象の減少体力に応じてヒール量が増加。</green>|<green>クリティカルヒールが追加効果を付与。</green>"
  神谕者: "<red>近接スペルDPS。</red>|<gray>一部のスキルは味方と敵の両方に影響。</gray>|<gray>対象のダメージと被ダメージを同時に増加させ、シールドと脆弱を付与可能。</gray>"
  战地统帅: "<red>近接<gray>物理</gray>DPS、バーストダメージ。</red>|<gray>近くの味方がスキルを使用するたびにスタックを獲得。</gray>|<gray>このリソースをダメージまたは味方の回復に使用。</gray>|<green>範囲ダメージ軽減オーラを持つ。</green>"
  影舞者: "<red>近接<gray>物理</gray>DPS。</red>|<red>対象の背後から攻撃すると追加ダメージ。</red>|<red>処刑スキルを持つ。</red>"
  暗影术士: "<red>遠距離<blue>魔法</blue>DPS。</red>|<red>敵にダメージを与えるとマークを残す。</red>|<red>スキルでマークを起爆するとAoEダメージとマーク拡散。</red>"
  冰霜战士: "<red>体力が多いほどダメージが増加。</red>|<gray>スキルで敵を凍結可能。</gray>|<red>凍結した対象にボーナスダメージ。</red>"
  暗影守卫: "<green>周囲の敵が多いほどパッシブダメージ軽減が上昇。</green>|<green>周囲の敵を引き寄せて自己回復。</green>|<green>ダメージを吸収し、時間をかけて体力に変換。</green>|<green>味方を一時的に無敵にできる。</green>"
  末日预言者: "<green>味方に終末の祈りを付与後、敵にダメージで味方を回復。</green>|<gray>広範囲CCを詠唱可能。</gray>|<green>瀕死時、自身の体力を回復。</green>"
  死灵收割者: "<red>近接<gray>物理</gray>および<blue>魔法</blue>ダメージ。</red>|<gray>ダメージを与えるか近くの敵が死亡すると一時的に残骸を獲得。</gray>|<gray>残骸を消費して強力なダメージスキルを放つ。</gray>"
  女巫: "<red>遠距離<blue>魔法</blue>DPS、長間隔DEBUFFダメージ、AoEダメージ。</red>|<green>長クールダウンの範囲ヒール。</green>|<green>自身と味方に大ダメージ無効化を付与可能。</green>"
  沸血战士: "<red>アクティブスキルが自身の体力を継続消費してバフを得る。</red>|<red>発動後、毎秒渇血効果を獲得し被ダメージが増加。</red>|<gray>このリソースを解放して追加バフを得る。</gray>|<red>体力50%以下で範囲攻撃と追加バフを獲得。</red>"
  雷电督军: "<red>遠距離<blue>魔法</blue>DPS、安定ダメージ。</red>|<gray>強力なCCスキルを持つ。</gray>|<red>一部のダメージはシールドに追加ダメージ。</red>|<red>ほとんどのスキルがランダムに近くの別の敵に跳ねる。</red>"
  平衡术士: "<red>遠距離<gray>物理</gray>/<blue>魔法</blue>DPS。</red>|<gray>スキルは複数のタイプに分かれる。</gray>|<red>前回と異なるタイプのスキルを使用するとボーナスダメージ。</red>"
  深渊吞噬者: "<red>遠距離<blue>魔法</blue>DPS。</red>|<gray>スキルで自身にDEBUFFを付与可能；能動的に解放して周囲の敵にDEBUFFを付与し自己回復。</gray>|<green>瀕死時、近くの敵を貪り<dark_green><bold>体力</bold></dark_green>を回復。</green>"
  混沌使者: "<red>近接<blue>魔法</blue>DPS、低ダメージ。</red>|<gray>スキルで敵にランダムDEBUFFを付与し攻撃力を低下。</gray>|<gray>CCを受けた時、近くの敵に転嫁可能。</gray>"
  时空旅行家: "<red>遠距離<blue>魔法</blue>DPS。</red>|<green>味方の体力を記録・巻き戻し、ランダム値のシールドとダメージ軽減を付与。</green>|<red>敵に漸増ダメージと減速を付与。</red>|<gray>自身のヒールとダメージをランダムに増減。</gray>"
  幻影灵魂: "<red>遠距離<blue>魔法</blue>DPS。</red>|<gray>敵を攻撃または味方を回復するとマークを蓄積。</gray>|<gray>マークを起爆するとランダムにヒール/ダメージ/CC/ダメージ増加。</gray>"
  梦魇咒术师: "<gray>異なるスキルコンボでダメージ/ヒール/タンクの全機能を発揮。</gray>"
