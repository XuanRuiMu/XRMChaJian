职业描述:
  奥能法师: "<red>DPS <blue>mágico</blue> a distancia, daño constante.</red>|<gray>Posee habilidades de control de masas.</gray>"
  战斗法师: "<red>DPS <blue>mágico</blue> a distancia, DPS <gray>físico</gray> cuerpo a cuerpo, daño explosivo.</red>|<gray>Acumula recursos para daño explosivo.</gray>"
  符文法师: "<red>DPS <blue>mágico</blue> cuerpo a cuerpo.</red>|<gray>Especializado en resistir daño <blue>mágico</blue>. Usa habilidades para reducción masiva de daño o daño explosivo.</gray>"
  大魔导师: "<red>DPS <blue>mágico</blue> a distancia.</red>|<gray>Tras lanzar diferentes habilidades de mejora, libera proyectiles <blue>mágicos</blue> con efectos variados.</gray>"
  德鲁伊: "<red>DPS <gray>físico</gray> cuerpo a cuerpo, DPS <blue>mágico</blue> a distancia.</red>|<green>Curación sostenida.</green>"
  精灵卫士: "<red>DPS <blue>mágico</blue> a distancia. Todo el daño es AoE de corto alcance.</red>|<gray>Bajo daño personal, pero puede reposicionarse a sí mismo y a aliados.</gray>|<gray>Puede acumular Fragmentos Estelares para daño o reducción de daño de aliados.</gray>"
  树人守卫: "<gray>Canaliza para obtener reducción masiva de daño, pero se ralentiza.</gray>|<red>Fuerte daño de habilidades y reducción de daño.</red>|<green>Impresionante autocuración.</green>"
  荆棘领主: "<green>Fuerte robo de vida.</green>|<red>Invoca espinas en un área, dañando enemigos y aplicando vulnerabilidad.</red>"
  枪炮师: "<red>DPS <gray>físico</gray> a distancia.</red>|<red>Quedarse quieto aumenta la probabilidad de golpe crítico.</red>|<red>Inflige daño extra a objetivos con mucha salud.</red>"
  机械师: "<red>DPS <gray>físico</gray> cuerpo a cuerpo, daño constante.</red>|<red>Los ataques aplican sangrado a los enemigos.</red>|<gray>Fuertes habilidades de autopreservación.</gray>"
  修补匠: "<gray>Alterna entre tres formas diferentes para manejar diversas situaciones.</gray>|<gray>Puede desplegar dispositivos mecánicos.</gray>"
  狐灵法师: "<red>DPS <blue>mágico</blue> a distancia.</red>|<gray>Menor daño, pero puede potenciar a aliados.</gray>"
  蛇影刺客: "<red>DPS hechicero cuerpo a cuerpo, daño explosivo.</red>|<red>Depende de combos para daño masivo.</red>"
  鹿灵祭司: "<red>Puede aplicar vulnerabilidad a los enemigos.</red>|<green>Los aliados que ataquen objetivos vulnerables curan al lanzador.</green>"
  虎威战士: "<green>La resistencia y regeneración de salud aumentan al disminuir la salud.</green>|<gray>Almacena el daño recibido en un período corto para intercambiarlo por un escudo explosivo.</gray>"
  灵魂行者: "<green>Curación o control de masas en área amplia.</green>|<green>Menor curación individual, pero comparte salud con aliados.</green>"
  骑士: "<red>DPS <gray>físico</gray> cuerpo a cuerpo.</red>|<green>Habilidad de invulnerabilidad con enfriamiento corto.</green>|<green>Impresionante capacidad de curación.</green>"
  牧师: "<green>La curación aumenta conforme la salud faltante del objetivo.</green>|<green>Las curaciones críticas otorgan beneficios adicionales.</green>"
  神谕者: "<red>DPS hechicero cuerpo a cuerpo.</red>|<gray>Algunas habilidades afectan tanto a aliados como a enemigos.</gray>|<gray>Puede aumentar simultáneamente el daño y el daño recibido de un objetivo, otorgando escudos y vulnerabilidad.</gray>"
  战地统帅: "<red>DPS <gray>físico</gray> cuerpo a cuerpo, daño explosivo.</red>|<gray>Gana una acumulación cada vez que aliados cercanos lanzan una habilidad.</gray>|<gray>Usa este recurso para daño o curación de aliados.</gray>|<green>Posee un aura de reducción de daño en área.</green>"
  影舞者: "<red>DPS <gray>físico</gray> cuerpo a cuerpo.</red>|<red>Atacar por detrás del objetivo inflige daño extra.</red>|<red>Posee habilidad de ejecución.</red>"
  暗影术士: "<red>DPS <blue>mágico</blue> a distancia.</red>|<red>Infligir daño a enemigos deja marcas.</red>|<red>Detonar marcas mediante habilidades causa daño AoE y propaga marcas.</red>"
  冰霜战士: "<red>Más salud significa más daño.</red>|<gray>Las habilidades pueden congelar enemigos.</gray>|<red>Inflige daño bonus a objetivos congelados.</red>"
  暗影守卫: "<green>La reducción de daño pasiva aumenta con más enemigos cercanos.</green>|<green>Atrae enemigos cercanos y se cura.</green>|<green>Absorbe daño y lo convierte en salud con el tiempo.</green>|<green>Puede hacer a los aliados temporalmente invulnerables.</green>"
  末日预言者: "<green>Tras aplicar Plegaria de Perdición a aliados, dañar enemigos cura a los aliados.</green>|<gray>Puede lanzar control de masas en área amplia.</gray>|<green>Al borde de la muerte, restaura su propia salud.</green>"
  死灵收割者: "<red>Daño <gray>físico</gray> y <blue>mágico</blue> cuerpo a cuerpo.</red>|<gray>Gana Remanentes temporalmente al infligir daño o cuando enemigos cercanos mueren.</gray>|<gray>Consume Remanentes para desatar habilidades poderosas de daño.</gray>"
  女巫: "<red>DPS <blue>mágico</blue> a distancia, daño DEBUFF de intervalo largo, daño AoE.</red>|<green>Curación en área de enfriamiento alto.</green>|<green>Puede otorgar inmunidad contra daño masivo a sí misma y aliados.</green>"
  沸血战士: "<red>La habilidad activa consume continuamente salud propia para mejoras.</red>|<red>Tras la activación, gana efecto de Sed de Sangre por segundo, aumentando el daño recibido.</red>|<gray>Puede liberar este recurso para mejoras adicionales.</gray>|<red>Debajo del 50% de salud, obtiene Hendidura y otras mejoras extras.</red>"
  雷电督军: "<red>DPS <blue>mágico</blue> a distancia, daño constante.</red>|<gray>Posee poderosas habilidades de control.</gray>|<red>Algo de daño inflige extra a escudos.</red>|<red>La mayoría de habilidades rebotan aleatoriamente a otro enemigo cercano.</red>"
  平衡术士: "<red>DPS <gray>físico</gray>/<blue>mágico</blue> a distancia.</red>|<gray>Las habilidades se dividen en varios tipos.</gray>|<red>Usar una habilidad de tipo diferente a la anterior inflige daño bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>mágico</blue> a distancia.</red>|<gray>Las habilidades pueden aplicar DEBUFFs a sí mismo; liberar activamente para aplicar estos DEBUFFs a enemigos cercanos y curarse.</gray>|<green>Al borde de la muerte, devora enemigos cercanos y restaura <dark_green><bold>salud</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>mágico</blue> cuerpo a cuerpo, menor daño.</red>|<gray>Las habilidades pueden aplicar DEBUFFs aleatorios a enemigos y reducir su poder de ataque.</gray>|<gray>Cuando está afectado por control de masas, puede transferirlo a enemigos cercanos.</gray>"
  时空旅行家: "<red>DPS <blue>mágico</blue> a distancia.</red>|<green>Puede registrar y rebobinar la salud de aliados, otorgando escudos de valor aleatorio y reducción de daño.</green>|<red>Aplica daño creciente y ralentización a enemigos.</red>|<gray>Aumenta o reduce aleatoriamente su propia curación y daño.</gray>"
  幻影灵魂: "<red>DPS <blue>mágico</blue> a distancia.</red>|<gray>Atacar enemigos o curar aliados acumula marcas en ellos.</gray>|<gray>Detonar marcas causa aleatoriamente curación/daño/control/potenciación de daño.</gray>"
  梦魇咒术师: "<gray>Usa diferentes combinaciones de habilidades para daño/curación/tanqueo y todas las funciones.</gray>"
