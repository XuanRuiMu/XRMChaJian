职业描述:
  奥能法师: "[dt]远程输出，平缓出伤。[/dt]|拥有一定的自保能力。"
  战斗法师: "[dt]兼顾近战与远程输出。[/dt]|快速积攒资源换取爆发伤害。"
  符文法师: "[dt]近战输出，擅长抵抗伤害。[/dt]|通过自身技能实现大量减伤或输出。"
  大魔导师: "[dt]远程输出。[/dt]|释放不同的强化类技能后可释放附带不同效果的魔法物质。"
  德鲁伊: "[dt]兼顾近战与远程输出。[/dt]|持续恢复血量。"
  精灵卫士: "[dt]远程输出。[/dt]|伤害均为小范围AOE伤害。|自身输出较低，但可以为队友提供特殊效果。"
  树人守卫: "引导后获得大量减伤，但自身被减速。|技能减伤较为突出，且拥有不俗的自愈能力。"
  荆棘领主: "拥有不俗的吸血能力。|拥有不俗的范围伤害。"
  枪炮师: "[dt]远程输出。[/dt]|站立不动获得增伤。"
  机械师: "[dt]近战输出，平缓出伤。[/dt]|攻击对敌方单位施加Dot效果，拥有较强的自保能力。"
  修补匠: "在三种不同的形态内切换来应对不同的场景。"
  狐灵法师: "[dt]远程输出。[/dt]|输出较低，但可以为队友施加增益效果。"
  蛇影刺客: "[dt]近战输出，爆发出伤。[/dt]|依靠连招打出大量伤害。"
  鹿灵祭司: "能够给敌方单位施加易伤，友方单位对易伤单位的攻击可以为自己恢复血量。"
  虎威战士: "抗性和生命恢复随血量的降低而提高。|将短时间内受到的伤害储存起来，以换取爆发性的护盾。"
  灵魂行者: "大范围治疗友方单位或控制敌人。"
  骑士: "[dt]近战输出。[/dt]|拥有无敌技能和不俗的治疗能力。"
  牧师: "目标损失的生命值越高，治疗量越高。|治疗量造成暴击时拥有额外的收益。"
  神谕者: "[dt]近战输出。[/dt]|部分技能可以对所有目标生效。"
  战地统帅: "[dt]近战输出。[/dt]|拥有范围效果光环。"
  影舞者: "[dt]近战输出。[/dt]|拥有斩杀能力。"
  暗影术士: "[dt]远程输出。[/dt]|通过技能造成范围伤害并传染DEBUFF。"
  冰霜战士: "血量越高伤害越高。|技能可冻结敌方单位。|对被冻结的单位有额外伤害。"
  暗影守卫: "吸收伤害并延迟转化为自身生命值。"
  末日预言者: "为队友施加BUFF后，对敌方单位造成伤害后可以恢复队友生命值。"
  死灵收割者: "[dt]近战伤害。[/dt]|造成伤害可以暂时获得残骸。|通过残骸释放不同效果的技能。"
  女巫: "[dt]远程输出。[/dt]|范围性伤害和治疗。"
  沸血战士: "可不断消耗自身血量并获得增益。"
  雷电督军: "[dt]远程输出，平缓出伤。[/dt]|技能多为存在目标限制的范围伤害。"
  平衡术士: "[dt]远程输出。[/dt]|使用的技能和上一种不是同一类型技能，则可以拥有额外效果。"
  深渊吞噬者: "技能可给予自身DEBUFF，主动释放后将这些DEBUFF施加到周围的敌方单位身上。"
  混沌使者: "[dt]近战输出，伤害较低。[/dt]|可以对敌方施加DEBUFF。"
  时空旅行家: "[dt]远程输出。[/dt]|可以记录并回溯友方单位的血量。"
  幻影灵魂: "[dt]远程输出。[/dt]|对敌方单位的攻击或对友方单位的治疗会为其叠加印记。|引爆印记后可造成不同的效果。"
  梦魇咒术师: "通过不同的技能组合来进行伤害/治疗/承伤等全部功能。"
