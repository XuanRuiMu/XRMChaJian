职业描述:
  奥能法师: "<red>DPS <blue>magico</blue> a distanza, danno costante.</red>|<gray>Ha alcune abilità di controllo.</gray>"
  战斗法师: "<red>DPS <blue>magico</blue> a distanza, DPS <gray>fisico</gray> corpo a corpo, danno esplosivo.</red>|<gray>Accumula risorse per danno esplosivo.</gray>"
  符文法师: "<red>DPS <blue>magico</blue> corpo a corpo.</red>|<gray>Eccelle nel resistere al danno <blue>magico</blue>. Usa abilità per riduzione massiva del danno o danno esplosivo.</gray>"
  大魔导师: "<red>DPS <blue>magico</blue> a distanza.</red>|<gray>Dopo aver lanciato diverse abilità di potenziamento, rilascia proiettili <blue>magici</blue> con effetti variabili.</gray>"
  德鲁伊: "<red>DPS <gray>fisico</gray> corpo a corpo, DPS <blue>magico</blue> a distanza.</red>|<green>Cura sostenuta.</green>"
  精灵卫士: "<red>DPS <blue>magico</blue> a distanza. Tutto il danno è AoE a corto raggio.</red>|<gray>Basso danno personale, ma può riposizionare sé stesso e gli alleati.</gray>|<gray>Può accumulare Frammenti Stellari per danno o riduzione danno degli alleati.</gray>"
  树人守卫: "<gray>Canalizza per ottenere riduzione massiva del danno, ma si rallenta.</gray>|<red>Forte danno da abilità e riduzione del danno.</red>|<green>Impressionante auto-cura.</green>"
  荆棘领主: "<green>Forte rubavita.</green>|<red>Evoca spine in un'area, danneggiando i nemici e applicando vulnerabilità.</red>"
  枪炮师: "<red>DPS <gray>fisico</gray> a distanza.</red>|<red>Rimanere fermi aumenta la probabilità di colpo critico.</red>|<red>Infligge danno extra ai bersagli con molta salute.</red>"
  机械师: "<red>DPS <gray>fisico</gray> corpo a corpo, danno costante.</red>|<red>Gli attacchi applicano sanguinamento ai nemici.</red>|<gray>Forti capacità di autoconservazione.</gray>"
  修补匠: "<gray>Alterna tra tre forme diverse per gestire varie situazioni.</gray>|<gray>Può schierare dispositivi meccanici.</gray>"
  狐灵法师: "<red>DPS <blue>magico</blue> a distanza.</red>|<gray>Danno inferiore, ma può potenziare gli alleati.</gray>"
  蛇影刺客: "<red>DPS incantesimo corpo a corpo, danno esplosivo.</red>|<gray>Si affida a combo per danno massivo.</gray>"
  鹿灵祭司: "<red>Può applicare vulnerabilità ai nemici.</red>|<green>Gli alleati che attaccano bersagli vulnerabili curano il lanciatore.</green>"
  虎威战士: "<green>Resistenza e rigenerazione della salute aumentano al diminuire della salute.</green>|<gray>Accumula danno subito in un breve periodo per scambiarlo con uno scudo esplosivo.</gray>"
  灵魂行者: "<green>Cura o controllo ad ampio raggio.</green>|<green>Minore cura a bersaglio singolo, ma condivide la salute con gli alleati.</green>"
  骑士: "<red>DPS <gray>fisico</gray> corpo a corpo.</red>|<green>Abilità di invulnerabilità con cooldown breve.</green>|<green>Impressionante capacità di cura.</green>"
  牧师: "<green>La cura aumenta con la salute mancante del bersaglio.</green>|<green>Le cure critiche conferiscono benefici aggiuntivi.</green>"
  神谕者: "<red>DPS incantesimo corpo a corpo.</red>|<gray>Alcune abilità influenzano sia alleati che nemici.</gray>|<gray>Può aumentare simultaneamente il danno e il danno subito di un bersaglio, garantendo scudi e vulnerabilità.</gray>"
  战地统帅: "<red>DPS <gray>fisico</gray> corpo a corpo, danno esplosivo.</red>|<gray>Ottiene una carica ogni volta che gli alleati vicini lanciano un'abilità.</gray>|<gray>Usa questa risorsa per danno o cura degli alleati.</gray>|<green>Ha un'aura di riduzione danno ad area.</green>"
  影舞者: "<red>DPS <gray>fisico</gray> corpo a corpo.</red>|<red>Attaccare da dietro il bersaglio infligge danno extra.</red>|<red>Ha un'abilità di esecuzione.</red>"
  暗影术士: "<red>DPS <blue>magico</blue> a distanza.</red>|<red>Infliggere danno ai nemici lascia marchi.</red>|<red>Detonare i marchi tramite abilità causa danno AoE e propaga i marchi.</red>"
  冰霜战士: "<red>Più salute significa più danno.</red>|<gray>Le abilità possono congelare i nemici.</gray>|<red>Infligge danno bonus ai bersagli congelati.</red>"
  暗影守卫: "<green>La riduzione passiva del danno aumenta con più nemici vicini.</green>|<green>Attira i nemici vicini e si cura.</green>|<green>Assorbe danno e lo converte in salute nel tempo.</green>|<green>Può rendere gli alleati temporaneamente invulnerabili.</green>"
  末日预言者: "<green>Dopo aver applicato Preghiera di Perdizione agli alleati, danneggiare i nemici cura gli alleati.</green>|<gray>Può lanciare controllo di massa ad ampio raggio.</gray>|<green>In prossimità della morte, ripristina la propria salute.</green>"
  死灵收割者: "<red>Danno <gray>fisico</gray> e <blue>magico</blue> corpo a corpo.</red>|<gray>Ottiene Reliquie temporaneamente infliggendo danno o quando nemici vicini muoiono.</gray>|<gray>Consuma Reliquie per scatenare potenti abilità di danno.</gray>"
  女巫: "<red>DPS <blue>magico</blue> a distanza, danno DEBUFF a intervallo lungo, danno AoE.</red>|<green>Cura ad area con cooldown elevato.</green>|<green>Può garantire a sé e agli alleati immunità contro danno massivo.</green>"
  沸血战士: "<red>L'abilità attiva consuma continuamente la propria salute per potenziamenti.</red>|<red>Dopo l'attivazione, ottiene l'effetto Sete di Sangue al secondo, aumentando il danno subito.</red>|<gray>Può rilasciare questa risorsa per potenziamenti aggiuntivi.</gray>|<red>Sotto il 50% di salute, ottiene Fendente e altri potenziamenti extra.</red>"
  雷电督军: "<red>DPS <blue>magico</blue> a distanza, danno costante.</red>|<gray>Ha potenti abilità di controllo.</gray>|<red>Parte del danno infligge extra agli scudi.</red>|<red>La maggior parte delle abilità rimbalza casualmente su un altro nemico vicino.</red>"
  平衡术士: "<red>DPS <gray>fisico</gray>/<blue>magico</blue> a distanza.</red>|<gray>Le abilità sono divise in diversi tipi.</gray>|<red>Usare un'abilità di tipo diverso dalla precedente infligge danno bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>magico</blue> a distanza.</red>|<gray>Le abilità possono applicare DEBUFF a sé stesso; rilasciare attivamente per applicare questi DEBUFF ai nemici vicini e curarsi.</gray>|<green>In prossimità della morte, divora i nemici vicini e ripristina la <dark_green><bold>salute</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>magico</blue> corpo a corpo, danno inferiore.</red>|<gray>Le abilità possono applicare DEBUFF casuali ai nemici e ridurre il loro potere d'attacco.</gray>|<gray>Quando affetto da controllo, può trasferirlo ai nemici vicini.</gray>"
  时空旅行家: "<red>DPS <blue>magico</blue> a distanza.</red>|<green>Può registrare e riavvolgere la salute degli alleati, garantendo scudi di valore casuale e riduzione del danno.</green>|<red>Applica danno crescente e rallentamento ai nemici.</red>|<gray>Aumenta o riduce casualmente le proprie cure e il proprio danno.</gray>"
  幻影灵魂: "<red>DPS <blue>magico</blue> a distanza.</red>|<gray>Attaccare nemici o curare alleati accumula marchi su di loro.</gray>|<gray>Detonare i marchi causa casualmente cura/danno/controllo/amplificazione del danno.</gray>"
  梦魇咒术师: "<gray>Usa diverse combinazioni di abilità per danno/cura/tanking e tutte le funzioni.</gray>"
