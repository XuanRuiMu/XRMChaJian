职业描述:
  奥能法师: "<red>DPS <blue>sihir</blue> jarak jauh, kerusakan stabil.</red>|<gray>Memiliki kemampuan kontrol kerumunan.</gray>"
  战斗法师: "<red>DPS <blue>sihir</blue> jarak jauh, DPS <gray>fisik</gray> jarak dekat, kerusakan burst.</red>|<gray>Mengumpulkan sumber daya untuk kerusakan burst.</gray>"
  符文法师: "<red>DPS <blue>sihir</blue> jarak dekat.</red>|<gray>Unggul dalam menahan kerusakan <blue>sihir</blue>. Menggunakan keterampilan untuk pengurangan kerusakan masif atau kerusakan burst.</gray>"
  大魔导师: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Setelah melemparkan keterampilan penguatan yang berbeda, melepaskan proyektil <blue>sihir</blue> dengan efek bervariasi.</gray>"
  德鲁伊: "<red>DPS <gray>fisik</gray> jarak dekat, DPS <blue>sihir</blue> jarak jauh.</red>|<green>Penyembuhan berkelanjutan.</green>"
  精灵卫士: "<red>DPS <blue>sihir</blue> jarak jauh. Semua kerusakan adalah AoE jarak pendek.</red>|<gray>Kerusakan pribadi rendah, tetapi dapat memposisikan ulang diri dan sekutu.</gray>|<gray>Dapat mengumpulkan Pecahan Bintang untuk kerusakan atau pengurangan kerusakan sekutu.</gray>"
  树人守卫: "<gray>Mengalihkan untuk mendapatkan pengurangan kerusakan masif, tetapi memperlambat diri.</gray>|<red>Kerusakan keterampilan dan pengurangan kerusakan yang kuat.</red>|<green>Penyembuhan diri yang mengesankan.</green>"
  荆棘领主: "<green>Curi nyawa yang kuat.</green>|<red>Memanggil duri di area, merusak musuh dan menerapkan kerentanan.</red>"
  枪炮师: "<red>DPS <gray>fisik</gray> jarak jauh.</red>|<red>Berdiri diam meningkatkan peluang serangan kritis.</red>|<red>Memberikan kerusakan ekstra pada target dengan kesehatan tinggi.</red>"
  机械师: "<red>DPS <gray>fisik</gray> jarak dekat, kerusakan stabil.</red>|<red>Serangan menerapkan pendarahan pada musuh.</red>|<gray>Kemampuan pelestarian diri yang kuat.</gray>"
  修补匠: "<gray>Beralih antara tiga bentuk berbeda untuk menangani berbagai situasi.</gray>|<gray>Dapat menerapkan perangkat mekanik.</gray>"
  狐灵法师: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Kerusakan lebih rendah, tetapi dapat memperkuat sekutu.</gray>"
  蛇影刺客: "<red>DPS mantra jarak dekat, kerusakan burst.</red>|<red>Bergantung pada kombo untuk kerusakan masif.</red>"
  鹿灵祭司: "<red>Dapat menerapkan kerentanan pada musuh.</red>|<green>Sekutu yang menyerang target rentan menyembuhkan pelempar.</green>"
  虎威战士: "<green>Ketahanan dan regenerasi kesehatan meningkat saat kesehatan menurun.</green>|<gray>Menyimpan kerusakan yang diterima dalam waktu singkat untuk ditukar dengan perisai burst.</gray>"
  灵魂行者: "<green>Penyembuhan area luas atau kontrol kerumunan.</green>|<green>Penyembuhan target tunggal lebih rendah, tetapi berbagi kesehatan dengan sekutu.</green>"
  骑士: "<red>DPS <gray>fisik</gray> jarak dekat.</red>|<green>Keterampilan kekebalan dengan cooldown pendek.</green>|<green>Kemampuan penyembuhan yang mengesankan.</green>"
  牧师: "<green>Penyembuhan meningkat seiring bertambahnya kesehatan yang hilang dari target.</green>|<green>Penyembuhan kritis memberikan manfaat tambahan.</green>"
  神谕者: "<red>DPS mantra jarak dekat.</red>|<gray>Beberapa keterampilan memengaruhi sekutu dan musuh.</gray>|<gray>Dapat secara bersamaan meningkatkan kerusakan dan kerusakan yang diterima target, sambil memberikan perisai dan kerentanan.</gray>"
  战地统帅: "<red>DPS <gray>fisik</gray> jarak dekat, kerusakan burst.</red>|<gray>Mendapat tumpukan setiap kali sekutu terdekat melempar keterampilan.</gray>|<gray>Menggunakan sumber daya ini untuk kerusakan atau penyembuhan sekutu.</gray>|<green>Memiliki aura pengurangan kerusakan area.</green>"
  影舞者: "<red>DPS <gray>fisik</gray> jarak dekat.</red>|<red>Menyerang dari belakang target memberikan kerusakan ekstra.</red>|<red>Memiliki kemampuan eksekusi.</red>"
  暗影术士: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<red>Memberikan kerusakan pada musuh meninggalkan tanda.</red>|<red>Meledakkan tanda melalui keterampilan menyebabkan kerusakan AoE dan menyebarkan tanda.</red>"
  冰霜战士: "<red>Kesehatan lebih tinggi berarti kerusakan lebih tinggi.</red>|<gray>Keterampilan dapat membekukan musuh.</gray>|<red>Memberikan kerusakan bonus pada target yang dibekukan.</red>"
  暗影守卫: "<green>Pengurangan kerusakan pasif meningkat dengan lebih banyak musuh terdekat.</green>|<green>Menarik musuh terdekat dan menyembuhkan diri.</green>|<green>Menyerap kerusakan dan mengubahnya menjadi kesehatan seiring waktu.</green>|<green>Dapat membuat sekutu sementara kebal.</green>"
  末日预言者: "<green>Setelah menerapkan Doa Kiamat pada sekutu, merusak musuh menyembuhkan sekutu.</green>|<gray>Dapat melemparkan kontrol kerumunan area luas.</gray>|<green>Saat mendekati kematian, memulihkan kesehatan sendiri.</green>"
  死灵收割者: "<red>Kerusakan <gray>fisik</gray> dan <blue>sihir</blue> jarak dekat.</red>|<gray>Mendapat Sisaan sementara saat memberikan kerusakan atau saat musuh terdekat mati.</gray>|<gray>Mengonsumsi Sisaan untuk melepaskan keterampilan kuat untuk kerusakan.</gray>"
  女巫: "<red>DPS <blue>sihir</blue> jarak jauh, kerusakan DEBUFF interval panjang, kerusakan AoE.</red>|<green>Penyembuhan area cooldown tinggi.</green>|<green>Dapat memberikan kekebalan terhadap kerusakan masif pada diri dan sekutu.</green>"
  沸血战士: "<red>Keterampilan aktif terus-menerus mengonsumsi kesehatan sendiri untuk penguatan.</red>|<red>Setelah aktivasi, mendapat efek Haus Darah per detik, meningkatkan kerusakan yang diterima.</red>|<gray>Dapat melepaskan sumber daya ini untuk penguatan tambahan.</gray>|<red>Di bawah 50% kesehatan, mendapatkan Cleave dan penguatan ekstra lainnya.</red>"
  雷电督军: "<red>DPS <blue>sihir</blue> jarak jauh, kerusakan stabil.</red>|<gray>Memiliki keterampilan kontrol yang kuat.</gray>|<red>Beberapa kerusakan memberikan ekstra pada perisai.</red>|<red>Sebagian besar keterampilan memantul secara acak ke musuh terdekat lainnya.</red>"
  平衡术士: "<red>DPS <gray>fisik</gray>/<blue>sihir</blue> jarak jauh.</red>|<gray>Keterampilan dibagi menjadi beberapa tipe.</gray>|<red>Menggunakan keterampilan tipe berbeda dari sebelumnya memberikan kerusakan bonus.</red>"
  深渊吞噬者: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Keterampilan dapat menerapkan DEBUFF pada diri sendiri; lepaskan secara aktif untuk menerapkan DEBUFF ini pada musuh terdekat dan menyembuhkan diri.</gray>|<green>Saat mendekati kematian, menelan musuh terdekat dan memulihkan <dark_green><bold>kesehatan</bold></dark_green>.</green>"
  混沌使者: "<red>DPS <blue>sihir</blue> jarak dekat, kerusakan lebih rendah.</red>|<gray>Keterampilan dapat menerapkan DEBUFF acak pada musuh dan mengurangi kekuatan serangan mereka.</gray>|<gray>Saat terkena kontrol kerumunan, dapat mentransfernya ke musuh terdekat.</gray>"
  时空旅行家: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<green>Dapat merekam dan memundurkan kesehatan sekutu, memberikan perisai nilai acak dan pengurangan kerusakan.</green>|<red>Menerapkan kerusakan meningkat dan perlambatan pada musuh.</red>|<gray>Secara acak meningkatkan atau mengurangi penyembuhan dan kerusakan sendiri.</gray>"
  幻影灵魂: "<red>DPS <blue>sihir</blue> jarak jauh.</red>|<gray>Menyerang musuh atau menyembuhkan sekutu menumpuk tanda pada mereka.</gray>|<gray>Meledakkan tanda secara acak menyebabkan penyembuhan/kerusakan/kontrol/peningkatan kerusakan.</gray>"
  梦魇咒术师: "<gray>Menggunakan kombinasi keterampilan berbeda untuk kerusakan/penyembuhan/tanking dan semua fungsi.</gray>"
